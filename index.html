  _actualizarSistemaLote7(delta){
    var lote=this._lote7;
    if(!lote) return;
    var dt=delta/1000;

    if(lote.fase>=2){
      var ingresoActual = LOTE7_INGRESO_BS;
      if(lote.fase>=4) ingresoActual = LOTE7_INGRESO_BS_N3;
      else if(lote.fase>=3) ingresoActual = LOTE7_INGRESO_BS_N2;
      lote._ingresoTimer+=delta;
      if(lote._ingresoTimer>=LOTE7_INGRESO_MS){
        lote._ingresoTimer-=LOTE7_INGRESO_MS;
        lote.acumuladoDinero = (lote.acumuladoDinero || 0) + ingresoActual;
        this._actualizarVisualRecogida7();
      }
      if((lote.acumuladoDinero || 0) > 0){
        var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE7_BOTON_X,LOTE7_BOTON_Y);
        if(dist<36){
          var recolectado=lote.acumuladoDinero;
          lote.acumuladoDinero=0;
          this._actualizarVisualRecogida7();
          this.dinero+=recolectado;
          this.hudDinero.setText('Bs. '+this.dinero);
          AudioMgr.playRecogerDinero(this);
          var av=this.add.text(LOTE7_BOTON_X,LOTE7_BOTON_Y-30,'+Bs. '+recolectado,{
            fontFamily:"'Press Start 2P'",fontSize:'9px',
            color:'#66FF66',stroke:'#000000',strokeThickness:2
          }).setOrigin(0.5).setDepth(60);
          this.tweens.add({
            targets:av,y:LOTE7_BOTON_Y-70,alpha:0,duration:1200,
            onComplete:function(){ av.destroy(); }
          });
        }
      }

      if(lote.fase===2 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN2=Phaser.Math.Distance.Between(this.px,this.py,NIVEL2_LOTE7_ZONA_X,NIVEL2_LOTE7_ZONA_Y);
        if(distN2<70){
          lote._acumN2 += VELOCIDAD_COMPRA_NIVEL2_LOTE7*dt;
          var enterosN2=Math.floor(lote._acumN2);
          if(enterosN2>0){
            lote._acumN2-=enterosN2;
            var faltanteN2=PRECIO_NIVEL2_LOTE7-(lote.gastadoNivel2||0);
            var aCobrarN2=Math.min(enterosN2,faltanteN2,this.dinero);
            if(aCobrarN2>0){
              lote.gastadoNivel2=(lote.gastadoNivel2||0)+aCobrarN2;
              this.dinero-=aCobrarN2;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel2Lote7();
            if(lote.gastadoNivel2>=PRECIO_NIVEL2_LOTE7){
              lote.gastadoNivel2=PRECIO_NIVEL2_LOTE7;
              lote.fase=3;
              this._subirANivel2Lote7();
            }
          }
        }
      }

      if(lote.fase===3 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN3=Phaser.Math.Distance.Between(this.px,this.py,NIVEL3_LOTE7_ZONA_X,NIVEL3_LOTE7_ZONA_Y);
        if(distN3<70){
          lote._acumN3 += VELOCIDAD_COMPRA_NIVEL3_LOTE7*dt;
          var enterosN3=Math.floor(lote._acumN3);
          if(enterosN3>0){
            lote._acumN3-=enterosN3;
            var faltanteN3=PRECIO_NIVEL3_LOTE7-(lote.gastadoNivel3||0);
            var aCobrarN3=Math.min(enterosN3,faltanteN3,this.dinero);
            if(aCobrarN3>0){
              lote.gastadoNivel3=(lote.gastadoNivel3||0)+aCobrarN3;
              this.dinero-=aCobrarN3;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel3Lote7();
            if(lote.gastadoNivel3>=PRECIO_NIVEL3_LOTE7){
              lote.gastadoNivel3=PRECIO_NIVEL3_LOTE7;
              lote.fase=4;
              this._subirANivel3Lote7();
            }
          }
        }
      }
      return;
    }

    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE7_BOTON_X,LOTE7_BOTON_Y);
    if(dist<70){
      lote._acum+=VELOCIDAD_COMPRA_LOTE7*dt;
      var enteros=Math.floor(lote._acum);
      if(enteros>0){
        lote._acum-=enteros;
        var esTerreno=(lote.fase===0);
        var precio  =esTerreno?PRECIO_LOTE7_TERRENO:PRECIO_LOTE7_ESTRUCTURA;
        var gKey    =esTerreno?'gastadoTerreno':'gastadoEstructura';
        var faltante=precio-lote[gKey];
        var aCobrar =Math.min(enteros,faltante,this.dinero);
        if(aCobrar>0){
          lote[gKey]+=aCobrar;
          this.dinero-=aCobrar;
          this.hudDinero.setText('Bs. '+this.dinero);
        }
        this._dibujarProgresoLote7();
        if(lote[gKey]>=precio){
          lote[gKey]=precio;
          if(esTerreno){ lote.fase=1; this._aparecerTerreno7(); }
          else          { lote.fase=2; this._aparecerEstructura7(); }
        }
      }
    }
  }

  _actualizarSistemaLote8(delta){
    var lote=this._lote8;
    if(!lote) return;
    var dt=delta/1000;

    if(lote.fase>=2){
      var ingresoActual = LOTE8_INGRESO_BS;
      if(lote.fase>=4) ingresoActual = LOTE8_INGRESO_BS_N3;
      else if(lote.fase>=3) ingresoActual = LOTE8_INGRESO_BS_N2;
      lote._ingresoTimer+=delta;
      if(lote._ingresoTimer>=LOTE8_INGRESO_MS){
        lote._ingresoTimer-=LOTE8_INGRESO_MS;
        lote.acumuladoDinero = (lote.acumuladoDinero || 0) + ingresoActual;
        this._actualizarVisualRecogida8();
      }
      if((lote.acumuladoDinero || 0) > 0){
        var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE8_BOTON_X,LOTE8_BOTON_Y);
        if(dist<36){
          var recolectado=lote.acumuladoDinero;
          lote.acumuladoDinero=0;
          this._actualizarVisualRecogida8();
          this.dinero+=recolectado;
          this.hudDinero.setText('Bs. '+this.dinero);
          AudioMgr.playRecogerDinero(this);
          var av=this.add.text(LOTE8_BOTON_X,LOTE8_BOTON_Y-30,'+Bs. '+recolectado,{
            fontFamily:"'Press Start 2P'",fontSize:'9px',
            color:'#66FF66',stroke:'#000000',strokeThickness:2
          }).setOrigin(0.5).setDepth(60);
          this.tweens.add({
            targets:av,y:LOTE8_BOTON_Y-70,alpha:0,duration:1200,
            onComplete:function(){ av.destroy(); }
          });
        }
      }

      if(lote.fase===2 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN2=Phaser.Math.Distance.Between(this.px,this.py,NIVEL2_LOTE8_ZONA_X,NIVEL2_LOTE8_ZONA_Y);
        if(distN2<70){
          lote._acumN2 += VELOCIDAD_COMPRA_NIVEL2_LOTE8*dt;
          var enterosN2=Math.floor(lote._acumN2);
          if(enterosN2>0){
            lote._acumN2-=enterosN2;
            var faltanteN2=PRECIO_NIVEL2_LOTE8-(lote.gastadoNivel2||0);
            var aCobrarN2=Math.min(enterosN2,faltanteN2,this.dinero);
            if(aCobrarN2>0){
              lote.gastadoNivel2=(lote.gastadoNivel2||0)+aCobrarN2;
              this.dinero-=aCobrarN2;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel2Lote8();
            if(lote.gastadoNivel2>=PRECIO_NIVEL2_LOTE8){
              lote.gastadoNivel2=PRECIO_NIVEL2_LOTE8;
              lote.fase=3;
              this._subirANivel2Lote8();
            }
          }
        }
      }

      if(lote.fase===3 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN3=Phaser.Math.Distance.Between(this.px,this.py,NIVEL3_LOTE8_ZONA_X,NIVEL3_LOTE8_ZONA_Y);
        if(distN3<70){
          lote._acumN3 += VELOCIDAD_COMPRA_NIVEL3_LOTE8*dt;
          var enterosN3=Math.floor(lote._acumN3);
          if(enterosN3>0){
            lote._acumN3-=enterosN3;
            var faltanteN3=PRECIO_NIVEL3_LOTE8-(lote.gastadoNivel3||0);
            var aCobrarN3=Math.min(enterosN3,faltanteN3,this.dinero);
            if(aCobrarN3>0){
              lote.gastadoNivel3=(lote.gastadoNivel3||0)+aCobrarN3;
              this.dinero-=aCobrarN3;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel3Lote8();
            if(lote.gastadoNivel3>=PRECIO_NIVEL3_LOTE8){
              lote.gastadoNivel3=PRECIO_NIVEL3_LOTE8;
              lote.fase=4;
              this._subirANivel3Lote8();
            }
          }
        }
      }
      return;
    }

    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE8_BOTON_X,LOTE8_BOTON_Y);
    if(dist<70){
      lote._acum+=VELOCIDAD_COMPRA_LOTE8*dt;
      var enteros=Math.floor(lote._acum);
      if(enteros>0){
        lote._acum-=enteros;
        var esTerreno=(lote.fase===0);
        var precio  =esTerreno?PRECIO_LOTE8_TERRENO:PRECIO_LOTE8_ESTRUCTURA;
        var gKey    =esTerreno?'gastadoTerreno':'gastadoEstructura';
        var faltante=precio-lote[gKey];
        var aCobrar =Math.min(enteros,faltante,this.dinero);
        if(aCobrar>0){
          lote[gKey]+=aCobrar;
          this.dinero-=aCobrar;
          this.hudDinero.setText('Bs. '+this.dinero);
        }
        this._dibujarProgresoLote8();
        if(lote[gKey]>=precio){
          lote[gKey]=precio;
          if(esTerreno){ lote.fase=1; this._aparecerTerreno8(); }
          else          { lote.fase=2; this._aparecerEstructura8(); }
        }
      }
    }
  }

  _dibujarProgresoLote9(){
    var lote=this._lote9;
    if(!lote||!lote.barraFill) return;
    var bw=60, bh=8, x=LOTE9_BOTON_X, y=LOTE9_BOTON_Y;
    var esTerreno=(lote.fase===0);
    var precio  =esTerreno?PRECIO_LOTE9_TERRENO:PRECIO_LOTE9_ESTRUCTURA;
    var gastado =esTerreno?lote.gastadoTerreno:lote.gastadoEstructura;
    lote.barraFill.clear();
    if(gastado<=0){ lote.barraFondo.setVisible(false); return; }
    lote.barraFondo.clear().setVisible(true);
    lote.barraFondo.fillStyle(0x000000,0.6);
    lote.barraFondo.fillRoundedRect(x-bw/2,y+16,bw,bh,2);
    var pct=Phaser.Math.Clamp(gastado/precio,0,1);

  _actualizarSistemaLote9(delta){
    var lote=this._lote9;
    if(!lote) return;
    var dt=delta/1000;
    if(lote.fase>=2){
      var ingresoActual = LOTE9_INGRESO_BS;
      if(lote.fase>=4) ingresoActual = LOTE9_INGRESO_BS_N3;
      else if(lote.fase>=3) ingresoActual = LOTE9_INGRESO_BS_N2;
      lote._ingresoTimer+=delta;
      if(lote._ingresoTimer>=LOTE9_INGRESO_MS){
        lote._ingresoTimer-=LOTE9_INGRESO_MS;
        lote.acumuladoDinero=(lote.acumuladoDinero||0)+ingresoActual;
        this._actualizarVisualRecogida9();
      }
      if((lote.acumuladoDinero||0)>0){
        var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE9_BOTON_X,LOTE9_BOTON_Y);
        if(dist<36){
          var recolectado=lote.acumuladoDinero;
          lote.acumuladoDinero=0;
          this._actualizarVisualRecogida9();
          this.dinero+=recolectado;
          this.hudDinero.setText('Bs. '+this.dinero);
          AudioMgr.playRecogerDinero(this);
          var av=this.add.text(LOTE9_BOTON_X,LOTE9_BOTON_Y-30,'+Bs. '+recolectado,{
            fontFamily:"'Press Start 2P'",fontSize:'9px',
            color:'#66FF66',stroke:'#000000',strokeThickness:2
          }).setOrigin(0.5).setDepth(60);
          this.tweens.add({targets:av,y:LOTE9_BOTON_Y-70,alpha:0,duration:1200,onComplete:function(){av.destroy();}});
        }
      }
      if(lote.fase===2&&!this._pausado&&!this._dialogo&&!this._tutorialActivo){
        var distN2=Phaser.Math.Distance.Between(this.px,this.py,NIVEL2_LOTE9_ZONA_X,NIVEL2_LOTE9_ZONA_Y);
        if(distN2<70){
          lote._acumN2+=VELOCIDAD_COMPRA_NIVEL2_LOTE9*dt;
          var enterosN2=Math.floor(lote._acumN2);
          if(enterosN2>0){
            lote._acumN2-=enterosN2;
            var faltanteN2=PRECIO_NIVEL2_LOTE9-(lote.gastadoNivel2||0);
            var aCobrarN2=Math.min(enterosN2,faltanteN2,this.dinero);
            if(aCobrarN2>0){
              lote.gastadoNivel2=(lote.gastadoNivel2||0)+aCobrarN2;
              this.dinero-=aCobrarN2;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel2Lote9();
            if(lote.gastadoNivel2>=PRECIO_NIVEL2_LOTE9){
              lote.gastadoNivel2=PRECIO_NIVEL2_LOTE9;
              lote.fase=3;
              this._subirANivel2Lote9();
            }
          }
        }
      }
      if(lote.fase===3&&!this._pausado&&!this._dialogo&&!this._tutorialActivo){
        var distN3=Phaser.Math.Distance.Between(this.px,this.py,NIVEL3_LOTE9_ZONA_X,NIVEL3_LOTE9_ZONA_Y);
        if(distN3<70){
          lote._acumN3+=VELOCIDAD_COMPRA_NIVEL3_LOTE9*dt;
          var enterosN3=Math.floor(lote._acumN3);
          if(enterosN3>0){
            lote._acumN3-=enterosN3;
            var faltanteN3=PRECIO_NIVEL3_LOTE9-(lote.gastadoNivel3||0);
            var aCobrarN3=Math.min(enterosN3,faltanteN3,this.dinero);
            if(aCobrarN3>0){
              lote.gastadoNivel3=(lote.gastadoNivel3||0)+aCobrarN3;
              this.dinero-=aCobrarN3;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel3Lote9();
            if(lote.gastadoNivel3>=PRECIO_NIVEL3_LOTE9){
              lote.gastadoNivel3=PRECIO_NIVEL3_LOTE9;
              lote.fase=4;
              this._subirANivel3Lote9();
            }
          }
        }
      }
      return;
    }
    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE9_BOTON_X,LOTE9_BOTON_Y);
    if(dist<70){
      lote._acum+=VELOCIDAD_COMPRA_LOTE9*dt;
      var enteros=Math.floor(lote._acum);
      if(enteros>0){
        lote._acum-=enteros;
        var esTerreno=(lote.fase===0);
        var precio  =esTerreno?PRECIO_LOTE9_TERRENO:PRECIO_LOTE9_ESTRUCTURA;
        var gKey    =esTerreno?'gastadoTerreno':'gastadoEstructura';
        var faltante=precio-lote[gKey];
        var aCobrar =Math.min(enteros,faltante,this.dinero);
        if(aCobrar>0){
          lote[gKey]+=aCobrar;
          this.dinero-=aCobrar;
          this.hudDinero.setText('Bs. '+this.dinero);
        }
        this._dibujarProgresoLote9();
        if(lote[gKey]>=precio){
          lote[gKey]=precio;
          if(esTerreno){ lote.fase=1; this._aparecerTerreno9(); }
          else          { lote.fase=2; this._aparecerEstructura9(); }
        }
      }
    }
  }

    var g=this.add.graphics().setDepth(50);
    if(etapa<2){

      g.fillStyle(d.color,0.16); g.fillRect(d.x-24,d.y-24,48,48);

    var precio=this.add.text(d.x,d.y+4,'Bs. '+d.precio,{fontFamily:"'Press Start 2P'",fontSize:'9px',color:'#FFFFFF',stroke:'#000',strokeThickness:2}).setOrigin(0.5).setDepth(51);

  _dibujarProgresoLote10(etapa){
    var lote=this._lote10, ui=lote&&lote.ui[etapa];
    if(!ui) return;
    var d=this._datosEtapaLote10(etapa), gastado=lote[d.gastado]||0, fondo=ui[3], barra=ui[4];
    barra.clear();
    if(gastado<=0){ fondo.setVisible(false); return; }
    fondo.clear().setVisible(true);
    fondo.fillStyle(0x000000,0.6); fondo.fillRoundedRect(d.x-30,d.y+16,60,8,2);
    barra.fillStyle(d.color,1); barra.fillRoundedRect(d.x-28,d.y+18,56*Phaser.Math.Clamp(gastado/d.precio,0,1),4,2);
    ui[2].setText('Bs.'+Math.floor(gastado)+' / '+d.precio);
  }

  _actualizarSistemaLote10(delta){
    var lote=this._lote10;
    if(!lote) return;
    if(lote.fase>=2){
      var ingreso=lote.fase>=4?LOTE10_INGRESO_BS_N3:(lote.fase>=3?LOTE10_INGRESO_BS_N2:LOTE10_INGRESO_BS);
      lote._ingresoTimer+=delta;
      if(lote._ingresoTimer>=LOTE10_INGRESO_MS){
        lote._ingresoTimer-=LOTE10_INGRESO_MS;
        lote.acumuladoDinero=(lote.acumuladoDinero||0)+ingreso;
        this._actualizarVisualRecogida10();
      }
      if((lote.acumuladoDinero||0)>0 && Phaser.Math.Distance.Between(this.px,this.py,LOTE10_BOTON_X,LOTE10_BOTON_Y)<36){
        var recolectado=lote.acumuladoDinero;
        lote.acumuladoDinero=0; this._actualizarVisualRecogida10();
        this.dinero+=recolectado; this.hudDinero.setText('Bs. '+this.dinero); AudioMgr.playRecogerDinero(this);
        var av=this.add.text(LOTE10_BOTON_X,LOTE10_BOTON_Y-30,'+Bs. '+recolectado,{fontFamily:"'Press Start 2P'",fontSize:'9px',color:'#66FF66',stroke:'#000',strokeThickness:2}).setOrigin(0.5).setDepth(60);
        this.tweens.add({targets:av,y:LOTE10_BOTON_Y-70,alpha:0,duration:1200,onComplete:function(){av.destroy();}});
      }
    }
    if(this._pausado||this._dialogo||this._tutorialActivo||lote.fase>=4) return;
    var etapa=lote.fase<2?lote.fase:(lote.fase===2?2:3), d=this._datosEtapaLote10(etapa);
    if(Phaser.Math.Distance.Between(this.px,this.py,d.x,d.y)>=70) return;
    lote._acum[etapa]+=d.velocidad*(delta/1000);
    var enteros=Math.floor(lote._acum[etapa]);
    if(enteros<=0) return;
    lote._acum[etapa]-=enteros;
    var cobrar=Math.min(enteros,d.precio-(lote[d.gastado]||0),this.dinero);
    if(cobrar>0){ lote[d.gastado]+=cobrar; this.dinero-=cobrar; this.hudDinero.setText('Bs. '+this.dinero); }
    this._dibujarProgresoLote10(etapa);
    if(lote[d.gastado]>=d.precio){
      lote[d.gastado]=d.precio;
      this._completarEtapaLote10(etapa);
    }
  }

  _completarEtapaLote10(etapa){
    var scene=this, lote=this._lote10, recompensa, mensaje, ingreso, color;
    this._destruirZonaLote10(etapa);
    if(etapa===0){
      lote.fase=1; this._restaurarTerreno10(true);
      this.time.delayedCall(800,function(){scene._dibujarZonaLote10(1);});
      this.time.delayedCall(300,function(){scene._mostrarRecompensa(RECOMPENSA_LOTE10_TERRENO,'¡Compraste el 10mo lote!');});
      return;
    }
    if(etapa===1){
      lote.fase=2; this._aparecerEstructura10();
      return;
    }
    lote.fase=etapa===2?3:4;
    if(lote.lblNivel) lote.lblNivel.setText(etapa===2?'★  NIVEL 2':'★  NIVEL 3');
    recompensa=etapa===2?RECOMPENSA_LOTE10_NIVEL2:RECOMPENSA_LOTE10_NIVEL3;
    mensaje=etapa===2?'¡Hotel Los Tajibos subió a Nivel 2!':'¡Hotel Los Tajibos subió a Nivel 3!';
    ingreso=etapa===2?LOTE10_INGRESO_BS_N2:LOTE10_INGRESO_BS_N3;
    color=etapa===2?'#FF5555':'#CC66FF';
    AudioMgr.playFX(scene);
    var av=scene.add.text(LOTE10_X,LOTE10_Y-68,mensaje+'\n+Bs.'+ingreso+' cada 3s',{fontFamily:"'Press Start 2P'",fontSize:'8px',color:color,stroke:'#000',strokeThickness:2,align:'center'}).setOrigin(0.5).setDepth(60);
    scene.tweens.add({targets:av,y:LOTE10_Y-110,alpha:0,duration:2000,onComplete:function(){av.destroy();}});
    if(etapa===2) scene.time.delayedCall(800,function(){scene._dibujarZonaLote10(3);});
    scene.time.delayedCall(300,function(){scene._mostrarRecompensa(recompensa,mensaje);});
  }

  _restaurarTerreno10(animar){

      var iw=IMG_LOTE_SECO.width||200, ih=IMG_LOTE_SECO.height||160, MAX=250;

  // ══════════════════════════════════════════════════
  //  SISTEMA: ALCALDÍA
  //  Bloqueada al inicio; se desbloquea al llegar el Lote 1 Y el
  //  Lote 2 a Nivel 3 (fase>=4). El jugador se para en el círculo
  //  dorado frente al edificio y el precio (Bs.300.000) se
  //  descuenta solo, poco a poco, hasta desbloquearla.
  // ══════════════════════════════════════════════════

  _crearSistemaAlcaldia(){
    var sv=this._alcaldiaSave||null;
    this._alcaldia={
      desbloqueada: sv?!!sv.desbloqueada:false,
      gastado:      sv?(sv.gastado||0):0,
      _acum:0, _zonaCreada:false, _labelVisible:false,
      edificio:null, sombra:null, overlay:null, candado:null, textoInfo:null,
      circulo:null, textoTitulo:null, textoPrecio:null,
      barraFondo:null, barraFill:null, labelE:null
    };
    this._dibujarEdificioAlcaldia();
    if(this._alcaldia.desbloqueada){
      // Ya estaba desbloqueada en la partida guardada: sin candado ni zona de pago
      this._alcaldia._zonaCreada=true;
      this._crearLabelMejorasAlcaldia();
    } else {
      var cumpleYa = this._lote && this._lote.fase>=4 && this._lote2 && this._lote2.fase>=4;
      if(cumpleYa){
        // La condición ya se cumplía al cargar la partida: la zona de
        // pago aparece directamente, sin animación de "aparecer".
        this._alcaldia._zonaCreada=true;
        this._dibujarZonaCompraAlcaldia(false);
      } else {
        this._dibujarCandadoAlcaldia();
      }
    }
  }

  // Dibuja el edificio grande de la alcaldía (siempre visible, esté
  // bloqueada o no) en el espacio de la antigua calle norte.
  _dibujarEdificioAlcaldia(){
    var a=this._alcaldia;
    a.sombra=this.add.ellipse(ALCALDIA_X,ALCALDIA_Y+ALCALDIA_ALTO/2-6,ALCALDIA_ANCHO*0.72,36,0x000000,0.28).setDepth(40);
    a.edificio=this.add.image(ALCALDIA_X,ALCALDIA_Y,'alcaldia')
      .setDisplaySize(ALCALDIA_ANCHO,ALCALDIA_ALTO).setOrigin(0.5).setDepth(41);
  }

  // Overlay oscuro + candado + texto con el requisito de desbloqueo,
  // visible mientras la alcaldía está bloqueada.
  _dibujarCandadoAlcaldia(){
    var a=this._alcaldia;
    a.overlay=this.add.rectangle(ALCALDIA_X,ALCALDIA_Y,ALCALDIA_ANCHO,ALCALDIA_ALTO,0x000000,0.55).setDepth(42);
    if(this.textures.exists('icono_candado')){
      a.candado=this.add.image(ALCALDIA_X,ALCALDIA_Y-16,'icono_candado').setDisplaySize(70,70).setDepth(43);
    } else {

  // Dibuja el círculo DORADO de pago frente a la alcaldía. Si animar
  // es true, aparece con el mismo efecto "chico → grande" (Back.easeOut)
  // que usan los edificios de los demás lotes al construirse.
  _dibujarZonaCompraAlcaldia(animar){
    var scene=this, a=this._alcaldia;
    var x=ALCALDIA_ZONA_X, y=ALCALDIA_ZONA_Y;
    ['circulo','textoTitulo','textoPrecio','barraFondo','barraFill'].forEach(function(k){
      if(a[k]){ try{a[k].destroy();}catch(e){} a[k]=null; }
    });

    a.textoTitulo=this.add.text(x,y-56,'DESBLOQUEAR\nALCALDÍA',{
      fontFamily:"'Press Start 2P'",fontSize:'7px',color:'#FFD700',

    }).setOrigin(0.5).setDepth(51);

    }).setOrigin(0.5).setDepth(51);
    a.barraFondo=this.add.graphics().setDepth(51).setVisible(false);

      }).setOrigin(0.5).setDepth(60);

  // Redibuja la barra de progreso y el texto del costo de la zona dorada
  _dibujarProgresoAlcaldia(){
    var a=this._alcaldia;
    if(!a||!a.barraFill) return;
    var bw=64, bh=8, x=ALCALDIA_ZONA_X, y=ALCALDIA_ZONA_Y;
    var gastado=a.gastado||0;
    a.barraFill.clear();
    if(gastado<=0){ a.barraFondo.setVisible(false); return; }
    a.barraFondo.clear().setVisible(true);
    a.barraFondo.fillStyle(0x000000,0.6);
    a.barraFondo.fillRoundedRect(x-bw/2,y+16,bw,bh,2);
    var pct=Phaser.Math.Clamp(gastado/PRECIO_ALCALDIA,0,1);
    a.barraFill.fillStyle(0xFFD700,1);
    a.barraFill.fillRoundedRect(x-bw/2+2,y+18,(bw-4)*pct,bh-4,2);
    a.textoPrecio.setText('Bs.'+Math.floor(gastado)+' / '+PRECIO_ALCALDIA);
  }

  // true si el punto (px,py) cae dentro del edificio de la alcaldía
  // (para que el jugador nunca lo atraviese caminando).
  _colisionaConAlcaldia(px,py){
    var halfW=ALCALDIA_COL_ANCHO/2, halfH=ALCALDIA_COL_ALTO/2;
    return (px>ALCALDIA_X-halfW && px<ALCALDIA_X+halfW && py>ALCALDIA_Y-halfH && py<ALCALDIA_Y+halfH);
  }

  // Llamado cada frame: revisa si ya se cumple la condición de
  // desbloqueo (Lote 1 y Lote 2 en Nivel 3), muestra/actualiza la
  // zona dorada de pago, y descuenta dinero mientras el jugador
  // esté parado encima.
  _actualizarAlcaldia(delta){
    var scene=this, a=this._alcaldia;
    if(!a) return;

    // Ya desbloqueada: solo se encarga de mostrar/ocultar la etiqueta [E]
    if(a.desbloqueada){
      if(a.labelE){
        var distU=Phaser.Math.Distance.Between(this.px,this.py,ALCALDIA_ZONA_X,ALCALDIA_ZONA_Y);
        var cerca=distU<90;
        if(cerca && !a._labelVisible){ a._labelVisible=true; scene.tweens.add({targets:a.labelE,alpha:1,duration:200}); }
        else if(!cerca && a._labelVisible){ a._labelVisible=false; scene.tweens.add({targets:a.labelE,alpha:0,duration:200}); }
      }
      return;
    }

    var lista = this._lote && this._lote.fase>=4 && this._lote2 && this._lote2.fase>=4;
    if(lista && !a._zonaCreada){
      a._zonaCreada=true;
      this._quitarCandadoAlcaldia();
      this._dibujarZonaCompraAlcaldia(true);
    }
    if(!lista) return; // sigue bloqueada, todavía no se cumple el requisito

    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    var dt=delta/1000;
    var dist=Phaser.Math.Distance.Between(this.px,this.py,ALCALDIA_ZONA_X,ALCALDIA_ZONA_Y);
    if(dist<70){
      a._acum += VELOCIDAD_COMPRA_ALCALDIA*dt;
      var enteros=Math.floor(a._acum);
      if(enteros>0){
        a._acum-=enteros;
        var faltante=PRECIO_ALCALDIA-a.gastado;
        var aCobrar=Math.min(enteros,faltante,this.dinero);
        if(aCobrar>0){
          a.gastado+=aCobrar;
          this.dinero-=aCobrar;
          this.hudDinero.setText('Bs. '+this.dinero);
        }
        this._dibujarProgresoAlcaldia();
        if(a.gastado>=PRECIO_ALCALDIA){
          a.gastado=PRECIO_ALCALDIA;
          a.desbloqueada=true;
          this._desbloquearAlcaldia();
        }
      }
    }
  }

  // ══════════════════════════════════════════════════
  //  SISTEMA: IGLESIA 24 DE SEPTIEMBRE (RECOMPENSA FINAL)
  //  Visible desde el inicio, al lado de la Alcaldía, pero
  //  bloqueada y oscurecida (candado) hasta cumplir TODOS los
  //  requisitos. Se desbloquea sola, sin costo, con una
  //  animación de cámara que se aleja para mostrar el mapa
  //  completo como celebración final.
  // ══════════════════════════════════════════════════

  _crearSistemaIglesia(){
    var sv=this._iglesiaSave||null;
    this._iglesia={
      desbloqueada: sv?!!sv.desbloqueada:false,
      edificio:null, sombra:null, overlay:null, candado:null, textoInfo:null
    };
    this._dibujarEdificioIglesia();
    if(this._iglesia.desbloqueada){
      // Ya estaba desbloqueada en la partida guardada: sin candado.
    } else if(this._cumpleRequisitosIglesia()){
      // La condición ya se cumplía al cargar la partida: se
      // desbloquea directamente, sin repetir la animación de cámara.
      this._iglesia.desbloqueada=true;
    } else {
      this._dibujarCandadoIglesia();
    }
  }

  // Dibuja el edificio de la iglesia (siempre visible, esté
  // bloqueada o no) al lado de la Alcaldía.
  _dibujarEdificioIglesia(){
    var ig=this._iglesia;
    ig.sombra=this.add.ellipse(IGLESIA_X,IGLESIA_Y+IGLESIA_ALTO/2-6,IGLESIA_ANCHO*0.72,32,0x000000,0.28).setDepth(40);
    ig.edificio=this.add.image(IGLESIA_X,IGLESIA_Y,'iglesia')
      .setDisplaySize(IGLESIA_ANCHO,IGLESIA_ALTO).setOrigin(0.5).setDepth(41);
  }

  // Overlay oscuro + candado + texto con los requisitos, visible
  // mientras la iglesia sigue bloqueada.
  _dibujarCandadoIglesia(){
    var ig=this._iglesia;
    ig.overlay=this.add.rectangle(IGLESIA_X,IGLESIA_Y,IGLESIA_ANCHO,IGLESIA_ALTO,0x000000,0.6).setDepth(42);
    if(this.textures.exists('icono_candado')){
      ig.candado=this.add.image(IGLESIA_X,IGLESIA_Y-14,'icono_candado').setDisplaySize(64,64).setDepth(43);
    } else {
      ig.candado=this.add.text(IGLESIA_X,IGLESIA_Y-14,'🔒',{fontSize:'42px'}).setOrigin(0.5).setDepth(43);
    }
    ig.textoInfo=this.add.text(IGLESIA_X,IGLESIA_Y+IGLESIA_ALTO/2+28,
      'IGLESIA 24 DE SEPTIEMBRE\n(RECOMPENSA FINAL) BLOQUEADA\n\nRequisitos:\n· 10 establecimientos en Nivel 3\n· Alcaldía desbloqueada\n· Personaje con mejoras máximas\n· Plaza completamente decorada',
      {fontFamily:"'Press Start 2P'",fontSize:'7px',color:'#FFD700',stroke:'#000',strokeThickness:2,align:'center',lineSpacing:5}
    ).setOrigin(0.5).setDepth(43);
  }

  // Quita el candado/overlay (se llama justo antes de restaurar la iglesia)
  _quitarCandadoIglesia(){
    var ig=this._iglesia;
    ['overlay','candado','textoInfo'].forEach(function(k){
      if(ig[k]){ try{ig[k].destroy();}catch(e){} ig[k]=null; }
    });
  }

  // Revisa si se cumplen TODOS los requisitos de la recompensa final:
  // los 10 lotes en Nivel 3 (fase>=4), la Alcaldía desbloqueada, la
  // habilidad Velocidad al máximo nivel, y la plaza completamente
  // decorada (todas las bancas, faroles, árboles y patujúes comprados).
  _cumpleRequisitosIglesia(){
    var lotes=[this._lote,this._lote2,this._lote3,this._lote4,this._lote5,
               this._lote6,this._lote7,this._lote8,this._lote9,this._lote10];
    for(var i=0;i<lotes.length;i++){
      if(!lotes[i] || lotes[i].fase<4) return false;
    }
    if(!this._alcaldia || !this._alcaldia.desbloqueada) return false;
    if((this.habilidadVelocidad||0) < HABILIDAD_VEL_PRECIOS.length) return false;
    for(var b=0;b<this.zonasBanca.length;b++){ if(!this.zonasBanca[b].comprada) return false; }
    for(var f=0;f<this.zonasFarol.length;f++){ if(!this.zonasFarol[f].comprada) return false; }
    for(var a=0;a<this.zonasArbol.length;a++){ if(!this.zonasArbol[a].comprada) return false; }
    for(var p=0;p<this.zonasPatuju.length;p++){ if(!this.zonasPatuju[p].comprada) return false; }
    return true;
  }

  // Llamado cada frame: en cuanto se cumplen todos los requisitos,
  // desbloquea la iglesia automáticamente (sin costo) y dispara la
  // celebración final.
  _actualizarIglesia(delta){
    var ig=this._iglesia;
    if(!ig || ig.desbloqueada) return;
    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    if(this._cumpleRequisitosIglesia()) this._desbloquearIglesia();
  }

  // Se cumplieron todos los requisitos: la iglesia queda restaurada y
  // desbloqueada para siempre, sin costo, con una gran celebración.
  _desbloquearIglesia(){
    var scene=this, ig=this._iglesia;
    ig.desbloqueada=true;
    // El juego terminó: se borra la partida guardada y se marca como
    // completado para que el menú principal ya no ofrezca "CARGAR PARTIDA"
    // (ver MenuScene). También se apaga el autoguardado para que no vuelva
    // a crear un save mientras corre la cinemática final/créditos.
    this._detenerAutoguardado();
    borrarPartida();
    marcarCompletado();
    this._quitarCandadoIglesia();
    this.cameras.main.flash(400,255,215,0,true);
    AudioMgr.playFX(this);
    var av=this.add.text(IGLESIA_X,IGLESIA_Y+IGLESIA_ALTO/2+10,'¡Iglesia 24 de Septiembre\nrestaurada!',{
      fontFamily:"'Press Start 2P'",fontSize:'9px',color:'#FFD700',stroke:'#000',strokeThickness:3,align:'center'
    }).setOrigin(0.5).setDepth(60);
    this.tweens.add({targets:av,y:av.y-50,alpha:0,duration:2400,onComplete:function(){av.destroy();}});
    this.time.delayedCall(600,function(){
      scene._reproducirAnimacionMapaCompleto();
    });
  }

  // Oculta todo el HUD fijo en pantalla (dinero, objetivos, pausa,
  // joystick, botón E, pantalla completa) mientras dura la cinemática
  // final. FIX: el zoom de la cámara principal (cam.zoomTo) afecta
  // también a los elementos con scrollFactor(0) — el HUD no se mueve
  // con el mapa, pero SÍ se encoge/reacomoda con el zoom, y por eso se
  // veía "todo distorsionado" al alejarse la cámara. La solución es
  // ocultar el HUD durante el zoom y volver a mostrarlo al terminar.
  _ocultarHUDJuego(){
    var lista=[];
    this.children.list.forEach(function(obj){
      if(obj.scrollFactorX===0 && obj.depth>=199 && obj.depth<=270 && obj.visible){
        lista.push(obj);
        obj.setVisible(false);
      }
    });
    this._hudOcultoCinematica=lista;
  }
  _mostrarHUDJuego(){
    (this._hudOcultoCinematica||[]).forEach(function(obj){
      try{ obj.setVisible(true); }catch(e){}
    });
    this._hudOcultoCinematica=null;
  }

  // Animación final: SIN zoom ni alejamiento de cámara (se quitó a
  // pedido, distorsionaba el HUD/mapa). En su lugar, el personaje camina
  // automáticamente hacia la iglesia (como si el jugador lo controlara),
  // con la cámara siguiéndolo con el mismo "startFollow" de siempre.
  // Al llegar, se muestra el panel de victoria y se pasa a los créditos.
  _reproducirAnimacionMapaCompleto(){
    var scene=this;
    this._dialogo=true; // congela el control manual del jugador durante la cinemática
    this._ocultarHUDJuego();
    // La cámara sigue al jugador con this.cameras.main.startFollow(this.jugador,...)
    // desde que arrancó GameScene: no se toca el zoom ni el follow, así que
    // simplemente lo acompaña mientras camina, sin ningún efecto de cámara.

    var msg=this.add.text(640,60,'¡PLAZA 24 DE SEPTIEMBRE\nCOMPLETADA!',{
      fontFamily:"'Press Start 2P'",fontSize:'14px',color:'#FFD700',
      stroke:'#000',strokeThickness:4,align:'center'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(500).setAlpha(0);
    this.tweens.add({targets:msg,alpha:1,duration:600});

    // Punto de destino: justo frente a la puerta de la iglesia.
    var destX=IGLESIA_X, destY=IGLESIA_Y+IGLESIA_ALTO/2+30;
    var origX=this.px, origY=this.py;
    var distancia=Phaser.Math.Distance.Between(origX,origY,destX,destY);
    var duracion=Phaser.Math.Clamp(distancia*4.2,1200,4500);

    var prog={t:0};
    this.tweens.add({
      targets:prog, t:1, duration:duracion, ease:'Sine.easeInOut',
      onUpdate:function(){
        var nx=Phaser.Math.Linear(origX,destX,prog.t);
        var ny=Phaser.Math.Linear(origY,destY,prog.t);
        var dx=nx-scene.px, dy=ny-scene.py;
        scene.px=nx; scene.py=ny;
        // Mismo criterio de sprites direccionales que usa el control manual.
        var tex='char_front';
        if(Math.abs(dy)>Math.abs(dx)) tex = dy<0?'char_back':'char_front';
        else tex = dx<0?'char_left':'char_right';
        scene._lastTex=tex;
        if(scene.jugador) scene.jugador.setTexture(tex);
        var bob=Math.sin(prog.t*Math.PI*8)*3.5;
        if(scene.jugador) scene.jugador.setPosition(scene.px,scene.py+bob);
        if(scene.sombra) scene.sombra.setPosition(scene.px,scene.py+14);
      },
      onComplete:function(){
        // Llega y queda mirando hacia la puerta de la iglesia.
        if(scene.jugador) scene.jugador.setTexture('char_back');
        scene.time.delayedCall(1800,function(){
          scene.tweens.add({targets:msg,alpha:0,duration:500,onComplete:function(){
            msg.destroy();
            scene._mostrarPanelVictoriaFinal();
          }});
        });
      }
    });
  }

  // Panel estilo "PAUSA" que anuncia la finalización de la plaza.
  // Se muestra durante 5 segundos; el jugador no puede hacer nada
  // mientras tanto (this._dialogo sigue en true). Al terminar, oscurece
  // la pantalla y arranca los créditos.
  _mostrarPanelVictoriaFinal(){
    var scene=this;
    var ov=this.add.rectangle(640,360,1280,720,0x000000,0.62).setScrollFactor(0).setDepth(510);
    var g=this.add.graphics().setScrollFactor(0).setDepth(511);
    g.fillStyle(0x03015E,0.97); g.fillRoundedRect(220,220,840,280,16);
    g.lineStyle(3,0x3A70D0,1); g.strokeRoundedRect(220,220,840,280,16);
    g.lineStyle(1,0xFFD700,0.35); g.strokeRoundedRect(228,228,824,264,12);
    g.fillStyle(0xFFD700,1);
    [[220,220],[1050,220],[220,490],[1050,490]].forEach(function(p){ g.fillRect(p[0],p[1],10,10); });
    var titulo=this.add.text(640,300,'¡HAS COMPLETADO LA\nPLAZA PRINCIPAL\n24 DE SEPTIEMBRE!',{
      fontFamily:"'Press Start 2P'",fontSize:'17px',color:'#FFD700',
      stroke:'#000',strokeThickness:4,align:'center',lineSpacing:10
    }).setOrigin(0.5).setScrollFactor(0).setDepth(512).setAlpha(0);
    this.tweens.add({targets:titulo,alpha:1,duration:500});
    scene.time.delayedCall(5000,function(){
      [ov,g,titulo].forEach(function(o){ try{o.destroy();}catch(e){} });
      scene._iniciarCreditosFinales();
    });
  }

  // Oscurece toda la pantalla y, al terminar el fundido, pasa a la
  // escena de créditos finales (CreditsScene).
  _iniciarCreditosFinales(){
    var scene=this;
    var fade=this.add.rectangle(640,360,1280,720,0x000000,1).setScrollFactor(0).setDepth(520).setAlpha(0);
    this.tweens.add({targets:fade,alpha:1,duration:1200,onComplete:function(){
      scene.scene.start('CreditsScene');
    }});
  }
}

/* =====================================================
   ESCENA: OPCIONES
===================================================== */

class OptionsScene extends Phaser.Scene {
  constructor(){ super('OptionsScene'); }
  create(){
    var scene=this;
    var fromPause = scene.scene.isActive('PauseScene') || scene.scene.isPaused('PauseScene');
    if(!fromPause){
      this.add.image(640,360,'menu').setDisplaySize(1280,720);
    }
    this.add.rectangle(640,360,1280,720,0x000000, fromPause ? 0.75 : 0.68);
    var g=this.add.graphics();
    g.fillStyle(0x03015E,0.97); g.fillRoundedRect(310,110,660,500,22);
    g.lineStyle(3,0x3A70D0,1); g.strokeRoundedRect(310,110,660,500,22);
    g.lineStyle(1,0x1E3A80,1); g.lineBetween(350,178,930,178);
    this.add.text(640,148,'OPCIONES',{fontFamily:"'Press Start 2P'",fontSize:'20px',color:'#FFFFFF',stroke:'#000',strokeThickness:4}).setOrigin(0.5);
    this.ctrl(640,298,'MUSICA',this.registry.get('volMusica')||6,function(v){
      scene.registry.set('volMusica',v);
      AudioMgr.setBGMVolume(v/10);
    });
    this.ctrl(640,448,'SONIDO FX',this.registry.get('volFX')||8,function(v){
      scene.registry.set('volFX',v);
      if(AudioMgr._sonidoFX) AudioMgr._sonidoFX.setVolume(v/10);
      if(AudioMgr._sonidoRecoger) AudioMgr._sonidoRecoger.setVolume(v/10);
      if(AudioMgr._sonidoBien) AudioMgr._sonidoBien.setVolume(v/10);
    });
    var b=this.add.text(640,560,'<  VOLVER',{fontFamily:"'Press Start 2P'",fontSize:'14px',color:'#fff',stroke:'#000',strokeThickness:3}).setOrigin(0.5).setInteractive({useHandCursor:true});
    b.on('pointerover',function(){ b.setColor('#ffff00'); }); b.on('pointerout',function(){ b.setColor('#fff'); });
    b.on('pointerdown',function(){
      // FIX: PauseScene ahora queda pausada (this.scene.pause()) al abrir
      // Opciones desde ahí, no solo oculta — así que isActive() ya no la
      // detecta (una escena pausada no cuenta como "activa" en Phaser).
      // Por eso se chequea también isPaused(), y se hace resume() además
      // de setVisible(true) para reanudarla de verdad.
      if(scene.scene.isActive('PauseScene') || scene.scene.isPaused('PauseScene')){
        scene.scene.resume('PauseScene');
        scene.scene.setVisible(true, 'PauseScene');
        scene.scene.stop('OptionsScene');
      } else {
        scene.scene.start('MenuScene');
      }
    });
    this.input.keyboard.on('keydown-ESC',function(){
      if(scene.scene.isActive('PauseScene') || scene.scene.isPaused('PauseScene')){
        scene.scene.resume('PauseScene');
        scene.scene.setVisible(true, 'PauseScene');
        scene.scene.stop('OptionsScene');
      } else {
        scene.scene.start('MenuScene');
      }
    });
  }
  ctrl(cx,cy,lbl,vi,cb){
    var S=10,BW=30,BH=32,G=5,TW=S*BW+(S-1)*G,sx=cx-TW/2,st={v:vi};
    this.add.text(cx,cy-56,lbl,{fontFamily:"'Press Start 2P'",fontSize:'13px',color:'#FFFFFF'}).setOrigin(0.5);
    var bars=[]; for(var i=0;i<S;i++) bars.push(this.add.graphics());
    var pct=this.add.text(cx,cy+48,vi*10+'%',{fontFamily:"'Press Start 2P'",fontSize:'11px',color:'#ccc'}).setOrigin(0.5);
    function dr(v){ bars.forEach(function(b2,j){ b2.clear(); b2.fillStyle(j<v?(j<4?0x00CC44:j<7?0xDDAA00:0xFF4400):0x182050); b2.fillRoundedRect(sx+j*(BW+G),cy-BH/2,BW,BH,4); }); pct.setText(v*10+'%'); }
    dr(vi);
    var bL=this.add.text(sx-42,cy-9,'<',{fontFamily:"'Press Start 2P'",fontSize:'22px',color:'#FFFFFF'}).setInteractive({useHandCursor:true});
    var bR=this.add.text(sx+TW+20,cy-9,'>',{fontFamily:"'Press Start 2P'",fontSize:'22px',color:'#FFFFFF'}).setInteractive({useHandCursor:true});
    bL.on('pointerdown',function(){ if(st.v>0){ st.v--; dr(st.v); cb(st.v); } });
    bR.on('pointerdown',function(){ if(st.v<S){ st.v++; dr(st.v); cb(st.v); } });
    bL.on('pointerover',function(){ bL.setColor('#ffff00'); }); bL.on('pointerout',function(){ bL.setColor('#FFFFFF'); });
    bR.on('pointerover',function(){ bR.setColor('#ffff00'); }); bR.on('pointerout',function(){ bR.setColor('#FFFFFF'); });
    var z=this.add.zone(cx,cy,TW,BH+14).setInteractive();
    z.on('pointerdown',function(p){ var r=Phaser.Math.Clamp(Math.round((p.x-sx)/TW*S),0,S); st.v=r; dr(r); cb(r); });
  }
}

    this.input.keyboard.on('keydown-ESC',function(){ scene.scene.stop('ExitScene'); scene.scene.resume('GameScene'); });
  }
}

/* =====================================================
   INICIAR PHASER
===================================================== */
var game = new Phaser.Game({
  type: Phaser.AUTO,
  width: 1280,
  height: 720,
  backgroundColor: '#000000',
  // ── Escala responsive (PC + móvil)
  // FIX: con Phaser.Scale.FIT el lienzo se "encoge" para caber completo
  // dentro de la pantalla del celular, dejando franjas negras a los
  // costados (o arriba/abajo) cuando la proporción del teléfono no es
  // igual a 16:9. Eso es lo que se veía como "la cámara se aleja y todo
  // sale distorsionado": en realidad el juego no ocupaba toda la
  // pantalla. Con ENVELOP el lienzo se agranda hasta cubrir TODA la
  // pantalla (sin franjas negras) manteniendo siempre la proporción
  // original, así que no hay estiramiento ni distorsión: como mucho se
  // recorta un poco de los bordes, igual que una foto en modo "cover".
  scale: {
    mode: Phaser.Scale.ENVELOP,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: 1280,
    height: 720
  },
  // ── Audio compatible con apertura directa de index.html (sin servidor)
  audio: {
    disableWebAudio: false,
    noAudio: false
  },
  input: {
    activePointers: 4   // multi-touch para el D-pad
  },
  scene: [BootScene, MenuScene, OptionsScene, IntroScene, GameScene, PauseScene, ExitScene, CreditsScene]
});
window.game = game;
AudioMgr.init(game);
</script>
