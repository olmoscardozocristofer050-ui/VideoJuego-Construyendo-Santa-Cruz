/* Helper: convierte array de rects a canvas */
function rectToCanvas(data, ox, oy, cw, ch, mirror) {
  var c=document.createElement('canvas'); c.width=cw; c.height=ch;
  var ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;
  if(mirror){ ctx.save(); ctx.translate(cw,0); ctx.scale(-1,1); }
  data.forEach(function(r){
    if(r[4]&&r[4]!=='transparent'&&r[4]!=='none'&&r[4]!==''){
      ctx.fillStyle=r[4]; ctx.fillRect(r[0]-ox,r[1]-oy,r[2],r[3]);
    }
  });
  if(mirror) ctx.restore();
  return c;
}

/* =====================================================
   SAVE / LOAD — localStorage
===================================================== */
var SAVE_KEY='mamen_save', STARTED_KEY='mamen_started', COMPLETED_KEY='mamen_completado';
var SAVE_VERSION=11; // v11: se sube porque guardarPartida() antes descartaba en
                      // silencio los lotes/alcaldía/habilidad al guardar, y los ids
                      // de las bancas 1-8 estaban duplicados. Cualquier partida vieja
                      // (v10 o menor) queda incompleta/incoherente, así que se
                      // descarta automáticamente en vez de ofrecerla para cargar.
// FIX (guardado/carga "a veces falla sin avisar"): antes guardarPartida()
// tragaba cualquier error de localStorage.setItem (cuota llena, modo
// privado de Safari/iOS que bloquea localStorage, etc.) y el botón de
// PAUSA mostraba igual "✔ Partida guardada" aunque en realidad NO se había
// guardado nada. Ahora guardarPartida()/cargarPartida() devuelven true/false
// según si la operación realmente funcionó, para que la UI pueda avisar de
// verdad cuando algo falla en vez de mentir con un mensaje de éxito.
function guardarPartida(dinero,px,py,extra){
  try{
    var data={v:SAVE_VERSION,dinero:dinero,px:px,py:py,ts:Date.now()};
    if(extra){
      // FIX: antes solo se copiaban "zonas" y "npcBancasVisto", y todo lo
      // demás que arma _construirDatosGuardado() (los 10 lotes/estructuras,
      // la alcaldía y la habilidad de velocidad) se descartaba en silencio.
      // Por eso al cargar partida desaparecían todas las estructuras y
      // niveles ya comprados. Ahora se copian TODOS los campos de extra.
      for(var k in extra){
        if(Object.prototype.hasOwnProperty.call(extra,k)) data[k]=extra[k];
      }
    }
    var texto=JSON.stringify(data);
    localStorage.setItem(SAVE_KEY,texto);
    // Algunos navegadores (sobre todo en modo privado) no lanzan error al
    // hacer setItem pero tampoco guardan nada de verdad. Se relee para
    // confirmar que el guardado quedó realmente escrito.
    return localStorage.getItem(SAVE_KEY)===texto;
  }catch(e){ console.warn('No se pudo guardar la partida:', e); return false; }
}
function cargarPartida(){
  try{
    var d=localStorage.getItem(SAVE_KEY);
    if(!d) return null;
    var obj=JSON.parse(d);
    // Ignora (y descarta) guardados de versiones anteriores — por ejemplo
    // los que quedaron grabados por error con la versión vieja que
    // guardaba automáticamente al salir sin que el jugador lo pidiera.
    if(!obj || obj.v!==SAVE_VERSION){ borrarPartida(); return null; }
    return obj;
  }catch(e){ console.warn('No se pudo leer la partida guardada (dato corrupto), se descarta:', e); borrarPartida(); return null; }
}
function borrarPartida(){ try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(STARTED_KEY); }catch(e){} }
function juegoIniciado(){ return !!localStorage.getItem(STARTED_KEY); }
function marcarIniciado(){ try{ localStorage.setItem(STARTED_KEY,'1'); }catch(e){} }
// ── Juego completado (ver CreditsScene / _desbloquearIglesia): una vez que
// el jugador termina el juego (construye y mejora todo y la iglesia se
// restaura), la partida guardada deja de tener sentido, así que se borra y
// se marca "completado" para que el menú principal ya no ofrezca "CARGAR
// PARTIDA" y "INICIAR" arranque siempre una partida nueva sin preguntar.
function marcarCompletado(){ try{ localStorage.setItem(COMPLETED_KEY,'1'); }catch(e){} }
function limpiarCompletado(){ try{ localStorage.removeItem(COMPLETED_KEY); }catch(e){} }
function juegoCompletado(){ return !!localStorage.getItem(COMPLETED_KEY); }


/* =====================================================
   AUDIO — gestión centralizada (autoplay + BGM)
===================================================== */
var AudioMgr = {
  _bgm: null,
  _sonidoFX: null,
  _inited: false,
  _game: null,
  init: function(game){
    if(this._inited) return;
    this._inited = true;
    this._game = game;
    var self = this;
    function unlock(){
      self._desbloqueado = true;
      if(self._bgm && !self._bgm.isPlaying) self._bgm.play();
    }
    game.sound.once(Phaser.Sound.Events.UNLOCKED, unlock);
    // FIX: game.input (el InputManager global) no tiene método .on() en
    // esta versión de Phaser — llamarlo tiraba "is not a function" y
    // cortaba TODO el arranque del juego antes de llegar al menú.
    // Usamos eventos nativos del navegador, que siempre funcionan.
    window.addEventListener('pointerdown', unlock, {passive:true});
    window.addEventListener('keydown', unlock);
    if(!game.sound.locked) this._desbloqueado = true;
  },
  volMusica: function(scene){ return (scene.registry.get('volMusica') !== undefined ? scene.registry.get('volMusica') : 6) / 10; },
  volFX: function(scene){ return (scene.registry.get('volFX') !== undefined ? scene.registry.get('volFX') : 8) / 10; },
  playBGM: function(scene, key){
    if(!scene.cache.audio.exists(key)) return null;
    var vol = this.volMusica(scene);
    var snd = this._game ? this._game.sound : scene.sound;
    if(this._bgm){
      if(this._bgm.key === key){
        if(!this._bgm.isPlaying){
          var s = this;
          var play = function(){ if(s._bgm) s._bgm.play(); };
          if(snd.locked) snd.once(Phaser.Sound.Events.UNLOCKED, play);
          else play();
        }
        this._bgm.setVolume(vol);
        return this._bgm;
      }
      this._bgm.stop();
      this._bgm.destroy();
      this._bgm = null;
    }
    this._bgm = snd.add(key, { loop: true, volume: vol });
    var self = this;
    var playNew = function(){ if(self._bgm) self._bgm.play(); };
    if(snd.locked) snd.once(Phaser.Sound.Events.UNLOCKED, playNew);
    else playNew();
    return this._bgm;
  },
  stopBGM: function(){
    if(this._bgm){ this._bgm.stop(); this._bgm.destroy(); this._bgm = null; }
  },
  setBGMVolume: function(v){
    if(this._bgm) this._bgm.setVolume(v);
  },
  getSonido: function(scene){
    if(!scene.cache.audio.exists('sonido_boton')) return null;
    if(!this._sonidoFX){
      this._sonidoFX = scene.sound.add('sonido_boton', { volume: this.volFX(scene) });
    } else {
      this._sonidoFX.setVolume(this.volFX(scene));
    }
    return this._sonidoFX;
  },
  playFX: function(scene){
    var s = this.getSonido(scene);
    if(s) s.play();
  },
  getSonidoRecoger: function(scene){
    if(!scene.cache.audio.exists('sonido_recoger_dinero')) return null;
    if(!this._sonidoRecoger){
      this._sonidoRecoger = scene.sound.add('sonido_recoger_dinero', { volume: this.volFX(scene) });
    } else {
      this._sonidoRecoger.setVolume(this.volFX(scene));
    }
    return this._sonidoRecoger;
  },
  playRecogerDinero: function(scene){
    var s = this.getSonidoRecoger(scene);
    if(s) s.play();
  },
  getSonidoBien: function(scene){
    if(!scene.cache.audio.exists('sonido_bien')) return null;
    if(!this._sonidoBien){
      this._sonidoBien = scene.sound.add('sonido_bien', { volume: this.volFX(scene) });
    } else {
      this._sonidoBien.setVolume(this.volFX(scene));
    }
    return this._sonidoBien;
  },
  playSonidoBien: function(scene){
    var s = this.getSonidoBien(scene);
    if(s) s.play();
  },
  getSonidoAdvertencia: function(scene){
    if(!scene.cache.audio.exists('sonido_advertencia')) return null;
    if(!this._sonidoAdvertencia){
      this._sonidoAdvertencia = scene.sound.add('sonido_advertencia', { volume: this.volFX(scene) });
    } else {
      this._sonidoAdvertencia.setVolume(this.volFX(scene));
    }
    return this._sonidoAdvertencia;
  },
  // Se reproduce cuando aparece el aviso rojo del ladrón o el de la
  // protesta ("¡CUIDADO! VIENE UN LADRÓN" / "¡HAY PROTESTA EN LA PLAZA!").
  playAdvertencia: function(scene){
    var s = this.getSonidoAdvertencia(scene);
    if(s) s.play();
  }
};


/* =====================================================
   HELPERS
===================================================== */
function RR(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function AW(ctx,x,y,w,h,color){
  ctx.fillStyle=color; ctx.fillRect(x,y,w,h);
  ctx.beginPath(); ctx.arc(x+w/2,y,w/2,Math.PI,0); ctx.fill();
}

===================================================== */
function dibujarPlaza(ctx){
  ctx.save(); ctx.imageSmoothingEnabled=false;

/* Fondo local del menú: intenta usar fondo_santa_cruz.txt (base64);
   si no existe, no pasa nada — se queda con el fondo dibujado. */
function crearTexturaMenu(scene, cb){
  cargarTexturaBase64(scene,'txt/fondo_principio.txt','menu', function(ok){
    if(!ok) crearTexturaMenuFallback(scene);
    cb(ok);
  });
}
/* Loader genérico: cualquier archivo .txt con una imagen en base64 se
   convierte en textura de Phaser bajo la clave "key". Se usa para
   fondo_santa_cruz.txt (fondo del menú) y para los fondos de césped
   del mapa. Si el archivo no existe o el texto no es una imagen
   válida, cb(false) y el juego sigue funcionando con lo que ya tenía. */
function cargarTexturaBase64(scene, archivo, key, cb){
  var MAX_LADO = 1600; // limite seguro para evitar problemas de memoria/WebGL con fotos gigantes
  fetch(archivo)
    .then(function(r){ if(!r.ok) throw new Error('no encontrado: '+archivo); return r.text(); })
    .then(function(txt){
      var raw=txt.trim();
      var dataUrl = raw.indexOf('data:')===0 ? raw : 'data:image/png;base64,'+raw;
      var img=new Image();
      img.onload=function(){
        try{
          var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
          if(!w || !h){ cb(false); return; }
          if(w>MAX_LADO || h>MAX_LADO){
            // FIX: fotos muy grandes (fotos de celular en alta resolución)
            // pueden hacer que WebGL pierda el contexto y toda la pantalla
            // se ponga negra unos segundos después de cargar. Las
            // reducimos a un tamaño seguro antes de usarlas como textura.
            var esc=Math.min(MAX_LADO/w, MAX_LADO/h);
            var cw=Math.round(w*esc), ch=Math.round(h*esc);
            var c=document.createElement('canvas'); c.width=cw; c.height=ch;
            c.getContext('2d').drawImage(img,0,0,cw,ch);
            if(scene.textures.exists(key)) scene.textures.remove(key);
            scene.textures.addCanvas(key,c);
          } else {
            if(scene.textures.exists(key)) scene.textures.remove(key);
            scene.textures.addImage(key,img);
          }
          cb(true);
        }catch(e){ cb(false); }
      };
      img.onerror=function(){ cb(false); };
      img.src=dataUrl;
    })
    .catch(function(){ cb(false); });
}
function crearTexturaMenuFallback(scene){
  // Antes se dibujaba aquí la plaza/iglesia con formas (dibujarPlaza),
  // lo que se veía como un "flash" tosco tipo vector unos segundos
  // al recargar, mientras se cargaba la foto real. Ahora el respaldo
  // es simplemente negro; los botones del menú NO se tocan, se crean
  // aparte en crearUIPlacaMenu().
  var c=document.createElement('canvas'); c.width=1280; c.height=720;
  var ctx=c.getContext('2d');
  ctx.fillStyle='#000000'; ctx.fillRect(0,0,1280,720);
  if(scene.textures.exists('menu')) scene.textures.remove('menu');
  scene.textures.addCanvas('menu',c);
}
/* FIX: esta función se llamaba en varias partes del código pero nunca
   estaba definida (causaba "crearTexturaMenuLocal is not defined" y
   dejaba la pantalla en negro). Dibuja el fondo de forma síncrona con
   canvas para que el juego arranque siempre, sin depender de red. */
function crearTexturaMenuLocal(scene){
  crearTexturaMenuFallback(scene);
}
/* Intenta reemplazar el fondo del menú por la imagen base64 guardada
   en fondo_santa_cruz.txt (si existe). Si falla o no existe, no pasa
   nada: se queda con el fondo dibujado por canvas. imgObj es el
   this.add.image(...,'menu') ya creado en la escena, para refrescarlo
   en cuanto la imagen real termine de cargar. */
/* Zoom fijo del fondo del menú (efecto "lupa"): se usa tanto al crearlo
   como al refrescarlo con la imagen real, para que no se note un salto
   de tamaño cuando termina de cargar. */
var MENU_BG_ZOOM=1.16;
function aplicarFondoDesdeArchivo(scene, imgObj){
  crearTexturaMenu(scene, function(ok){
    if(ok && imgObj && imgObj.active){
      imgObj.setTexture('menu').setDisplaySize(1280*MENU_BG_ZOOM,720*MENU_BG_ZOOM);
    }
  });
}

    if(scene.textures.exists(key)) return;

}

/* UI del menú (título + barra inferior) */
function crearUIPlacaMenu(scene){
  function diamante(x,y,s){
    // FIX: los objetos Graphics de Phaser no tienen .rotate()/.save()/
    // .restore() como un canvas normal — eso tiraba "g.rotate is not
    // a function" y frenaba todo el menú. Dibujamos el diamante
    // directo con sus 4 puntas, sin necesitar rotación.
    var g=scene.add.graphics({x:x,y:y}).setDepth(5);
    g.fillStyle(0xFFFFFF,1);
    g.beginPath();
    g.moveTo(0,-s); g.lineTo(s,0); g.lineTo(0,s); g.lineTo(-s,0);
    g.closePath();
    g.fillPath();
    return g;

  // de la imagen de fondo (fondo_santa_cruz.txt), así que no lo
  // volvemos a dibujar aquí para evitar el texto duplicado/montado.
  var bar=scene.add.graphics().setDepth(5);
  bar.fillStyle(0x03015E,1); bar.fillRect(0,648,1280,72);
  bar.fillStyle(0x1A3AB0,1); bar.fillRect(0,645,1280,5);

}

/* Textura de reemplazo del mercado (canvas) mientras carga el SVG real */
function crearTexturaMercadoFallback(scene){
  var c=document.createElement('canvas'); c.width=300; c.height=240;
  var x=c.getContext('2d');
  x.fillStyle='#059669'; x.fillRect(0,210,300,30);
  x.fillStyle='#F97316'; x.fillRect(18,78,264,132);
  x.fillStyle='#DC2626'; x.fillRect(16,46,268,38);
  x.fillStyle='#FFFFFF'; x.font='bold 17px Arial Black,sans-serif'; x.textAlign='center';
  x.fillText('HIPERMAXI',150,73);
  x.fillStyle='#FACC15'; x.fillRect(18,86,264,3);
  x.fillStyle='rgba(96,165,250,0.88)'; x.fillRect(88,98,124,112);
  x.strokeStyle='#374151'; x.lineWidth=2; x.strokeRect(88,98,124,112);
  x.fillStyle='rgba(147,197,253,0.9)';
  x.fillRect(111,118,44,92); x.fillRect(157,118,44,92);
  x.fillStyle='rgba(0,0,0,0.3)'; x.beginPath(); x.ellipse(150,222,130,8,0,0,Math.PI*2); x.fill();
  if(scene.textures.exists('mercado_hipermaxi')) scene.textures.remove('mercado_hipermaxi');
  scene.textures.addCanvas('mercado_hipermaxi',c);
}
/* Carga el SVG real del mercado como textura Phaser en paralelo */
function cargarTexturaMercado(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=300; c.height=240;
        c.getContext('2d').drawImage(img,0,0,300,240);
        if(window.game&&window.game.textures){
          if(window.game.textures.exists('mercado_hipermaxi')) window.game.textures.remove('mercado_hipermaxi');
          window.game.textures.addCanvas('mercado_hipermaxi',c);
        }
      }catch(e){ console.warn('Error dibujando SVG mercado:',e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG del mercado'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MERCADO_SVG);
  }catch(e){ console.warn('Error preparando SVG mercado:',e); }
}

/* Imagen del terreno seco (lote_seco.txt en base64) */
var IMG_LOTE_SECO=null;
function cargarImagenLoteSecoGlobal(){
  fetch('txt/lote_seco.txt')
    .then(function(r){ if(!r.ok) throw new Error('no encontrado: txt/lote_seco.txt'); return r.text(); })
    .then(function(txt){
      var raw=txt.trim();
      var dataUrl=raw.indexOf('data:')===0?raw:'data:image/png;base64,'+raw;
      var img=new Image();
      img.onload=function(){ IMG_LOTE_SECO=img; };
      img.onerror=function(){ console.warn('txt/lote_seco.txt no es una imagen válida'); };
      img.src=dataUrl;
    })
    .catch(function(){ console.warn('No se encontró txt/lote_seco.txt, se usará relleno de color'); });
}
cargarImagenLoteSecoGlobal();

/* Textura de reemplazo del 2do lote (canvas) mientras carga el SVG real */
function crearTexturaMercado2Fallback(scene){
  var c=document.createElement('canvas'); c.width=300; c.height=240;
  var x=c.getContext('2d');
  x.fillStyle='#0D1520'; x.fillRect(0,0,300,240);
  x.fillStyle='#FFF0E0'; x.fillRect(14,60,272,150);
  x.fillStyle='#A80000'; x.fillRect(10,30,280,26);
  x.fillStyle='#FFFFFF'; x.font='bold 13px Georgia,serif'; x.textAlign='center';
  x.fillText('MERCADO MUTUALISTA',150,49);
  x.fillStyle='rgba(29,42,58,0.9)';
  x.fillRect(30,95,70,110); x.fillRect(200,95,70,110);
  x.fillStyle='#8B5A35'; x.fillRect(10,196,280,14);
  x.fillStyle='rgba(0,0,0,0.3)'; x.beginPath(); x.ellipse(150,222,130,8,0,0,Math.PI*2); x.fill();
  if(scene.textures.exists('mercado_mutualista')) scene.textures.remove('mercado_mutualista');
  scene.textures.addCanvas('mercado_mutualista',c);
}
/* Carga el SVG real del 2do lote como textura Phaser en paralelo */
function cargarTexturaMercado2(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=300; c.height=240;
        c.getContext('2d').drawImage(img,0,0,300,240);
        if(window.game&&window.game.textures){
          if(window.game.textures.exists('mercado_mutualista')) window.game.textures.remove('mercado_mutualista');
          window.game.textures.addCanvas('mercado_mutualista',c);
        }
      }catch(e){ console.warn('Error dibujando SVG mercado 2:',e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG del 2do mercado'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MERCADO2_SVG);
  }catch(e){ console.warn('Error preparando SVG mercado 2:',e); }
}

function crearTexturaMercado3Fallback(scene){
  var c=document.createElement('canvas'); c.width=300; c.height=240;
  var x=c.getContext('2d');
  x.fillStyle='#7f1d1d'; x.fillRect(0,0,300,240);
  x.fillStyle='#E3DFDE'; x.fillRect(15,66,270,126);
  x.fillStyle='#dc2626'; x.fillRect(9,51,282,24);
  x.fillStyle='#78350f'; x.fillRect(15,120,270,20);
  x.fillStyle='#78350f'; x.fillRect(96,75,78,13);
  x.fillStyle='#fef08a'; x.font='bold 11px Georgia,serif'; x.textAlign='center';
  x.fillText('ESCUELA PRIMARIA',150,84);
  x.fillStyle='rgba(14,25,40,0.9)';
  x.fillRect(30,141,20,30); x.fillRect(66,141,20,30); x.fillRect(214,141,20,30); x.fillRect(250,141,20,30);
  x.fillStyle='#3f1a0a'; x.fillRect(120,141,60,51);
  x.fillStyle='rgba(0,0,0,0.3)'; x.beginPath(); x.ellipse(150,198,130,8,0,0,Math.PI*2); x.fill();
  if(scene.textures.exists('mercado_sanlorenzo')) scene.textures.remove('mercado_sanlorenzo');
  scene.textures.addCanvas('mercado_sanlorenzo',c);
}
/* Carga el SVG real del 3er lote como textura Phaser en paralelo */
function cargarTexturaMercado3(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=300; c.height=240;
        c.getContext('2d').drawImage(img,0,0,300,240);
        if(window.game&&window.game.textures){
          if(window.game.textures.exists('mercado_sanlorenzo')) window.game.textures.remove('mercado_sanlorenzo');
          window.game.textures.addCanvas('mercado_sanlorenzo',c);
        }
      }catch(e){ console.warn('Error dibujando SVG mercado 3:',e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG de la 3ra escuela'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MERCADO3_SVG);
  }catch(e){ console.warn('Error preparando SVG mercado 3:',e); }
}

/* Textura de reemplazo del 4to lote (canvas) mientras carga el SVG real */
function crearTexturaMercado4Fallback(scene){
  var c=document.createElement('canvas'); c.width=300; c.height=240;
  var x=c.getContext('2d');
  x.fillStyle='#1E40AF'; x.fillRect(0,0,300,240);
  x.fillStyle='#FCD34D'; x.fillRect(15,60,270,150);
  x.fillStyle='#3B82F6'; x.fillRect(9,40,282,28);
  x.fillStyle='#B45309'; x.fillRect(15,140,270,20);
  x.fillStyle='#1E40AF'; x.fillRect(96,66,108,13);
  x.fillStyle='#FBBF24'; x.font='bold 10px Arial,sans-serif'; x.textAlign='center';
  x.fillText('ESCUELA TECNICA',150,80);
  x.fillStyle='rgba(30,64,175,0.85)';
  x.fillRect(30,105,22,35); x.fillRect(66,105,22,35); x.fillRect(192,105,22,35); x.fillRect(228,105,22,35);
  x.fillStyle='#92400E'; x.fillRect(120,105,60,55);
  x.fillStyle='rgba(0,0,0,0.3)'; x.beginPath(); x.ellipse(150,202,130,8,0,0,Math.PI*2); x.fill();
  if(scene.textures.exists('escuela_tecnica')) scene.textures.remove('escuela_tecnica');
  scene.textures.addCanvas('escuela_tecnica',c);
}
/* Carga el SVG real del 4to lote como textura Phaser en paralelo */
function cargarTexturaMercado4(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=300; c.height=240;
        c.getContext('2d').drawImage(img,0,0,300,240);
        if(window.game&&window.game.textures){
          if(window.game.textures.exists('escuela_tecnica')) window.game.textures.remove('escuela_tecnica');
          window.game.textures.addCanvas('escuela_tecnica',c);
        }
      }catch(e){ console.warn('Error dibujando SVG mercado 4:',e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG de la Escuela Técnica'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MERCADO4_SVG);
  }catch(e){ console.warn('Error preparando SVG mercado 4:',e); }
}

/* Textura de reemplazo del 5to lote (canvas) mientras carga el SVG real */
function crearTexturaMercado5Fallback(scene){
  var c=document.createElement('canvas'); c.width=300; c.height=240;
  var x=c.getContext('2d');
  x.fillStyle='#EF4444'; x.fillRect(0,0,300,240); // Fondo rojo
  x.fillStyle='#FFFFFF'; x.fillRect(15,60,270,150); // Fachada blanca
  x.fillStyle='#16A34A'; x.fillRect(9,40,282,28); // Techo verde
  x.fillStyle='#78350F'; x.fillRect(15,140,270,20); // Mostrador de madera
  x.fillStyle='#EF4444'; x.fillRect(96,66,108,13);
  x.fillStyle='#FFFFFF'; x.font='bold 10px Arial,sans-serif'; x.textAlign='center';
  x.fillText('PIZZANCHEZ',150,80);
  x.fillStyle='rgba(220,38,38,0.85)';
  x.fillRect(30,105,22,35); x.fillRect(66,105,22,35); x.fillRect(192,105,22,35); x.fillRect(228,105,22,35);
  x.fillStyle='#92400E'; x.fillRect(120,105,60,55);
  x.fillStyle='rgba(0,0,0,0.3)'; x.beginPath(); x.ellipse(150,202,130,8,0,0,Math.PI*2); x.fill();
  if(scene.textures.exists('mercado_pizzanchez')) scene.textures.remove('mercado_pizzanchez');
  scene.textures.addCanvas('mercado_pizzanchez',c);
}

/* Carga el SVG real del 5to lote como textura Phaser en paralelo */
function cargarTexturaMercado5(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=300; c.height=240;
        c.getContext('2d').drawImage(img,0,0,300,240);
        if(window.game&&window.game.textures){
          if(window.game.textures.exists('mercado_pizzanchez')) window.game.textures.remove('mercado_pizzanchez');
          window.game.textures.addCanvas('mercado_pizzanchez',c);
        }
      }catch(e){ console.warn('Error dibujando SVG mercado 5:',e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG de Pizzanchez'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MERCADO5_SVG);
  }catch(e){ console.warn('Error preparando SVG mercado 5:',e); }
}

/* Textura de reemplazo del 6to lote (canvas) mientras carga el SVG real */
function crearTexturaMercado6Fallback(scene){
  var c=document.createElement('canvas'); c.width=300; c.height=240;
  var x=c.getContext('2d');
  x.fillStyle='#9D0208'; x.fillRect(0,0,300,240); // Fondo rojo oscuro
  x.fillStyle='#FFE8D6'; x.fillRect(15,60,270,150); // Fachada crema
  x.fillStyle='#D62828'; x.fillRect(9,40,282,28); // Techo tejas rojas
  x.fillStyle='#8B4513'; x.fillRect(15,140,270,20); // Columnas/barandilla
  x.fillStyle='#9D0208'; x.fillRect(96,66,108,13);
  x.fillStyle='#FFD700'; x.font='bold 10px Arial,sans-serif'; x.textAlign='center';
  x.fillText('RESTAURANTE',150,80);
  x.fillStyle='rgba(116,192,252,0.85)';
  x.fillRect(30,105,22,35); x.fillRect(66,105,22,35); x.fillRect(192,105,22,35); x.fillRect(228,105,22,35);
  x.fillStyle='#A0522D'; x.fillRect(120,105,60,55);
  x.fillStyle='rgba(0,0,0,0.3)'; x.beginPath(); x.ellipse(150,202,130,8,0,0,Math.PI*2); x.fill();
  if(scene.textures.exists('mercado_restaurante')) scene.textures.remove('mercado_restaurante');
  scene.textures.addCanvas('mercado_restaurante',c);
}

/* Carga el SVG real del 6to lote como textura Phaser en paralelo */
function cargarTexturaMercado6(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=300; c.height=240;
        c.getContext('2d').drawImage(img,0,0,300,240);
        if(window.game&&window.game.textures){
          if(window.game.textures.exists('mercado_restaurante')) window.game.textures.remove('mercado_restaurante');
          window.game.textures.addCanvas('mercado_restaurante',c);
        }
      }catch(e){ console.warn('Error dibujando SVG mercado 6:',e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG del Restaurante'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MERCADO6_SVG);
  }catch(e){ console.warn('Error preparando SVG mercado 6:',e); }
}

function crearTexturaMercado8Fallback(scene){
  try{
    if(scene.textures.exists('centro_salud')) return;
    var c=document.createElement('canvas'); c.width=300; c.height=240;
    var ctx=c.getContext('2d');
    // Fachada fallback hospital: paredes blancas, techo rojo, cruz roja
    ctx.fillStyle='#F5F5F5'; ctx.fillRect(30,80,240,160);
    ctx.fillStyle='#D32F2F';
    // Techo triangular
    ctx.beginPath(); ctx.moveTo(10,80); ctx.lineTo(150,30); ctx.lineTo(290,80); ctx.closePath(); ctx.fill();
    // Cruz roja en el frente
    ctx.fillStyle='#FF0000';
    ctx.fillRect(138,50,24,50); // vertical
    ctx.fillRect(118,63,64,22); // horizontal
    // Letrero
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(70,88,160,28);
    ctx.strokeStyle='#D32F2F'; ctx.lineWidth=2; ctx.strokeRect(72,90,156,24);
    ctx.fillStyle='#D32F2F'; ctx.font='bold 11px Arial'; ctx.textAlign='center';
    ctx.fillText('CENTRO DE SALUD',150,107);
    // Puerta
    ctx.fillStyle='#8B4513'; ctx.fillRect(115,170,70,70);
    // Ventanas
    ctx.fillStyle='#87CEEB';
    ctx.fillRect(45,130,50,50); ctx.fillRect(205,130,50,50);
    ctx.strokeStyle='#5C4030'; ctx.lineWidth=2;
    ctx.strokeRect(45,130,50,50); ctx.strokeRect(205,130,50,50);
    scene.textures.addCanvas('centro_salud',c);
  }catch(e){ console.warn('Error creando textura fallback centro_salud:',e); }
}

function crearTexturaMercado10Fallback(scene){
  try{
    if(scene.textures.exists('hotel_los_tajibos')) return;
    var c=document.createElement('canvas'); c.width=300; c.height=240;
    var ctx=c.getContext('2d');
    ctx.fillStyle='#B8A898'; ctx.fillRect(0,180,300,60);
    ctx.fillStyle='#8B7355'; ctx.fillRect(75,105,150,75);
    ctx.fillStyle='#4A3A2D'; ctx.fillRect(75,102,150,9);
    ctx.fillStyle='#A8C0D0'; ctx.fillRect(95,117,43,57); ctx.fillRect(162,117,43,57);
    ctx.fillStyle='#6B4F0A'; ctx.fillRect(138,117,25,63);
    ctx.fillStyle='#D4C4B0'; ctx.beginPath(); ctx.ellipse(150,102,83,27,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FFFFFF'; ctx.font='bold 10px Georgia'; ctx.textAlign='center'; ctx.fillText('los tajibos',150,141);
    scene.textures.addCanvas('hotel_los_tajibos',c);
  }catch(e){ console.warn('Error creando fallback del Hotel Los Tajibos:',e); }
}

function cargarTexturaMercado10(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=300; c.height=240;
        c.getContext('2d').drawImage(img,0,0,300,240);
        if(window.game&&window.game.textures){
          if(window.game.textures.exists('hotel_los_tajibos')) window.game.textures.remove('hotel_los_tajibos');
          window.game.textures.addCanvas('hotel_los_tajibos',c);
        }
      }catch(e){ console.warn('Error dibujando SVG del Hotel Los Tajibos:',e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG del Hotel Los Tajibos'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MERCADO10_SVG);
  }catch(e){ console.warn('Error preparando SVG del Hotel Los Tajibos:',e); }
}

function crearTexturaMercado9Fallback(scene){
  try{
    if(scene.textures.exists('hospital_sjd')) return;
    var c=document.createElement('canvas'); c.width=300; c.height=240;
    var ctx=c.getContext('2d');
    // Fachada fallback: paredes grises, techo verde, cruz verde
    ctx.fillStyle='#CBD5E1'; ctx.fillRect(20,80,260,155);
    // Techo verde
    ctx.fillStyle='#4ADE80';
    ctx.beginPath(); ctx.moveTo(10,80); ctx.lineTo(150,45); ctx.lineTo(290,80); ctx.closePath(); ctx.fill();
    // Cruz verde
    ctx.fillStyle='#22C55E';
    ctx.fillRect(138,52,24,48); // vertical
    ctx.fillRect(116,64,68,24); // horizontal
    // Letrero
    ctx.fillStyle='#374151'; ctx.fillRect(80,88,140,22);
    ctx.fillStyle='#22D3EE'; ctx.font='bold 7px Arial'; ctx.textAlign='center';
    ctx.fillText('HOSP. SAN JUAN DE DIOS',150,103);
    // Puerta
    ctx.fillStyle='#374151'; ctx.fillRect(120,165,60,70);
    ctx.fillStyle='#A5F3FC'; ctx.fillRect(125,170,25,55); ctx.fillRect(155,170,25,55);
    // Ventanas
    ctx.fillStyle='#A5F3FC';
    ctx.fillRect(35,120,38,38); ctx.fillRect(225,120,38,38);
    ctx.strokeStyle='#4B5563'; ctx.lineWidth=2;
    ctx.strokeRect(35,120,38,38); ctx.strokeRect(225,120,38,38);
    scene.textures.addCanvas('hospital_sjd',c);
  }catch(e){ console.warn('Error creando textura fallback hospital_sjd:',e); }
}

function cargarTexturaMercado9(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=300; c.height=240;
        c.getContext('2d').drawImage(img,0,0,300,240);
        if(window.game&&window.game.textures){
          if(window.game.textures.exists('hospital_sjd')) window.game.textures.remove('hospital_sjd');
          window.game.textures.addCanvas('hospital_sjd',c);

      }catch(e){ console.warn('Error dibujando SVG mercado 9:',e); }

    img.onerror=function(){ console.warn('No se pudo cargar el SVG del Hospital San Juan de Dios'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MERCADO9_SVG);

}

/* Intenta reemplazar el dibujo de reemplazo por el SVG real de la
   banca colonial, en paralelo, SIN pasar por el loader de Phaser (así
   nunca puede trabar el arranque del juego si algo sale mal). Si por
   cualquier motivo el navegador no logra decodificar el SVG, el
   dibujo de reemplazo se queda tal cual y el juego sigue funcionando
   normal. */
function cargarBancaColonialSVG(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=260; c.height=208;
        var ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=true;
        ctx.drawImage(img,0,0,260,208);
        if(window.game && window.game.textures){
          if(window.game.textures.exists('banca_colonial')) window.game.textures.remove('banca_colonial');
          window.game.textures.addCanvas('banca_colonial',c);
        }
      }catch(e){ console.warn('No se pudo dibujar el SVG de la banca colonial:', e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG de la banca colonial, se usa el dibujo de reemplazo.'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(BANCA_COLONIAL_SVG);
  }catch(e){ console.warn('Error preparando el SVG de la banca colonial:', e); }
}

/* Dibujo de reemplazo por si la carga del SVG del patujú fallara
   (misma clave de textura 'patuju'): un tallo simple con brácteas
   rojo-amarillo-verde apiladas, suficiente para que el juego nunca se
   quede sin imagen. */
function crearTexturaPatujuFallback(scene){
  var c=document.createElement('canvas'); c.width=200; c.height=160;
  var x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  x.fillStyle='rgba(0,0,0,0.3)'; x.beginPath(); x.ellipse(100,150,45,9,0,0,Math.PI*2); x.fill();
  x.fillStyle='#16a34a'; x.fillRect(96,60,8,90);
  x.strokeStyle='#14532d'; x.lineWidth=2; x.strokeRect(96,60,8,90);
  var colores=['#16a34a','#84cc16','#f59e0b','#dc2626'];
  for(var i=0;i<4;i++){
    var yy=140-i*22, rr=30-i*4;
    x.fillStyle=colores[i];
    x.beginPath(); x.moveTo(100,yy);
    x.quadraticCurveTo(100-rr,yy-8,100,yy-rr);
    x.quadraticCurveTo(100+rr,yy-8,100,yy);
    x.fill();
    x.strokeStyle='#14532d'; x.lineWidth=1.5; x.stroke();
  }
  x.fillStyle='#15803d';
  x.beginPath(); x.moveTo(90,150); x.quadraticCurveTo(50,140,40,100); x.quadraticCurveTo(65,125,90,140); x.fill();
  x.beginPath(); x.moveTo(110,150); x.quadraticCurveTo(150,140,160,100); x.quadraticCurveTo(135,125,110,140); x.fill();
  scene.textures.addCanvas('patuju',c);
}

/* Textura de reemplazo de la Alcaldía (canvas) mientras carga el SVG real */
function crearTexturaAlcaldiaFallback(scene){
  var c=document.createElement('canvas'); c.width=300; c.height=200;
  var x=c.getContext('2d');
  x.fillStyle='#2E5A7C'; x.fillRect(0,150,300,50);
  x.fillStyle='#F5F5F0'; x.fillRect(0,70,300,80);
  x.fillStyle='#C4A77D'; x.fillRect(0,60,300,12);
  x.fillStyle='#FFD700'; x.beginPath(); x.ellipse(150,48,14,16,0,0,Math.PI*2); x.fill();
  x.fillStyle='#FFFFFF';
  for(var i=0;i<9;i++){ x.fillRect(18+i*32,80,10,120); }
  x.fillStyle='#5C4030'; x.fillRect(135,150,30,50);
  x.fillStyle='rgba(0,0,0,0.25)'; x.beginPath(); x.ellipse(150,196,140,7,0,0,Math.PI*2); x.fill();
  if(scene.textures.exists('alcaldia')) scene.textures.remove('alcaldia');
  scene.textures.addCanvas('alcaldia',c);
}
/* Carga el SVG real de la Alcaldía como textura Phaser, en paralelo,
   sin depender del loader de Phaser (mismo método que la banca colonial). */
function cargarAlcaldiaSVG(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=600; c.height=400;
        var ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=true;
        ctx.drawImage(img,0,0,600,400);
        if(window.game && window.game.textures){
          if(window.game.textures.exists('alcaldia')) window.game.textures.remove('alcaldia');
          window.game.textures.addCanvas('alcaldia',c);
        }
      }catch(e){ console.warn('No se pudo dibujar el SVG de la alcaldía:', e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG de la alcaldía, se usa el dibujo de reemplazo.'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ALCALDIA_SVG);

/* Textura de reemplazo de los Protestantes (canvas) mientras carga el SVG real */
function crearTexturaProtestantesFallback(scene){
  var c=document.createElement('canvas'); c.width=140; c.height=116;
  var x=c.getContext('2d');
  var sc=140/340;
  x.scale(sc,sc);
  x.fillStyle='#274c72'; x.fillRect(40,120,50,120);
  x.fillStyle='#7a4b8f'; x.fillRect(110,140,50,110);
  x.fillStyle='#e07ac0'; x.fillRect(180,150,50,100);
  x.fillStyle='#3a8a52'; x.fillRect(250,165,50,100);
  x.fillStyle='#f2b98a';
  x.beginPath(); x.arc(65,100,18,0,Math.PI*2); x.fill();
  x.beginPath(); x.arc(135,118,16,0,Math.PI*2); x.fill();
  x.beginPath(); x.arc(205,124,16,0,Math.PI*2); x.fill();
  x.beginPath(); x.arc(275,144,16,0,Math.PI*2); x.fill();
  x.fillStyle='#c9a876'; x.strokeStyle='#8a6d3f'; x.lineWidth=2;
  x.fillRect(115,165,110,55); x.strokeRect(115,165,110,55);
  if(scene.textures.exists('protestantes')) scene.textures.remove('protestantes');
  scene.textures.addCanvas('protestantes',c);
}
/* Carga el SVG real de los Protestantes como textura Phaser, en paralelo,
   sin depender del loader de Phaser (mismo método que la Alcaldía). */
function cargarProtestantesSVG(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=140; c.height=116;
        var ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=true;
        ctx.drawImage(img,0,0,140,116);
        if(window.game && window.game.textures){
          if(window.game.textures.exists('protestantes')) window.game.textures.remove('protestantes');
          window.game.textures.addCanvas('protestantes',c);
        }
      }catch(e){ console.warn('No se pudo dibujar el SVG de los protestantes:', e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG de los protestantes, se usa el dibujo de reemplazo.'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(PROTESTANTES_SVG);
  }catch(e){ console.warn('Error preparando el SVG de los protestantes:', e); }
}

/* Textura de reemplazo de la Iglesia (canvas) mientras carga el SVG real */
function crearTexturaIglesiaFallback(scene){
  var c=document.createElement('canvas'); c.width=300; c.height=300;
  var x=c.getContext('2d');
  x.fillStyle='#A09080'; x.fillRect(0,270,300,30);
  x.fillStyle='#CD6539'; x.fillRect(20,180,260,90);
  x.fillStyle='#8B4513'; x.fillRect(20,90,60,180); x.fillRect(220,90,60,180);
  x.fillStyle='#CD6539'; x.beginPath(); x.moveTo(80,90); x.lineTo(150,40); x.lineTo(220,90); x.closePath(); x.fill();
  x.fillStyle='#5D3A1A';
  x.beginPath(); x.arc(50,80,26,0,Math.PI*2); x.fill();
  x.beginPath(); x.arc(250,80,26,0,Math.PI*2); x.fill();
  x.fillStyle='#F5F5F0'; x.beginPath(); x.arc(150,130,20,0,Math.PI*2); x.fill();
  x.fillStyle='#8B4513'; x.fillRect(146,15,8,20);
  x.fillStyle='rgba(0,0,0,0.25)'; x.beginPath(); x.ellipse(150,296,140,6,0,0,Math.PI*2); x.fill();
  if(scene.textures.exists('iglesia')) scene.textures.remove('iglesia');
  scene.textures.addCanvas('iglesia',c);
}
/* Carga el SVG real de la Iglesia como textura Phaser, en paralelo,
   sin depender del loader de Phaser (mismo método que la alcaldía). */
function cargarIglesiaSVG(){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=600; c.height=600;
        var ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=true;
        ctx.drawImage(img,0,0,600,600);
        if(window.game && window.game.textures){
          if(window.game.textures.exists('iglesia')) window.game.textures.remove('iglesia');
          window.game.textures.addCanvas('iglesia',c);
        }
      }catch(e){ console.warn('No se pudo dibujar el SVG de la iglesia:', e); }
    };
    img.onerror=function(){ console.warn('No se pudo cargar el SVG de la iglesia, se usa el dibujo de reemplazo.'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(IGLESIA_SVG);
  }catch(e){ console.warn('Error preparando el SVG de la iglesia:', e); }
}

/* Imagen real del césped/patio (patio_cesped.txt en base64). Se carga
   una sola vez, en paralelo con la pantalla de carga, para que esté
   lista antes de entrar al mapa. Si no está lista o el archivo no
   existe, los patios usan el relleno de color de siempre (sin romper
   nada). */
var IMG_CESPED=null;
function cargarImagenCespedGlobal(){
  fetch('txt/patio_cesped.txt')
    .then(function(r){ if(!r.ok) throw new Error('no encontrado: txt/patio_cesped.txt'); return r.text(); })
    .then(function(txt){
      var raw=txt.trim();
      var dataUrl = raw.indexOf('data:')===0 ? raw : 'data:image/png;base64,'+raw;
      var img=new Image();
      img.onload=function(){ IMG_CESPED=img; };
      img.onerror=function(){ console.warn('txt/patio_cesped.txt no es una imagen válida'); };
      img.src=dataUrl;
    })
    .catch(function(){ console.warn('No se encontró txt/patio_cesped.txt, se usa el césped de color de siempre'); });
}
cargarImagenCespedGlobal();

/* Imagen real de las franjas laterales (patio_ancho.txt en base64) —
   los 4 lados largos/anchos (2 horizontales arriba/abajo, 2 verticales
   izquierda/derecha). Misma lógica que el césped de las esquinas: si
   no está lista o no existe, se usa el relleno de color de siempre. */
var IMG_ANCHO=null;
function cargarImagenAnchoGlobal(){
  fetch('txt/patio_ancho.txt')
    .then(function(r){ if(!r.ok) throw new Error('no encontrado: txt/patio_ancho.txt'); return r.text(); })
    .then(function(txt){
      var raw=txt.trim();
      var dataUrl = raw.indexOf('data:')===0 ? raw : 'data:image/png;base64,'+raw;
      var img=new Image();
      img.onload=function(){ IMG_ANCHO=img; };
      img.onerror=function(){ console.warn('txt/patio_ancho.txt no es una imagen válida'); };
      img.src=dataUrl;
    })
    .catch(function(){ console.warn('No se encontró txt/patio_ancho.txt, se usan las franjas de color de siempre'); });
}
cargarImagenAnchoGlobal();

function dibujarMapa(ctx){
  var W=MAP_W,H=MAP_H,CX=W/2,CY=H/2;
  var CB=250,RW=80,SW=36;
  var PX=CB+RW+SW,PE=W-PX,PS=PE-PX;
  ctx.save(); ctx.imageSmoothingEnabled=false;

  // 1. Asfalto base
  ctx.fillStyle='#0A0909'; ctx.fillRect(0,0,W,H);

  // 2. Bloques de césped esquinas — foto real (patio_cesped.txt) si está
  // lista, cubriendo el bloque exacto de esquina a esquina (sin deformar,
  // tipo "cover"). Si no está lista, cae al relleno de color de siempre.
  function patioEsquina(x,y,w,h){
    if(IMG_CESPED){
      ctx.save();
      ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
      var ir=IMG_CESPED.width/IMG_CESPED.height, tr=w/h, dw,dh,dx,dy;
      if(ir>tr){ dh=h; dw=h*ir; dx=x-(dw-w)/2; dy=y; }
      else { dw=w; dh=w/ir; dx=x; dy=y-(dh-h)/2; }
      ctx.drawImage(IMG_CESPED,dx,dy,dw,dh);
      ctx.restore();
    } else {
      ctx.fillStyle='#287A0C'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#389418'; ctx.fillRect(x+8,y+8,w-16,h-16);
    }
  }
  // Esquinas superiores extendidas hasta CB+RW: cubren también el
  // tramo de calle que antes pasaba por ahí (se elimina la calle
  // horizontal del norte). Las esquinas inferiores quedan igual,
  // así la calle del sur no se toca.
  patioEsquina(0,0,CB,CB+RW); patioEsquina(W-CB,0,CB,CB+RW);
  patioEsquina(0,H-CB,CB,CB); patioEsquina(W-CB,H-CB,CB,CB);

  // Franjas laterales de cesped — foto real (patio_ancho.txt) si está
  // lista, cubriendo cada franja exacta (2 horizontales arriba/abajo,
  // 2 verticales izquierda/derecha). Si no está lista, cae al relleno
  // de color de siempre.
  function patioFranja(x,y,w,h){
    if(IMG_ANCHO){
      ctx.save();
      ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
      var ir=IMG_ANCHO.width/IMG_ANCHO.height, tr=w/h, dw,dh,dx,dy;
      if(ir>tr){ dh=h; dw=h*ir; dx=x-(dw-w)/2; dy=y; }
      else { dw=w; dh=w/ir; dx=x; dy=y-(dh-h)/2; }
      ctx.drawImage(IMG_ANCHO,dx,dy,dw,dh);
      ctx.restore();
    } else {
      ctx.fillStyle='#2E780E'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#3A9418';
      if(w>=h){ ctx.fillRect(x+4,y+6,w-8,h-12); } else { ctx.fillRect(x+6,y+4,w-12,h-8); }
    }
  }
  // La franja norte se extiende hasta CB+RW (tapa la calle horizontal
  // de arriba); la franja sur queda con su tamaño de siempre.
  patioFranja(CB+RW,0,W-2*(CB+RW),CB+RW); patioFranja(CB+RW,H-CB,W-2*(CB+RW),CB);
  patioFranja(0,CB+RW,CB,H-2*(CB+RW)); patioFranja(W-CB,CB+RW,CB,H-2*(CB+RW));

  // 3. Lineas amarillas en calles
  ctx.strokeStyle='#CCAA00'; ctx.setLineDash([22,18]); ctx.lineWidth=2.5;
  var tRY=CB+RW/2,bRY=H-CB-RW/2,lRX=CB+RW/2,rRX=W-CB-RW/2;
  // (la línea de la calle norte ya no se dibuja: esa calle se eliminó)
  ctx.beginPath();ctx.moveTo(0,bRY);ctx.lineTo(W,bRY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(lRX,0);ctx.lineTo(lRX,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(rRX,0);ctx.lineTo(rRX,H);ctx.stroke();
  ctx.setLineDash([]);

  // 4. Pasos de cebra
  function crosswalk(x,y,w,h,horiz){
    ctx.fillStyle='#E0E0E0'; var n=7;
    if(horiz){var s=w/n;for(var i=0;i<n;i+=2)ctx.fillRect(x+i*s,y,s,h);}
    else{var s=h/n;for(var i=0;i<n;i+=2)ctx.fillRect(x,y+i*s,w,s);}
  }
  // (los pasos de cebra de las esquinas norte se quitan junto con la calle)
  crosswalk(CB+RW,H-CB-RW,SW,RW,false); crosswalk(CB,H-CB-SW,RW,SW,true);
  crosswalk(W-CB-SW,H-CB-RW,SW,RW,false); crosswalk(W-CB-RW,H-CB-SW,RW,SW,true);

  // 5. Veredas
  ctx.fillStyle='#302F2F';
  ctx.fillRect(PX,CB+RW,PS,SW); ctx.fillRect(PX,H-CB-RW-SW,PS,SW);
  ctx.fillRect(CB+RW,PX,SW,PS); ctx.fillRect(W-CB-RW-SW,PX,SW,PS);
  ctx.fillRect(CB+RW,CB+RW,SW,SW); ctx.fillRect(W-CB-RW-SW,CB+RW,SW,SW);
  ctx.fillRect(CB+RW,H-CB-RW-SW,SW,SW); ctx.fillRect(W-CB-RW-SW,H-CB-RW-SW,SW,SW);

  // 6. Plaza empedrada
  ctx.fillStyle='#302F2F'; ctx.fillRect(PX,PX,PS,PS);
  ctx.strokeStyle='#191515'; ctx.lineWidth=1;
  for(var tx=PX;tx<=PE;tx+=38){ctx.beginPath();ctx.moveTo(tx,PX);ctx.lineTo(tx,PE);ctx.stroke();}
  for(var ty=PX;ty<=PE;ty+=38){ctx.beginPath();ctx.moveTo(PX,ty);ctx.lineTo(PE,ty);ctx.stroke();}

  // 7. Senderos centrales (cruz)
  var pathW=84;
  ctx.fillStyle='#302F2F';
  ctx.fillRect(CX-pathW/2,PX,pathW,PS); ctx.fillRect(PX,CY-pathW/2,PS,pathW);
  ctx.strokeStyle='#191515'; ctx.lineWidth=1;
  for(var tty=PX;tty<=PE;tty+=30){ctx.beginPath();ctx.moveTo(CX-pathW/2,tty);ctx.lineTo(CX+pathW/2,tty);ctx.stroke();}
  for(var ttx=PX;ttx<=PE;ttx+=30){ctx.beginPath();ctx.moveTo(ttx,CY-pathW/2);ctx.lineTo(ttx,CY+pathW/2);ctx.stroke();}

  // 8. Jardines (4 cuadrantes)
  var catH=210,gdM=28;
  var gdX1=PX+gdM, gdW=CX-pathW/2-PX-2*gdM;
  var gdY1top=PX+catH+gdM, gdH1=CY-pathW/2-gdY1top-gdM;
  var gdX2=CX+pathW/2+gdM, gdY2=CY+pathW/2+gdM, gdH2=PE-gdM-gdY2;
  function garden(x,y,w,h){
    if(w<=0||h<=0)return;
    if(IMG_CESPED){
      // Cubre el rectángulo completo del patio con la foto real del
      // césped (tipo "cover": recorta sobrante, no la deforma).
      ctx.save();
      ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
      var ir=IMG_CESPED.width/IMG_CESPED.height, tr=w/h, dw,dh,dx,dy;
      if(ir>tr){ dh=h; dw=h*ir; dx=x-(dw-w)/2; dy=y; }
      else { dw=w; dh=w/ir; dx=x; dy=y-(dh-h)/2; }
      ctx.drawImage(IMG_CESPED,dx,dy,dw,dh);
      ctx.restore();
      ctx.strokeStyle='#145008'; ctx.lineWidth=3; ctx.strokeRect(x,y,w,h);
    } else {
      ctx.fillStyle='#1A6008'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#2A8410'; ctx.fillRect(x+5,y+5,w-10,h-10);
      ctx.fillStyle='#36A01A'; ctx.fillRect(x+16,y+16,w-32,h-32);
      ctx.strokeStyle='#145008'; ctx.lineWidth=3; ctx.strokeRect(x,y,w,h);
    }
  }
  garden(gdX1,gdY2,gdW,gdH2); garden(gdX2,gdY2,gdW,gdH2);

  // 9. Árboles (copa redonda, vista aérea)
  function arbol(x,y,r){
    ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x+5,y+5,r*0.9,r*0.75,0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#14480A'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#22800E'; ctx.beginPath(); ctx.arc(x-r*.1,y-r*.08,r*.87,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#33A01A'; ctx.beginPath(); ctx.arc(x-r*.22,y-r*.25,r*.55,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#44C024'; ctx.beginPath(); ctx.arc(x-r*.32,y-r*.38,r*.28,0,Math.PI*2); ctx.fill();
  }
  arbol(70,70,42);arbol(155,90,34);arbol(90,160,38);
  arbol(W-70,70,42);arbol(W-155,90,34);arbol(W-90,160,38);
  arbol(70,H-70,42);arbol(155,H-90,34);arbol(90,H-160,38);
  arbol(W-70,H-70,42);arbol(W-155,H-90,34);arbol(W-90,H-160,38);
  var sY=CB+RW+SW+(H-2*(CB+RW+SW))/2;
  arbol(CB/2,sY-280,30);arbol(CB/2,sY,34);arbol(CB/2,sY+280,30);
  arbol(W-CB/2,sY-280,30);arbol(W-CB/2,sY,34);arbol(W-CB/2,sY+280,30);
  var sX=CB+RW+SW+(W-2*(CB+RW+SW))/2;
  arbol(sX-280,CB/2,30);arbol(sX,CB/2,34);arbol(sX+280,CB/2,30);
  arbol(sX-280,H-CB/2,30);arbol(sX,H-CB/2,34);arbol(sX+280,H-CB/2,30);
  // Árboles solo en jardines inferiores
  if(gdW>80&&gdH2>80){
    arbol(gdX1+gdW*.28,gdY2+gdH2*.28,26);arbol(gdX1+gdW*.72,gdY2+gdH2*.6,22);arbol(gdX1+gdW*.42,gdY2+gdH2*.75,24);
    arbol(gdX2+gdW*.28,gdY2+gdH2*.28,26);arbol(gdX2+gdW*.72,gdY2+gdH2*.6,22);arbol(gdX2+gdW*.42,gdY2+gdH2*.75,24);
  }

  // 10. Bancas (top-down)
  function banca(x,y,horiz){
    ctx.fillStyle='rgba(0,0,0,0.15)';
    if(horiz)ctx.fillRect(x+3,y+3,64,14);else ctx.fillRect(x+3,y+3,14,64);
    ctx.fillStyle='#5C3008';
    if(horiz){ctx.fillRect(x,y,64,14);ctx.fillStyle='#7A440E';ctx.fillRect(x+2,y+2,60,10);}
    else{ctx.fillRect(x,y,14,64);ctx.fillStyle='#7A440E';ctx.fillRect(x+2,y+2,10,60);}
  }
  banca(CX-90,CY-36,false);banca(CX+76,CY-36,false);
  banca(CX-32,CY-118,true);banca(CX-32,CY+108,true);
  if(gdW>80&&gdH2>40){banca(gdX1+gdW/2-32,gdY2+12,true);banca(gdX2+gdW/2-32,gdY2+12,true);}

  // 11. Faroles
  function farol(x,y){
    var gr=ctx.createRadialGradient(x,y,0,x,y,44);
    gr.addColorStop(0,'rgba(255,235,155,0.3)');gr.addColorStop(1,'rgba(255,235,155,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,44,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(x+3,y+3,6,5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#181C28';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFEE80';ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();
  }
  farol(CX-200,CY-200);farol(CX+200,CY-200);farol(CX-200,CY+200);farol(CX+200,CY+200);
  farol(CX,CY-300);farol(CX,CY+300);farol(CX-300,CY);farol(CX+300,CY);
  // Faroles en borde norte de la plaza (zona abierta)

  // 12. Monumento central (reducido para no tapar bancas ni caminos)
  var monR=42;
  ctx.setLineDash([7,5]);ctx.strokeStyle='#222';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(CX,CY,monR,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#686868';ctx.beginPath();ctx.arc(CX,CY,monR-5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#828282';ctx.beginPath();ctx.arc(CX,CY,monR-13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#929292';ctx.beginPath();ctx.arc(CX,CY,monR-21,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#727272';ctx.beginPath();ctx.arc(CX,CY,monR-29,0,Math.PI*2);ctx.fill();
  var pedTop=CY-monR+30;
  ctx.fillStyle='#5A5A5A';ctx.fillRect(CX-7,pedTop,14,24);
  ctx.fillStyle='#484848';
  ctx.beginPath();ctx.arc(CX,pedTop+2,6,0,Math.PI*2);ctx.fill();
  ctx.fillRect(CX-5,pedTop+10,10,12);
  ctx.fillRect(CX-8,pedTop+11,6,7);ctx.fillRect(CX+2,pedTop+11,6,7);
  ctx.fillRect(CX-4,pedTop+22,3,8);ctx.fillRect(CX+1,pedTop+22,3,8);

  // 13. Zona norte: piso empedrado ampliado + bancas decorativas (sin catedral ni patios)
  // Piso empedrado relleno del cuadrante norte (donde estaban los jardines superiores y la catedral)
  var nortY=PX+8, nortH=CY-pathW/2-PX-16;
  // Continuacion de plaza empedrada
  ctx.fillStyle='#302F2F'; ctx.fillRect(PX+8,nortY,PS-16,nortH);
  ctx.strokeStyle='#191515'; ctx.lineWidth=1;
  for(var nt=PX+8;nt<=PE-8;nt+=38){ctx.beginPath();ctx.moveTo(nt,nortY);ctx.lineTo(nt,nortY+nortH);ctx.stroke();}
  for(var nt2=nortY;nt2<=nortY+nortH;nt2+=38){ctx.beginPath();ctx.moveTo(PX+8,nt2);ctx.lineTo(PE-8,nt2);ctx.stroke();}
  // Linea de borde sur de la zona norte
  ctx.strokeStyle='#191515'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(PX+8,nortY+nortH); ctx.lineTo(PE-8,nortY+nortH); ctx.stroke();
  // Bancas en zona norte — filas horizontales
  function bancaN(bx,by){ banca(bx,by,true); }
  // Fila 1 bancas — cercanas al borde norte
  var bn1y=nortY+48;
  bancaN(gdX1+20,bn1y);  bancaN(gdX1+gdW-84,bn1y);
  bancaN(gdX2+20,bn1y);  bancaN(gdX2+gdW-84,bn1y);
  // Fila 2 bancas — zona media norte
  var bn2y=nortY+nortH*0.5-7;
  bancaN(gdX1+gdW/2-32,bn2y); bancaN(gdX2+gdW/2-32,bn2y);
  // Fila 3 bancas — cerca del sendero central
  var bn3y=nortY+nortH-60;
  bancaN(gdX1+20,bn3y);  bancaN(gdX1+gdW-84,bn3y);
  bancaN(gdX2+20,bn3y);  bancaN(gdX2+gdW-84,bn3y);
  // Faroles extra en zona norte
  farol(gdX1+gdW/2, nortY+nortH*0.28);
  farol(gdX2+gdW/2, nortY+nortH*0.28);
  farol(gdX1+gdW/2, nortY+nortH*0.72);
  farol(gdX2+gdW/2, nortY+nortH*0.72);
  // Bordes decorativos de ladrillo (ex-paredes laterales)
  ctx.fillStyle='rgba(90,55,20,0.18)';
  ctx.fillRect(PX+8,nortY,12,nortH); ctx.fillRect(PE-20,nortY,12,nortH);

  ctx.restore();
}

/* =====================================================
   PANTALLA COMPLETA (móvil) — se activa con el primer toque
   del usuario (los navegadores exigen un gesto real) e
   intenta además fijar la orientación horizontal.
===================================================== */
function attemptFullscreen(scene){
  try{
    if(!scene || !scene.scale) return;
    if(scene.scale.isFullscreen) return;
    scene.scale.once('enterfullscreen', function(){
      try{
        if(screen.orientation && screen.orientation.lock){
          screen.orientation.lock('landscape').catch(function(){});
        }
      }catch(e){}
    });
    scene.scale.startFullscreen();
  }catch(e){}
}

class BootScene extends Phaser.Scene {
  constructor(){ super('BootScene'); }
  preload(){
    var scene=this;
    this.cameras.main.setBackgroundColor('#000000');
    // (Se quitó la barra verde de progreso técnico: la pantalla queda en
    // negro sólido hasta que create() muestra la pantalla de carga de 5s).
    // Phaser necesita al menos un recurso en cola para disparar create().
    // Este archivo local es pequeño y no bloquea la entrada al menú.
    this.load.text('boot_marker','iniciar_juego.bat');

    // ── AUDIO — música y sonidos reales ──────────────────────────────
    // Coloca tus archivos con estos nombres exactos en assets/audio/
    // (junto a index.html e iniciar_juego.bat):
    //   Musica Inicio.mp3    -> música del menú principal
    //   Musica Progreso.mp3  -> música mientras se juega
    //   Mover Botones.mp3    -> sonido al mover/seleccionar botones
    //   RecogerDinero.mp3    -> sonido al recoger el dinero acumulado
    //                           de cualquiera de los 10 lotes/estructuras
    //   SonidoBien.mp3       -> sonido al terminar de construir una banca
    // Si un archivo no existe, Phaser lanza un aviso en la consola pero
    // el juego sigue funcionando normalmente, igual que con las imágenes.
    this.load.on('loaderror', function(file){
      console.warn('No se pudo cargar (revisa el nombre/ubicación):', file.key, file.src);
    });
    this.load.audio('musica_menu',  ['assets/audio/Musica%20Inicio.mp3']);
    this.load.audio('musica_juego', ['assets/audio/Musica%20Progreso.mp3']);
    this.load.audio('sonido_boton', ['assets/audio/Mover%20Botones.mp3']);
    this.load.audio('sonido_recoger_dinero', ['assets/audio/RecogerDinero.mp3']);
    this.load.audio('sonido_bien', ['assets/audio/SonidoBien.mp3']);
    this.load.audio('sonido_advertencia', ['assets/audio/Advertencia.mp3']);
    this.load.audio('musica_creditos', ['assets/audio/creditos.mp3']);

  create(){
    var scene=this;
    if(this.registry.get('volMusica') === undefined) this.registry.set('volMusica', 6);
    if(this.registry.get('volFX') === undefined) this.registry.set('volFX', 8);
    crearTexturaMenuLocal(scene);

    function makeIcon(key,iW,iH,drawFn){
      var ic=document.createElement('canvas'); ic.width=iW; ic.height=iH;
      drawFn(ic.getContext('2d')); scene.textures.addCanvas(key,ic);
    }
    makeIcon('ico_play',54,54,function(c){ drawIcoPlay(c,54,54); });

    makeIcon('ico_opts',54,54,function(c){ drawIcoOpts(c,54,54); });

    crearTexturaPersonaje(scene);
    // La banca colonial arranca con el dibujo de reemplazo (siempre
    // disponible al instante, sin depender de red ni del loader de
    // Phaser) y, en paralelo, se intenta mejorar con el SVG real usando
    // el mismo método que ya usan las fotos de césped (Image aparte).
    crearTexturaBancaFallback(scene);
    cargarBancaColonialSVG();
    // Farol triple: mismo mecanismo (dibujo de reemplazo instantáneo +
    // SVG real en paralelo) para la decoración de la calle central.
    crearTexturaFarolFallback(scene);
    cargarFarolTripleSVG();
    // Árbol Toborochi: textura de reemplazo (instantánea) + SVG real en
    // paralelo, para la decoración de las 4 esquinas del mapa.
    crearTexturaArbolFallback(scene);

    // Árbol Rosa: mismo mecanismo, se planta en pareja con cada

    // Patujú: mismo mecanismo, decoración suelta (no en pareja) junto

    crearTexturaPatujuFallback(scene);
    cargarPatujuSVG();
    // Alcaldía: textura de reemplazo (instantánea) + SVG real en paralelo
    crearTexturaAlcaldiaFallback(scene);
    cargarAlcaldiaSVG();
    // Iglesia 24 de Septiembre: recompensa final, mismo mecanismo de

    crearTexturaIglesiaFallback(scene);
    cargarIglesiaSVG();
    // Protestantes: textura de reemplazo instantánea + SVG real en

    // Ícono de la habilidad "Velocidad" del panel de la Alcaldía

    // Ícono de candado (candado.txt en base64) — reemplaza el emoji 🔒
