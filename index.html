    // Ícono de papel (papel.txt en base64) — reemplaza el emoji 📄
    // en el botón de OBJETIVOS del HUD.
    cargarTexturaBase64(scene,'txt/papel.txt','icono_papel', function(ok){});
    // Ícono de ubicación (ubicacion.txt en base64) — reemplaza el emoji 🗺 del botón GUÍA DEL MAPA
    cargarTexturaBase64(scene,'txt/ubicacion.txt','icono_ubicacion', function(ok){});
    // Sprite del ladrón (malo.txt en base64) — personaje villano
    cargarTexturaBase64(scene,'txt/malo.txt','malo_tex', function(ok){});
    // Mercado HIPERMAXI: textura de reemplazo (instantánea) + SVG real en paralelo
    crearTexturaMercadoFallback(scene);
    cargarTexturaMercado();
    // Mercado Mutualista (2do lote): textura de reemplazo + SVG real en paralelo
    crearTexturaMercado2Fallback(scene);
    cargarTexturaMercado2();
    // Escuela Primaria (3er lote): textura de reemplazo + SVG real en paralelo
    crearTexturaMercado3Fallback(scene);
    cargarTexturaMercado3();
    // Escuela Técnica (4to lote): textura de reemplazo + SVG real en paralelo
    crearTexturaMercado4Fallback(scene);
    cargarTexturaMercado4();
    // Pizzanchez (5to lote): textura de reemplazo + SVG real en paralelo
    crearTexturaMercado5Fallback(scene);
    cargarTexturaMercado5();
    // Restaurante (6to lote): textura de reemplazo + SVG real en paralelo
    crearTexturaMercado6Fallback(scene);
    cargarTexturaMercado6();

    // Empieza a cargar la foto real del menú y del césped en paralelo
    // a la barra de carga, para que ya estén listas al terminar los 5s.
    aplicarFondoDesdeArchivo(scene, null);

    this._pantallaCarga(function(){ scene.scene.start('MenuScene'); });
  }
  /* Pantalla de carga de ~5 segundos con barra que va creciendo poco a
     poco hasta completarse, luego entra al menú. Se ve en cada arranque
     o recarga del navegador. */
  _pantallaCarga(onDone){
    var scene=this;
    this.children.removeAll(); // limpia la barra técnica rápida del preload()
    this.cameras.main.setBackgroundColor('#000000');
    var cx=640, cy=380, boxW=760, boxH=30;
    this.add.text(cx,cy-50,'CARGANDO...',{fontFamily:'Impact',fontSize:'34px',color:'#014D01'}).setOrigin(0.5);
    var bgBar=this.add.graphics();
    bgBar.fillStyle(0x1A1A1A,1); bgBar.fillRoundedRect(cx-boxW/2,cy,boxW,boxH,8);
    bgBar.lineStyle(2,0x014D01,1); bgBar.strokeRoundedRect(cx-boxW/2,cy,boxW,boxH,8);
    var fillBar=this.add.graphics();
    var pct=this.add.text(cx,cy+boxH+26,'0%',{fontFamily:'Impact',fontSize:'22px',color:'#ffffff'}).setOrigin(0.5);

    var prog={v:0};
    this.tweens.add({
      targets:prog, v:1, duration:5000, ease:'Linear',
      onUpdate:function(){
        fillBar.clear();
        fillBar.fillStyle(0x014D01,1);
        fillBar.fillRoundedRect(cx-boxW/2+4,cy+4,(boxW-8)*prog.v,boxH-8,6);
        pct.setText(Math.floor(prog.v*100)+'%');
      },
      onComplete:function(){ onDone(); }
    });
  }
}


/* =====================================================
   ESCENA: MENÚ PRINCIPAL
===================================================== */
class MenuScene extends Phaser.Scene {
  constructor(){ super('MenuScene'); }
  create(){
    var scene=this;
    prepararRecursosLocales(scene);
    var fondoMenu = this.add.image(640,360,'menu').setDisplaySize(1280*MENU_BG_ZOOM,720*MENU_BG_ZOOM);
    aplicarFondoDesdeArchivo(scene, fondoMenu);
    // Paneo lento y continuo de izquierda a derecha (efecto "cámara viva").
    // El fondo está agrandado (MENU_BG_ZOOM) para que al moverse nunca se
    // vean los bordes vacíos de la imagen.
    var PAN_X=72;
    fondoMenu.x=640-PAN_X;
    this.tweens.add({
      targets:fondoMenu, x:640+PAN_X,
      duration:9000, ease:'Sine.easeInOut',
      yoyo:true, repeat:-1
    });
    crearUIPlacaMenu(this);
    this.musica = AudioMgr.playBGM(this, 'musica_menu');
    this.sonido = AudioMgr.getSonido(this);
    this.sel=0;
    // FIX: si el jugador ya completó el juego (construyó/mejoró todo y vio
    // los créditos), la partida guardada se borra automáticamente y ya no
    // tiene sentido ofrecer "CARGAR PARTIDA" — solo queda "INICIAR" (que
    // arranca una partida nueva directo, sin preguntar) y "OPCIONES".
    this._completado = juegoCompletado();
    var btnData = this._completado ? [
      {label:'INICIAR',       icoKey:'ico_play',col:0xA01818,colH:0xC82020,y:235,accion:'iniciar'},
      {label:'OPCIONES',      icoKey:'ico_opts',col:0x1D8C38,colH:0x27AE48,y:323,accion:'opciones'},
    ] : [
      {label:'INICIAR',       icoKey:'ico_play',col:0xA01818,colH:0xC82020,y:235,accion:'iniciar'},
      {label:'CARGAR PARTIDA',icoKey:'ico_file',col:0xB8860B,colH:0xFFD700,y:323,accion:'cargar'},
      {label:'OPCIONES',      icoKey:'ico_opts',col:0x1D8C38,colH:0x27AE48,y:411,accion:'opciones'},
    ];
    this._numBtns=btnData.length;
    var BW=440,BH=70,BCX=1020,icoX=BCX-BW/2+BH/2+6,lblX=BCX-BW/2+BH+18;
    this.gBtns=this.add.graphics(); this.bData=btnData; this.BW=BW; this.BH=BH; this.BCX=BCX;
    this.iconImgs=[]; this.lblTexts=[];
    for(var i=0;i<btnData.length;i++){
      (function(idx){
        scene.iconImgs.push(scene.add.image(icoX,btnData[idx].y,btnData[idx].icoKey).setDisplaySize(BH-16,BH-16));
        scene.lblTexts.push(scene.add.text(lblX,btnData[idx].y,btnData[idx].label,{fontFamily:"'Press Start 2P'",fontSize:btnData[idx].accion==='cargar'?'11px':'14px',color:'#ffffff',stroke:'#000000',strokeThickness:3}).setOrigin(0,0.5));
        var z=scene.add.zone(BCX,btnData[idx].y,BW,BH).setInteractive({useHandCursor:true});
        z.on('pointerover',function(){ if(scene.sel!==idx){ scene.sel=idx; AudioMgr.playFX(scene); scene.dibujarBtns(); } });
        z.on('pointerdown',function(){
          // En táctil a veces el 'pointerover' no llega a tiempo antes del
          // toque, así que forzamos que el botón tocado sea el que se abre,
          // en vez de depender de cuál estaba resaltado antes.
          scene.sel=idx; scene.dibujarBtns(); scene.abrir();
        });
      })(i);
    }
    this.dibujarBtns();
    // Pantalla completa en móvil: se activa con el primer toque del usuario
    this.input.once('pointerdown',function(){ attemptFullscreen(scene); });
    this.input.keyboard.on('keydown-UP',function(){ scene.sel=(scene.sel-1+scene._numBtns)%scene._numBtns; AudioMgr.playFX(scene); scene.dibujarBtns(); });
    this.input.keyboard.on('keydown-DOWN',function(){ scene.sel=(scene.sel+1)%scene._numBtns; AudioMgr.playFX(scene); scene.dibujarBtns(); });
    this.input.keyboard.on('keydown-ENTER',function(){ scene.abrir(); });
    // Cruz direccional + botón E táctiles (solo en pantallas táctiles),
    // para no depender de acertar el dedo justo sobre cada botón.
    this._crearControlesTactilesMenu();
  }
  _crearControlesTactilesMenu(){
    var scene=this;
    if(!this.sys.game.device.input.touch) return;
    var dep=400, SF=0;

    function moverSel(delta){
      scene.sel=(scene.sel+delta+scene._numBtns)%scene._numBtns;
      AudioMgr.playFX(scene);
      scene.dibujarBtns();
    }

    // ── Cruz direccional (tipo D-pad). Arriba/Abajo mueven la selección
    // hacia arriba/abajo en la lista; Izquierda/Derecha hacen lo mismo
    // (arriba/abajo respectivamente) como respaldo, por si el dedo no
    // cae exacto en la flecha vertical.
    var cx=130, cy=555, s=46, gap=50;
    function botonFlecha(dx,dy,dir,accion){
      var bx=cx+dx*gap, by=cy+dy*gap;
      var g=scene.add.graphics().setScrollFactor(SF).setDepth(dep);
      g.fillStyle(0x000000,0.55); g.fillRoundedRect(bx-s/2,by-s/2,s,s,10);
      g.lineStyle(2,0xFFFFFF,0.4); g.strokeRoundedRect(bx-s/2,by-s/2,s,s,10);
      scene.add.text(bx,by,dir,{fontFamily:"'Press Start 2P'",fontSize:'16px',color:'#FFFFFF'})
        .setOrigin(0.5).setScrollFactor(SF).setDepth(dep+1);
      var z=scene.add.zone(bx,by,s,s).setScrollFactor(SF).setDepth(dep+2).setInteractive();
      z.on('pointerdown',accion);
    }
    botonFlecha(0,-1,'▲',function(){ moverSel(-1); });
    botonFlecha(0, 1,'▼',function(){ moverSel(1); });
    botonFlecha(-1,0,'◀',function(){ moverSel(-1); });
    botonFlecha(1, 0,'▶',function(){ moverSel(1); });
    // Círculo central decorativo
    var gC=scene.add.graphics().setScrollFactor(SF).setDepth(dep);
    gC.fillStyle(0x000000,0.4); gC.fillCircle(cx,cy,20);
    gC.lineStyle(2,0xFFFFFF,0.3); gC.strokeCircle(cx,cy,20);

    // ── Botón E — confirma/abre la opción resaltada
    var eBx=310, eBy=555, eW=94, eH=80;
    var bgE=scene.add.graphics().setScrollFactor(SF).setDepth(dep);
    bgE.fillStyle(0x1D8C38,0.88); bgE.fillRoundedRect(eBx-eW/2,eBy-eH/2,eW,eH,14);
    bgE.lineStyle(3,0xFFFFFF,0.35); bgE.strokeRoundedRect(eBx-eW/2,eBy-eH/2,eW,eH,14);
    scene.add.text(eBx,eBy,'E',{fontFamily:"'Press Start 2P'",fontSize:'24px',color:'#FFF'})
      .setOrigin(0.5).setScrollFactor(SF).setDepth(dep+1);
    var zE=scene.add.zone(eBx,eBy,eW,eH).setScrollFactor(SF).setDepth(dep+2).setInteractive();
    zE.on('pointerdown',function(){ scene.abrir(); });
  }
  dibujarBtns(){
    var g=this.gBtns; g.clear();
    var BW=this.BW,BH=this.BH,BCX=this.BCX;
    for(var i=0;i<this.bData.length;i++){
      var d=this.bData[i],col=(i===this.sel)?d.colH:d.col;
      g.fillStyle(0x000000,0.35); g.fillRoundedRect(BCX-BW/2+4,d.y-BH/2+5,BW,BH,12);
      g.fillStyle(col,1); g.fillRoundedRect(BCX-BW/2,d.y-BH/2,BW,BH,12);
      g.fillStyle(0xffffff,0.10); g.fillRoundedRect(BCX-BW/2,d.y-BH/2,BW,BH*0.4,12);
      g.fillStyle(0x000000,0.28); g.fillRoundedRect(BCX-BW/2+8,d.y-BH/2+8,BH-16,BH-16,8);
      if(i===this.sel){ g.lineStyle(3,0xffffff,0.7); g.strokeRoundedRect(BCX-BW/2,d.y-BH/2,BW,BH,12); }
    }
  }
  abrir(){
    var scene=this;
    AudioMgr.stopBGM();
    // Si el juego ya fue completado no hay (ni debe haber) partida guardada
    // que ofrecer: se ignora cualquier save viejo y siempre se entra como
    // partida nueva, sin preguntar.
    var save = this._completado ? null : cargarPartida(); // null si no hay partida, es inválida o el juego ya se completó
    var accion = (this.bData[this.sel]||{}).accion;
    switch(accion){
      case 'iniciar':
        if(save){
          // Hay partida guardada: preguntar si reinicia o continúa
          this._mostrarModalReinicio();
        } else {
          // Jugador nuevo (o el juego ya fue completado antes): borra
          // cualquier rastro viejo y entra directo a una partida nueva.
          borrarPartida();
          limpiarCompletado();
          marcarIniciado();
          window._saveParaCargar = null; // sin save
          this.scene.start('IntroScene');
        }
        break;
      case 'cargar':
        if(save){
          // Hay partida guardada: ir DIRECTO a GameScene (sin intro)
          // para evitar que el registry se pierda entre escenas
          window._saveParaCargar = save;
          this.registry.set('cargar_save', save);
          marcarIniciado();
          this.scene.start('GameScene');
        } else {
          // No hay partida: mostrar mensaje de error y volver al menú
          AudioMgr.playBGM(scene, 'musica_menu');
          this._mostrarMensaje('NO HAY PARTIDA\nGUARDADA');
        }
        break;
      case 'opciones': this.scene.start('OptionsScene'); break;

    }
  }
  _mostrarModalReinicio(){
    var scene=this;
    // Fondo oscuro
    var ov=this.add.rectangle(640,360,1280,720,0x000000,0.65).setDepth(300);
    // Panel pixel-style
    var g=this.add.graphics().setDepth(301);
    g.fillStyle(0x050A1A,1); g.fillRect(360,248,560,224);
    g.lineStyle(5,0xFFD700,1); g.strokeRect(360,248,560,224);
    g.lineStyle(2,0x3A5FD0,1); g.strokeRect(368,256,544,208);
    // Píxeles decorativos en esquinas
    g.fillStyle(0xFFD700);
    g.fillRect(360,248,12,12); g.fillRect(908,248,12,12);
    g.fillRect(360,460,12,12); g.fillRect(908,460,12,12);
    var txt=this.add.text(640,316,'¿REINICIAR\nLA PARTIDA?',{
      fontFamily:"'Press Start 2P'",fontSize:'17px',color:'#FFFFFF',
      stroke:'#000',strokeThickness:3,align:'center'
    }).setOrigin(0.5).setDepth(302);
    var btnSI=this.add.text(490,416,'  SI  ',{
      fontFamily:"'Press Start 2P'",fontSize:'15px',color:'#FFFFFF',
      backgroundColor:'#8B0000',padding:{x:18,y:10},stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(302).setInteractive({useHandCursor:true});
    var btnNO=this.add.text(790,416,'  NO  ',{
      fontFamily:"'Press Start 2P'",fontSize:'15px',color:'#FFFFFF',
      backgroundColor:'#03015E',padding:{x:18,y:10},stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(302).setInteractive({useHandCursor:true});
    btnSI.on('pointerover',function(){ btnSI.setBackgroundColor('#CC0000'); });
    btnSI.on('pointerout', function(){ btnSI.setBackgroundColor('#8B0000'); });
    btnNO.on('pointerover',function(){ btnNO.setBackgroundColor('#1E3A80'); });
    btnNO.on('pointerout', function(){ btnNO.setBackgroundColor('#03015E'); });
    var cerrar=function(){ ov.destroy(); g.destroy(); txt.destroy(); btnSI.destroy(); btnNO.destroy(); };
    btnSI.on('pointerdown',function(){
      cerrar(); borrarPartida(); limpiarCompletado(); marcarIniciado();
      scene.scene.start('IntroScene');
    });
    btnNO.on('pointerdown',function(){
      cerrar();
      AudioMgr.playBGM(scene, 'musica_menu');
    });
  }
  _mostrarMensaje(msg){
    var scene=this;
    var ov=this.add.rectangle(640,360,1280,720,0x000000,0.5).setDepth(300);
    var g=this.add.graphics().setDepth(301);
    g.fillStyle(0x050A1A,1); g.fillRect(410,290,460,140);
    g.lineStyle(3,0xFF4444,1); g.strokeRect(410,290,460,140);
    var txt=this.add.text(640,360,msg,{
      fontFamily:"'Press Start 2P'",fontSize:'14px',color:'#FF6666',
      stroke:'#000',strokeThickness:2,align:'center'
    }).setOrigin(0.5).setDepth(302);
    this.time.delayedCall(2000,function(){ ov.destroy(); g.destroy(); txt.destroy();
      AudioMgr.playBGM(scene, 'musica_menu'); });
  }
}



/* =====================================================
   ESCENA: INTRO — Animación 3 segundos sobre fondo negro
===================================================== */
class IntroScene extends Phaser.Scene {
  constructor(){ super('IntroScene'); }
  create(){
    var scene=this;
    this._yendo = false;
    // Fondo negro puro
    this.cameras.main.setBackgroundColor('#000000');
    // Personaje entra desde la izquierda caminando
    this.personaje=this.add.image(-60,400,'char_right').setOrigin(0.5,1).setScale(1.8);
    // Textos sobre negro
    var txt1=this.add.text(640,160,'¡INICIO DE CAMPAÑA!',{fontFamily:"'Press Start 2P'",fontSize:'28px',color:'#FFFFFF',stroke:'#000000',strokeThickness:5}).setOrigin(0.5).setAlpha(0);
    var txt2=this.add.text(640,220,'MAMEN SAAVEDRA',{fontFamily:"'Press Start 2P'",fontSize:'20px',color:'#FFD700',stroke:'#000000',strokeThickness:4}).setOrigin(0.5).setAlpha(0);
    var txt3=this.add.text(640,680,'[ Presiona cualquier tecla para continuar ]',{fontFamily:"'Press Start 2P'",fontSize:'9px',color:'#AAAAAA'}).setOrigin(0.5).setAlpha(0);
    // Animaciones
    this.tweens.add({ targets:this.personaje, x:400, duration:1800, ease:'Power2', delay:200 });
    this.tweens.add({ targets:txt1, alpha:1, duration:500, delay:800 });
    this.tweens.add({ targets:txt2, alpha:1, duration:500, delay:1100 });
    this.tweens.add({ targets:txt3, alpha:1, duration:400, delay:2200 });
    // Auto-pasar a GameScene en 3.5s
    this.time.delayedCall(3500, function(){ scene.irAlJuego(); });
    // Saltar con tecla o clic
    this.input.keyboard.once('keydown', function(){ scene.irAlJuego(); });
    this.input.once('pointerdown', function(){ scene.irAlJuego(); });
    // ESC vuelve al menú
    this.input.keyboard.on('keydown-ESC', function(){ scene.scene.start('MenuScene'); });
  }
  update(t){
    // Bob del personaje mientras camina hacia el centro
    if(this.personaje && this.personaje.x < 380){
      this.personaje.y = 400 + Math.sin(t*0.012)*5;
    }
  }
  irAlJuego(){
    if(this._yendo) return; this._yendo=true;
    var scene=this;
    // Fade a negro y luego iniciar GameScene (usando closure para evitar bug de reinicio)
    this.cameras.main.fade(400,0,0,0);
    this.time.delayedCall(420,function(){ scene.scene.start('GameScene'); });
  }
}

/* =====================================================
   ESCENA: PAUSA — estilo clásico (fondo negro, serif)
===================================================== */
class PauseScene extends Phaser.Scene {
  constructor(){ super('PauseScene'); }
  create(){
    var scene=this;
    this._saliendo=false;
    this.sel=0;
    this._btnData=[
      {lbl:'CONTINUAR',       col:0x1D8C38, colH:0x27AE48, y:285},
      {lbl:'GUARDAR PARTIDA', col:0x1E3560, colH:0x2A4A80, y:370},
      {lbl:'OPCIONES',        col:0x30384A, colH:0x3E4A60, y:455},
      {lbl:'SALIR PARTIDA',   col:0x7A0A0A, colH:0xAA1818, y:540}
    ];
    // Overlay semi-transparente — el juego se ve de fondo (NO negro total)
    this.add.rectangle(640,360,1280,720,0x000000,0.62).setDepth(0);
    // Panel pixel-art centrado
    var g=this.add.graphics().setDepth(1);
    g.fillStyle(0x03015E,0.97); g.fillRoundedRect(355,95,570,530,16);
    g.lineStyle(3,0x3A70D0,1); g.strokeRoundedRect(355,95,570,530,16);
    g.lineStyle(1,0xFFD700,0.35); g.strokeRoundedRect(363,103,554,514,12);
    // Esquinas pixel doradas
    g.fillStyle(0xFFD700,1);
    [[355,95],[913,95],[355,613],[913,613]].forEach(function(p){ g.fillRect(p[0],p[1],10,10); });
    // Título PAUSA
    this.add.text(640,158,'PAUSA',{
      fontFamily:"'Press Start 2P'",fontSize:'22px',color:'#FFD700',
      stroke:'#000000',strokeThickness:4
    }).setOrigin(0.5).setDepth(2);
    // Línea decorativa bajo el título
    g.lineStyle(1,0x3A5FD0,0.5); g.lineBetween(375,194,905,194);
    // Botones
    this._gBtns=this.add.graphics().setDepth(2);
    this._lblTexts=[];
    var BW=450, BH=62, BCX=640;
    this._btnData.forEach(function(btn,idx){
      var lbl=scene.add.text(BCX,btn.y,btn.lbl,{
        fontFamily:"'Press Start 2P'",fontSize:(idx===1)?'10px':'12px',
        color:'#FFFFFF',stroke:'#000000',strokeThickness:2
      }).setOrigin(0.5).setDepth(3);
      scene._lblTexts.push(lbl);
      var z=scene.add.zone(BCX,btn.y,BW,BH).setDepth(4).setInteractive({useHandCursor:true});
      z.on('pointerover',function(){ if(scene.sel!==idx){ scene.sel=idx; AudioMgr.playFX(scene); scene._dibujar(); } });
      z.on('pointerdown',function(){ scene._accion(idx); });
    });
    this._dibujar();
    // Teclas
    this.input.keyboard.on('keydown-P',  function(){ scene._accion(0); });
    this.input.keyboard.on('keydown-ESC',function(){ scene._accion(0); });
    this.input.keyboard.on('keydown-UP',  function(){ scene.sel=(scene.sel-1+4)%4; AudioMgr.playFX(scene); scene._dibujar(); });
    this.input.keyboard.on('keydown-DOWN',function(){ scene.sel=(scene.sel+1)%4; AudioMgr.playFX(scene); scene._dibujar(); });
    this.input.keyboard.on('keydown-ENTER',function(){ scene._accion(scene.sel); });
  }
  _dibujar(){
    var g=this._gBtns; g.clear();
    var BW=450, BH=62, BCX=640;
    this._btnData.forEach(function(btn,idx){
      var sel=(idx===this.sel);
      var col=sel?btn.colH:btn.col;
      // Sombra
      g.fillStyle(0x000000,0.4); g.fillRoundedRect(BCX-BW/2+4,btn.y-BH/2+5,BW,BH,10);
      // Cuerpo del botón
      g.fillStyle(col,1); g.fillRoundedRect(BCX-BW/2,btn.y-BH/2,BW,BH,10);
      // Brillo superior
      g.fillStyle(0xFFFFFF,sel?0.14:0.08); g.fillRoundedRect(BCX-BW/2,btn.y-BH/2,BW,BH*0.42,10);
      // Icono pixel ▶ a la izquierda si seleccionado
      if(sel){
        g.fillStyle(0xFFFFFF,0.9);
        var ax=BCX-BW/2-22, ay=btn.y;
        g.fillTriangle(ax,ay-9, ax+12,ay, ax,ay+9);
        g.lineStyle(2,0xFFFFFF,0.5); g.strokeRoundedRect(BCX-BW/2,btn.y-BH/2,BW,BH,10);
      }
    },this);
  }
  _accion(idx){
    if(this._saliendo) return;
    var scene=this;
    var gS=this.scene.get('GameScene');
    switch(idx){
      case 0: // Continuar
        this.scene.resume('GameScene');
        this.scene.stop('PauseScene');
        break;
      case 1: // Guardar
        // FIX: antes se mostraba "✔ Partida guardada" sin importar si
        // guardarPartida() había fallado de verdad (cuota llena, modo
        // privado, etc.). Ahora el mensaje depende del resultado real.
        var okGuardado = gS ? guardarPartida(gS.dinero,gS.px,gS.py,gS._construirDatosGuardado()) : false;
        var msg=this.add.text(640,610, okGuardado ? '✔ Partida guardada' : '✖ No se pudo guardar',{
          fontFamily:"'Press Start 2P'",fontSize:'10px',color: okGuardado ? '#00FF88' : '#FF6666',
          stroke:'#000',strokeThickness:2
        }).setOrigin(0.5).setDepth(10);
        this.tweens.add({targets:msg,alpha:0,delay:1400,duration:500,onComplete:function(){ msg.destroy(); }});
        break;
      case 2: // Opciones
        this.scene.setVisible(false);
        this.scene.pause(); // FIX: antes solo se ocultaba (setVisible) pero
        // seguía activa, así que P/ESC/flechas/ENTER de este menú de Pausa
        // seguían funcionando "por detrás" mientras el jugador estaba en
        // Opciones (podía disparar "Continuar" o incluso "Salir" sin querer).
        this.scene.launch('OptionsScene');
        this.scene.bringToTop('OptionsScene');
        break;
      case 3: // Salir — guarda automáticamente antes de salir
        this._saliendo=true;
        // Guardar el progreso actual antes de volver al menú
        if(gS) guardarPartida(gS.dinero, gS.px, gS.py, gS._construirDatosGuardado());
        AudioMgr.stopBGM();
        this._animarSaliendo();
        break;
    }
  }
  _animarSaliendo(){
    var scene=this;
    // Oscurecer todo
    this.children.list.forEach(function(c){ if(c.setAlpha) c.setAlpha(0); });
    if(this._gBtns) this._gBtns.clear();
    var ov=this.add.rectangle(640,360,1280,720,0x000000,1).setDepth(20);
    this.add.text(640,280,'SALIENDO DE LA PARTIDA...',{
      fontFamily:"'Press Start 2P'",fontSize:'16px',color:'#FFD700',stroke:'#000',strokeThickness:3
    }).setOrigin(0.5).setDepth(21);
    var barBg=this.add.graphics().setDepth(21);
    barBg.fillStyle(0x03015E,1); barBg.fillRoundedRect(240,360,800,40,8);
    barBg.lineStyle(2,0x3A70D0,1); barBg.strokeRoundedRect(240,360,800,40,8);
    var bar=this.add.graphics().setDepth(22);
    var pct=this.add.text(640,430,'0%',{
      fontFamily:"'Press Start 2P'",fontSize:'12px',color:'#AAAAAA'
    }).setOrigin(0.5).setDepth(22);
    var prog={v:0};
    scene.tweens.add({
      targets:prog, v:100, duration:2600, ease:'Linear',
      onUpdate:function(){
        var p=Math.floor(prog.v);
        bar.clear();
        bar.fillStyle(0x00CC44,1); bar.fillRoundedRect(242,362,Math.floor(796*p/100),36,6);
        pct.setText(p+'%');
      },
      onComplete:function(){
        scene.time.delayedCall(200,function(){
          scene.scene.stop('GameScene');
          scene.scene.stop('OptionsScene');
          scene.scene.stop('PauseScene');
          scene.scene.start('MenuScene');
        });
      }
    });
  }
}

/* =====================================================
   ESCENA: JUEGO — Top-Down Tycoon (Plaza 24 de Septiembre)
===================================================== */

class GameScene extends Phaser.Scene {
  constructor(){ super('GameScene'); }
  create(){
    var scene=this;
    this._pausado=false;
    this._dialogo=false;
    // FIX (pantalla se "congelaba" tras rato de juego): si dos lotes
    // llegaban a un hito de recompensa en el mismo frame (muy probable
    // con varios lotes casi listos a la vez), _mostrarRecompensa() se
    // llamaba dos veces seguidas y se apilaban dos paneles a pantalla
    // completa; el de ABAJO quedaba con su overlay oscuro sin poder
    // cerrarse nunca (su botón quedaba tapado por el de encima), y el
    // juego se veía "congelado" para siempre aunque siguiera corriendo
    // detrás. Ahora las recompensas se encolan y se muestran una por una.
    this._colaRecompensas=[];

    // ── Mapa grande top-down
    if(!this.textures.exists('mapa')){
      var mapCanvas=document.createElement('canvas');
      mapCanvas.width=MAP_W; mapCanvas.height=MAP_H;
      dibujarMapa(mapCanvas.getContext('2d'));
      this.textures.addCanvas('mapa',mapCanvas);
    }
    this.add.image(MAP_W/2,MAP_H/2,'mapa');
    this.cameras.main.setBounds(0,0,MAP_W,MAP_H);


    // ── Cargar partida guardada si viene de "Cargar Partida"
    // Doble fuente: registry de Phaser + variable global de respaldo
    var save = this.registry.get('cargar_save') || window._saveParaCargar || null;
    if(save){ this.registry.remove('cargar_save'); window._saveParaCargar = null; }

    // ── Posición inicial
    this.px=(save&&save.px)||MAP_W/2;
    this.py=(save&&save.py)||MAP_H/2+220;
    this.dinero=(save&&save.dinero!=null)?save.dinero:4500; // jugador nuevo arranca con Bs.4500; si hay partida guardada, se respeta su dinero acumulado
    this.habilidadVelocidad=(save&&save.habilidadVelocidad)||0; // 0 = sin comprar, 1..3 = nivel comprado
    this.pFaceRight=true; this.SPEED_BASE=200;
    this._aplicarBonoVelocidad();
    this._lastTex='char_front';

    // ── Zonas de decoración con bancas (norte/sur/oeste/este)
    var zonasGuardadas=(save&&save.zonas)||null;
    this.zonasBanca=[];
    ZONAS_BANCA_DEF.forEach(function(def){
      var est=zonasGuardadas?zonasGuardadas[def.id]:null;
      scene.zonasBanca.push({
        id:def.id, nombre:def.nombre, x:def.x, y:def.y, obligatoria:def.obligatoria,
        precio:PRECIO_BANCA,
        gastado: est?(est.gastado||0):0,
        comprada: est?!!est.comprada:false,
        bloqueada:false,
        _acumulador:0,
        marcador:null, textoNombre:null, _txtEtiqueta:null, textoMonto:null,
        barraFondo:null, barraFill:null, banca:null, sombra:null, candado:null
      });
    });
    // ── Zonas de decoración con faroles triples (calle central)
    var zonasFarolGuardadas=(save&&save.zonasFarol)||null;
    this.zonasFarol=[];
    ZONAS_FAROL_DEF.forEach(function(def){
      var est=zonasFarolGuardadas?zonasFarolGuardadas[def.id]:null;
      scene.zonasFarol.push({
        id:def.id, nombre:def.nombre, x:def.x, y:def.y, obligatoria:def.obligatoria,
        precio:PRECIO_FAROL,
        gastado: est?(est.gastado||0):0,
        comprada: est?!!est.comprada:false,
        bloqueada:false,
        _acumulador:0,
        marcador:null, textoNombre:null, _txtEtiqueta:null, textoMonto:null,
        barraFondo:null, barraFill:null, banca:null, sombra:null, candado:null
      });
    });
    // ── Zonas de decoración con árboles toborochi (4 esquinas del mapa)
    var zonasArbolGuardadas=(save&&save.zonasArbol)||null;
    this.zonasArbol=[];
    ZONAS_ARBOL_DEF.forEach(function(def){
      var est=zonasArbolGuardadas?zonasArbolGuardadas[def.id]:null;
      scene.zonasArbol.push({
        id:def.id, nombre:def.nombre, x:def.x, y:def.y, obligatoria:def.obligatoria,
        tipo:def.tipo||'toborochi', textura:def.textura||'arbol_toborochi',
        precio:PRECIO_ARBOL,
        gastado: est?(est.gastado||0):0,
        comprada: est?!!est.comprada:false,
        bloqueada:false,
        _acumulador:0,

    this.input.keyboard.on('keydown-ESC',function(){

    // ── Tecla E (interactuar/cerrar diálogo) — se escucha directamente
    // en window en vez de depender solo del plugin de teclado de Phaser,
    // porque en algunas PC el foco del canvas hace que Phaser no reciba
    // el evento aunque el navegador sí lo capte. Así funciona igual en
    // PC (tecla física) y en celular (botón táctil, vía _accionE()).
    this._onKeyDownE=function(ev){
      if(ev.repeat) return; // FIX: si se mantiene la tecla presionada, el
      // navegador dispara keydown repetidamente (auto-repeat del SO), y
      // sin este chequeo _accionE() alternaba abrir/cerrar el diálogo en
      // bucle mientras la tecla seguía apretada (se veía como un parpadeo).
      if(ev.code==='KeyE' || ev.key==='e' || ev.key==='E'){
        scene._accionE();
      }
    };
    window.addEventListener('keydown',this._onKeyDownE);

    this._onKeyDownQ=function(ev){
      if(ev.repeat) return; // FIX: mismo motivo que la tecla E — evita que
      // mantener Q presionada abra/cierre la guía del mapa en bucle.
      if(ev.code==='KeyQ' || ev.key==='q' || ev.key==='Q'){

    if(!save){

    // a mano "GUARDAR PARTIDA". Si cerraba la pestaña, el celular
    // mataba la app en segundo plano (muy común en Android/iOS al

    // TODO el progreso desde el último guardado manual. Ahora se

    this._autoguardadoEvent = this.time.addEvent({

      callback: function(){ scene._autoguardarPartida(); }

    this._onVisibilidadCambia = function(){
      if(document.hidden) scene._autoguardarPartida();
    };
    document.addEventListener('visibilitychange', this._onVisibilidadCambia);
    this._onPageHide = function(){ scene._autoguardarPartida(); };
    window.addEventListener('pagehide', this._onPageHide);

  // Mismo guardado que el botón "GUARDAR PARTIDA" del menú de pausa,
  // pero disparado solo y en silencio (sin mensaje en pantalla) para
  // no perder progreso si el jugador cierra la app sin guardar a mano.
  _autoguardarPartida(){
    try{ guardarPartida(this.dinero,this.px,this.py,this._construirDatosGuardado()); }catch(e){}
  }

  // Apaga el temporizador de autoguardado y los listeners de
  // visibilidad/pagehide. Se usa cuando el jugador termina el juego, para
  // que no se vuelva a crear una partida guardada después de borrarla.
  _detenerAutoguardado(){
    if(this._autoguardadoEvent){ this._autoguardadoEvent.remove(false); this._autoguardadoEvent=null; }
    if(this._onVisibilidadCambia){ document.removeEventListener('visibilitychange', this._onVisibilidadCambia); this._onVisibilidadCambia=null; }
    if(this._onPageHide){ window.removeEventListener('pagehide', this._onPageHide); this._onPageHide=null; }
  }

  _abrirPausa(){
    if(this._pausado || this._dialogo) return;
    this._pausado = true;
    this.scene.launch('PauseScene');
    this.scene.bringToTop('PauseScene');
    this.scene.pause();
  }

  // Acción única de la tecla/botón E: si hay un diálogo abierto lo
  // cierra; si no, intenta abrir el diálogo del NPC más cercano.
  // Usada tanto por el listener de teclado (PC) como por el botón
  // táctil (celular), para que ambos se comporten exactamente igual.
  _accionE(){
    if(this._pausado) return;
    if(this._tutorialActivo){ this._avanzarTutorial(); return; }
    if(this._dialogo){
      if(this._dialogoCerrar) this._dialogoCerrar();
      return;
    }
    if(this._alcaldia && this._alcaldia.desbloqueada){
      var distAlc=Phaser.Math.Distance.Between(this.px,this.py,ALCALDIA_ZONA_X,ALCALDIA_ZONA_Y);
      if(distAlc<90){ this._mostrarInfoAlcaldia(); return; }
    }
    for(var j=0;j<this._npcs.length;j++){
      var npc=this._npcs[j];
      if(Phaser.Math.Distance.Between(this.px,this.py,npc.x,npc.y)<110){
        this._mostrarDialogoNPC(npc);
        break;
      }
    }
  }

  // Tecla/botón Q: abre la Guía del Mapa. Si ya hay CUALQUIER panel
  // abierto (pausa, otro diálogo, etc.) no hace nada, para no apilar
  // paneles encima de otros.
  _accionQ(){
    if(this._guiaMapaAbierta){ if(this._dialogoCerrar) this._dialogoCerrar(); return; }
    if(this._pausado || this._dialogo || this._tutorialActivo) return;
    this._abrirGuiaMapa();
  }

  // ── Tutorial inicial: un globo de diálogo aparece automáticamente al
  // lado derecho del personaje, apenas se entra al juego, SIN que el
  // jugador tenga que presionar nada. Ahora son 2 páginas, MISMO
  // tamaño de cuadro que antes (no se agranda nada):
  //   Página 1: cómo moverse y cómo hablar con los ciudadanos.
  //   Página 2: para qué junta plata (reconstruir la plaza) y que el
  //             progreso de cada lote es lo que hace avanzar el juego.
  // Se avanza de página con E (aparece una flechita hacia abajo que
  // lo indica); en la última página, E cierra el tutorial. El
  // personaje también puede saltarlo moviéndose, igual que antes.
  _crearTutorial(){
    var scene=this;
    // NPC de tutorial, parado en frente del personaje (el jugador
    // arranca mirando de frente/hacia abajo, así que "en frente"
    // queda justo debajo de él en pantalla).
    var npcX=this.px, npcY=this.py+96;
    var npcShadow=this.add.ellipse(npcX,npcY+10,42,14,0x000000,0.18).setDepth(498);
    var npcImg=this.add.image(npcX,npcY,'npc_especial').setOrigin(0.5,1).setScale(0.52).setDepth(499);

    var bx=npcX+210, by=npcY-90;
    var bw=330, bh=228;
    var ov=this.add.rectangle(bx,by,bw,bh,0x050A1A,0.96).setDepth(500);

  _avanzarTutorial(){

    if(siguiente < this._tutorialPaginas.length){
      this._tutorialPaginaActual=siguiente;

      var esUltima = siguiente === this._tutorialPaginas.length-1;

      this._tutorialHint.setText(esUltima ? '[ Presiona E para empezar ]' : '[ Presiona E para continuar ]');

    } else {

  _crearControlesTactiles(){
    var scene=this;
    // Solo mostrar controles táctiles en dispositivos touch
    if(!this.sys.game.device.input.touch) return;
    var dep=260, SF=0; // scrollFactor=0 = fijo en pantalla

    // ── Joystick analógico (tipo emulador) — soporta las 8 direcciones,
    // incluidas las diagonales, de forma natural con un solo dedo.
    var baseX=150, baseY=560, baseR=95, knobR=46;
    var bg=scene.add.graphics().setScrollFactor(SF).setDepth(dep);
    bg.fillStyle(0x000000,0.35); bg.fillCircle(baseX,baseY,baseR);
    bg.lineStyle(3,0xFFFFFF,0.30); bg.strokeCircle(baseX,baseY,baseR);
    var knob=scene.add.graphics().setScrollFactor(SF).setDepth(dep+1);
    function dibujarKnob(x,y,activo){
      knob.clear();
      knob.fillStyle(0x000000,0.35); knob.fillCircle(x,y+4,knobR);
      knob.fillStyle(activo?0x3E7FD8:0x2A4A80,0.92); knob.fillCircle(x,y,knobR);
      knob.fillStyle(0xFFFFFF,0.18); knob.fillCircle(x-knobR*0.28,y-knobR*0.28,knobR*0.42);
      knob.lineStyle(3,0xFFFFFF,0.55); knob.strokeCircle(x,y,knobR);
    }
    dibujarKnob(baseX,baseY,false);

    scene._joyDX=0; scene._joyDY=0;
    var activeId=null;
    function actualizarKnob(p){
      var dx=p.x-baseX, dy=p.y-baseY;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>baseR){ dx=dx/dist*baseR; dy=dy/dist*baseR; dist=baseR; }
      dibujarKnob(baseX+dx,baseY+dy,true);
      var dead=16;
      if(dist<dead){ scene._joyDX=0; scene._joyDY=0; }
      else { scene._joyDX=dx/baseR; scene._joyDY=dy/baseR; }
    }
    function soltarKnob(p){
      if(p && p.id!==activeId) return;
      activeId=null; scene._joyDX=0; scene._joyDY=0;
      dibujarKnob(baseX,baseY,false);
    }
    // Zona amplia alrededor del joystick para poder mover el dedo sin
    // perder el control aunque se salga un poco del círculo base.
    var zJoy=scene.add.zone(baseX,baseY,baseR*2.7,baseR*2.7).setScrollFactor(SF).setDepth(dep+2).setInteractive();
    zJoy.on('pointerdown',function(p){ activeId=p.id; actualizarKnob(p); });
    function moverKnob(p){ if(p.id===activeId) actualizarKnob(p); }
    scene.input.on('pointermove',moverKnob);
    scene.input.on('pointerup',soltarKnob);
    scene.input.on('pointerupoutside',soltarKnob);
    scene.events.on('shutdown',function(){
      scene.input.off('pointermove',moverKnob);
      scene.input.off('pointerup',soltarKnob);
      scene.input.off('pointerupoutside',soltarKnob);
    });

    // Botón E (interactuar) y P (pausa) — más grandes para facilitar el toque
    var eBx=1160, eBy=600, eW=110, eH=95;
    // Botón E
    var bgE=scene.add.graphics().setScrollFactor(SF).setDepth(dep);
    bgE.fillStyle(0x1D8C38,0.88); bgE.fillRoundedRect(eBx-eW/2,eBy-eH/2,eW,eH,14);
    bgE.lineStyle(3,0xFFFFFF,0.35); bgE.strokeRoundedRect(eBx-eW/2,eBy-eH/2,eW,eH,14);
    scene.add.text(eBx,eBy,'E',{fontFamily:"'Press Start 2P'",fontSize:'26px',color:'#FFF'}).setOrigin(0.5).setScrollFactor(SF).setDepth(dep+1);
    var zE=scene.add.zone(eBx,eBy,eW,eH).setScrollFactor(SF).setDepth(dep+2).setInteractive();
    zE.on('pointerdown',function(){ scene._accionE(); });
    // Botón Q (Guía del Mapa) — arriba del botón E, un poco más chico.
    var qBx=eBx, qBy=eBy-eH-14, qW=88, qH=64;
    var bgQ=scene.add.graphics().setScrollFactor(SF).setDepth(dep);
    bgQ.fillStyle(0x0A2440,0.88); bgQ.fillRoundedRect(qBx-qW/2,qBy-qH/2,qW,qH,12);
    bgQ.lineStyle(3,0x4FC3F7,0.55); bgQ.strokeRoundedRect(qBx-qW/2,qBy-qH/2,qW,qH,12);
    scene.add.text(qBx,qBy,'Q',{fontFamily:"'Press Start 2P'",fontSize:'20px',color:'#4FC3F7'}).setOrigin(0.5).setScrollFactor(SF).setDepth(dep+1);
    var zQ=scene.add.zone(qBx,qBy,qW,qH).setScrollFactor(SF).setDepth(dep+2).setInteractive();
    zQ.on('pointerdown',function(){ scene._accionQ(); });
    // Botón de pantalla completa (por si el navegador la cerró)
    var fBx=1230, fBy=82;
    var bgF=scene.add.graphics().setScrollFactor(SF).setDepth(dep);
    bgF.fillStyle(0x000000,0.5); bgF.fillRoundedRect(fBx-24,fBy-24,48,48,10);
    bgF.lineStyle(2,0xFFFFFF,0.4); bgF.strokeRoundedRect(fBx-24,fBy-24,48,48,10);
    scene.add.text(fBx,fBy,'⛶',{fontFamily:'Arial',fontSize:'24px',color:'#FFFFFF'}).setOrigin(0.5).setScrollFactor(SF).setDepth(dep+1);
    var zF=scene.add.zone(fBx,fBy,48,48).setScrollFactor(SF).setDepth(dep+2).setInteractive();
    zF.on('pointerdown',function(){ attemptFullscreen(scene); });
  }

  // Arranca el temporizador que dispara una protesta cada
  // PROTESTA_INTERVALO_MS (5 minutos), mientras el jugador esté jugando.
  _crearSistemaProtesta(){
    var scene=this;
    this._protestaEvent=this.time.addEvent({
      delay:PROTESTA_INTERVALO_MS, loop:true,
      callback:function(){
        if(!scene._protesta.activa && !scene._pausado && !scene._dialogo) scene._iniciarProtesta();
      }
    });
  }

  // Suma el ingreso por segundo de TODOS los lotes construidos (en
  // cualquier nivel: 1, 2 o 3), usando las constantes propias de cada
  // lote (LOTE_, LOTE2_ ... LOTE10_). Esto es lo que la protesta usa
  // como base para calcular su descuento del 35%.
  _calcularIngresoTotalPorSegundo(){
    var total=0;
    var lotes=[
      {obj:this._lote,   n1:LOTE_INGRESO_BS,   n2:LOTE_INGRESO_BS_N2,   n3:LOTE_INGRESO_BS_N3,   ms:LOTE_INGRESO_MS},
      {obj:this._lote2,  n1:LOTE2_INGRESO_BS,  n2:LOTE2_INGRESO_BS_N2,  n3:LOTE2_INGRESO_BS_N3,  ms:LOTE2_INGRESO_MS},
      {obj:this._lote3,  n1:LOTE3_INGRESO_BS,  n2:LOTE3_INGRESO_BS_N2,  n3:LOTE3_INGRESO_BS_N3,  ms:LOTE3_INGRESO_MS},
      {obj:this._lote4,  n1:LOTE4_INGRESO_BS,  n2:LOTE4_INGRESO_BS_N2,  n3:LOTE4_INGRESO_BS_N3,  ms:LOTE4_INGRESO_MS},
      {obj:this._lote5,  n1:LOTE5_INGRESO_BS,  n2:LOTE5_INGRESO_BS_N2,  n3:LOTE5_INGRESO_BS_N3,  ms:LOTE5_INGRESO_MS},
      {obj:this._lote6,  n1:LOTE6_INGRESO_BS,  n2:LOTE6_INGRESO_BS_N2,  n3:LOTE6_INGRESO_BS_N3,  ms:LOTE6_INGRESO_MS},
      {obj:this._lote7,  n1:LOTE7_INGRESO_BS,  n2:LOTE7_INGRESO_BS_N2,  n3:LOTE7_INGRESO_BS_N3,  ms:LOTE7_INGRESO_MS},
      {obj:this._lote8,  n1:LOTE8_INGRESO_BS,  n2:LOTE8_INGRESO_BS_N2,  n3:LOTE8_INGRESO_BS_N3,  ms:LOTE8_INGRESO_MS},
      {obj:this._lote9,  n1:LOTE9_INGRESO_BS,  n2:LOTE9_INGRESO_BS_N2,  n3:LOTE9_INGRESO_BS_N3,  ms:LOTE9_INGRESO_MS},
      {obj:this._lote10, n1:LOTE10_INGRESO_BS, n2:LOTE10_INGRESO_BS_N2, n3:LOTE10_INGRESO_BS_N3, ms:LOTE10_INGRESO_MS}
    ];
    for(var i=0;i<lotes.length;i++){
      var L=lotes[i], lote=L.obj;
      if(!lote || !(lote.fase>=2)) continue;
      var bs = lote.fase>=4 ? L.n3 : (lote.fase>=3 ? L.n2 : L.n1);
      total += bs; // suma directa del Bs. de cada lote (SIN dividir por el intervalo),
                   // tal cual acordamos: 100+700+1000=1800 → 35% = 630
    }
    return total;
  }

  // arriba), calcula cuántas monedas hay que recoger (70% prob:10-20,

    var scene=this, p=this._protesta;

  // de la pantalla con la cantidad de monedas que faltan recoger.

      this.hudProtesta=this.add.text(640,64,'',{

  // Se llama cada frame desde update(). Mientras la protesta esté
  // activa Y el aviso ya se haya cerrado: descuenta 35% del ingreso
  // total/seg (proporcional a delta, restado directo de this.dinero)
  // y refresca el HUD superior con el progreso de monedas.
  _actualizarProtesta(delta){
    var p=this._protesta;
    if(!p.activa) return;
    if(this._dialogo) return; // aviso emergente aún abierto: todo congelado
    var dt=delta/1000;

    var ingresoSeg = this._calcularIngresoTotalPorSegundo();
    var descuentoSeg = ingresoSeg*PROTESTA_PORCENTAJE;
    if(descuentoSeg>0){
      p._acumDescuento += descuentoSeg*dt*PROTESTA_VELOCIDAD_DESCUENTO;
      // Se descuenta en enteros para que el HUD siempre muestre números
      // limpios (igual que el resto del dinero del juego).
      var restar = Math.floor(p._acumDescuento);
      if(restar>0){
        p._acumDescuento -= restar;
        this.dinero = Math.max(0,this.dinero-restar);
        this.hudDinero.setText('Bs. '+this.dinero);
      }
    }
    if(this.hudProtesta){
      this.hudProtesta.setText('¡PROTESTA! Recoge '+p.monedasRecogidas+'/'+p.monedasNecesarias+' monedas  (-'+Math.round(descuentoSeg*PROTESTA_VELOCIDAD_DESCUENTO)+' Bs./seg)');
    }

    if(p.monedasRecogidas>=p.monedasNecesarias) this._terminarProtesta();
  }

  // Llamado desde el pickup de monedas: suma 1 al contador de la
  // protesta (si está activa y el aviso ya se cerró) y termina la
  // protesta si se completó.
  _recogerMonedaParaProtesta(){
    var p=this._protesta;
    if(!p.activa || this._dialogo) return;
    p.monedasRecogidas++;
    if(p.monedasRecogidas>=p.monedasNecesarias) this._terminarProtesta();
  }

  // Los protestantes se calman y desaparecen: se destruyen los sprites
  // y el HUD superior, se muestra el mensaje de éxito y se resetea el estado.
  _terminarProtesta(){
    var scene=this, p=this._protesta;
    if(!p.activa) return;

  /* =====================================================
     SISTEMA DE LADRÓN (obstáculo)

  // Arranca el temporizador que hace aparecer un ladrón nuevo cada
  // LADRON_INTERVALO_MS (30 segundos), si no hay uno ya en camino.
  _crearSistemaLadron(){
    var scene=this;
    this.time.addEvent({
      delay:LADRON_INTERVALO_MS, loop:true,
      callback:function(){
        if(!scene._ladron.activa) scene._iniciarLadron();
      }
    });
  }

  // Hace aparecer al ladrón en el Lote 1 y muestra panel de aviso.
  // El ladrón queda congelado hasta que el jugador presione ACEPTAR.
  _iniciarLadron(){
    var scene=this;
    var l=this._ladron;
    var p0=LADRON_RUTA[0];
    l.activa=true;
    l.elapsed=0;
    l._congelado=true; // congelado hasta que el jugador acepte el aviso
    // FIX: antes el personaje se podía seguir moviendo con WASD/flechas
    // mientras este aviso estaba en pantalla, porque a diferencia del
    // aviso de la protesta, nunca activaba _dialogo (la bandera que el
    // update() usa para bloquear el movimiento). Ahora se activa igual
    // que en el aviso de la protesta.
    scene._dialogo=true;
    AudioMgr.playAdvertencia(scene);

    // Sprite del ladrón: usa malo.txt si está disponible, sino fallback rojo
    l.sombra=this.add.ellipse(p0.x,p0.y+14,32,10,0x000000,0.3).setDepth(48);
    var texKey = this.textures.exists('malo_tex') ? 'malo_tex' : 'char_front';
    l.sprite=this.add.image(p0.x,p0.y,texKey)
      .setOrigin(0.5,1).setDisplaySize(60,80).setDepth(49);
    if(texKey==='char_front') l.sprite.setTint(0x662020);

    // Panel de aviso centrado — congela todo hasta ACEPTAR
    var cx=640, cy=360;
    var ov=scene.add.rectangle(cx,cy,1280,720,0x000000,0.65).setDepth(310).setScrollFactor(0);
    var g=scene.add.graphics().setDepth(311).setScrollFactor(0);
    g.fillStyle(0x1A0505,1); g.fillRoundedRect(cx-260,cy-110,520,220,14);
    g.lineStyle(4,0xFF3333,1); g.strokeRoundedRect(cx-260,cy-110,520,220,14);
    g.fillStyle(0xFF3333,1);
    g.fillRect(cx-260,cy-110,14,14); g.fillRect(cx+246,cy-110,14,14);
    g.fillRect(cx-260,cy+96,14,14);  g.fillRect(cx+246,cy+96,14,14);
    // Guardar referencias a los textos para poder destruirlos después
    var txtTitle=scene.add.text(cx,cy-60,'¡CUIDADO!',{
      fontFamily:"'Press Start 2P'",fontSize:'20px',color:'#FF3333',
      stroke:'#000',strokeThickness:3
    }).setOrigin(0.5).setDepth(312).setScrollFactor(0);
    var txtSub=scene.add.text(cx,cy-20,'VIENE JHONNY FERNANDEZ',{
      fontFamily:"'Press Start 2P'",fontSize:'14px',color:'#FFFFFF',
      stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(312).setScrollFactor(0);
    var txtDesc=scene.add.text(cx,cy+18,'Va a robar el dinero acumulado\nde tus estructuras si no lo evitas.',{
      fontFamily:"'Press Start 2P'",fontSize:'8px',color:'#FFAAAA',
      stroke:'#000',strokeThickness:1,align:'center'
    }).setOrigin(0.5).setDepth(312).setScrollFactor(0);
    var btnAceptar=scene.add.text(cx,cy+75,'  ACEPTAR  ',{
      fontFamily:"'Press Start 2P'",fontSize:'13px',color:'#FFFFFF',
      backgroundColor:'#AA1111',padding:{x:16,y:8},stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(312).setScrollFactor(0).setInteractive({useHandCursor:true});
    btnAceptar.on('pointerover',function(){ btnAceptar.setBackgroundColor('#DD2222'); });
    btnAceptar.on('pointerout', function(){ btnAceptar.setBackgroundColor('#AA1111'); });
    // Destruir TODOS los elementos del panel al cerrar
    var panelElems=[ov,g,txtTitle,txtSub,txtDesc,btnAceptar];
    var cerrarPanel=function(){
      panelElems.forEach(function(o){ try{ if(o && o.active) o.destroy(); }catch(e){} });
      l._congelado=false; // descongelar al ladrón
      scene._dialogo=false; // FIX: reactiva el movimiento del personaje
      scene._dialogoCerrar=null;
      scene._flushColaRecompensas();
    };
    scene._dialogoCerrar=cerrarPanel; // así la tecla/botón E también cierra este aviso
    btnAceptar.on('pointerdown', cerrarPanel);
    // También cerrar con Enter o Espacio
    var onKey=function(ev){
      if(ev.keyCode===13||ev.keyCode===32){
        scene.input.keyboard.off('keydown',onKey);
        cerrarPanel();
      }
    };
    scene.input.keyboard.on('keydown',onKey);
  }

  // Se llama cada frame desde update(). Avanza al ladrón por el
  // recorrido (LADRON_RUTA). Queda congelado mientras _congelado=true.
  _actualizarLadron(delta){
    var l=this._ladron;
    if(!l.activa) return;
    if(this._pausado) return;
    if(l._congelado) return; // congelado por el panel de aviso
    l.elapsed += delta;

    var t = Phaser.Math.Clamp(l.elapsed/LADRON_DURACION_MS,0,1);
    var segCount = LADRON_RUTA.length-1;
    var segFloat = t*segCount;
    var segIdx = Math.min(Math.floor(segFloat),segCount-1);
    var segT = segFloat-segIdx;
    var a=LADRON_RUTA[segIdx], b=LADRON_RUTA[segIdx+1];
    var x=a.x+(b.x-a.x)*segT, y=a.y+(b.y-a.y)*segT;

    if(l.sprite){
      if(b.x<a.x) l.sprite.setFlipX(true); else if(b.x>a.x) l.sprite.setFlipX(false);
      l.sprite.setPosition(x,y);
      if(l.sombra) l.sombra.setPosition(x,y+14);
    }

    this._robarLotesCercanos(x,y);

    if(t>=1) this._terminarLadron();
  }

  // Revisa los 10 lotes: si el ladrón está lo bastante cerca del pad de
  // recogida de alguno Y ese lote tiene dinero acumulado esperando
  // (las "monedas flotantes" que el jugador todavía no recogió), se
  // lo roba, lo pone en 0 y refresca el visual del pad (se apaga,
  // igual que cuando lo recoge el jugador).
  _robarLotesCercanos(x,y){
    var scene=this;
    var lotes=[
      {obj:this._lote,   bx:LOTE_BOTON_X,   by:LOTE_BOTON_Y,   fn:this._actualizarVisualRecogida},
      {obj:this._lote2,  bx:LOTE2_BOTON_X,  by:LOTE2_BOTON_Y,  fn:this._actualizarVisualRecogida2},
      {obj:this._lote3,  bx:LOTE3_BOTON_X,  by:LOTE3_BOTON_Y,  fn:this._actualizarVisualRecogida3},
      {obj:this._lote4,  bx:LOTE4_BOTON_X,  by:LOTE4_BOTON_Y,  fn:this._actualizarVisualRecogida4},
      {obj:this._lote5,  bx:LOTE5_BOTON_X,  by:LOTE5_BOTON_Y,  fn:this._actualizarVisualRecogida5},
      {obj:this._lote6,  bx:LOTE6_BOTON_X,  by:LOTE6_BOTON_Y,  fn:this._actualizarVisualRecogida6},
      {obj:this._lote7,  bx:LOTE7_BOTON_X,  by:LOTE7_BOTON_Y,  fn:this._actualizarVisualRecogida7},
      {obj:this._lote8,  bx:LOTE8_BOTON_X,  by:LOTE8_BOTON_Y,  fn:this._actualizarVisualRecogida8},
      {obj:this._lote9,  bx:LOTE9_BOTON_X,  by:LOTE9_BOTON_Y,  fn:this._actualizarVisualRecogida9},
      {obj:this._lote10, bx:LOTE10_BOTON_X, by:LOTE10_BOTON_Y, fn:this._actualizarVisualRecogida10}
    ];
    for(var i=0;i<lotes.length;i++){
      var L=lotes[i];
      if(!L.obj) continue;
      var monto=L.obj.acumuladoDinero||0;
      if(monto<=0) continue;
      var dist=Phaser.Math.Distance.Between(x,y,L.bx,L.by);
      if(dist<LADRON_RADIO_ROBO){
        L.obj.acumuladoDinero=0;
        if(L.fn) L.fn.call(this);
        var av=this.add.text(L.bx,L.by-42,'¡Robado! -Bs.'+monto,{
          fontFamily:"'Press Start 2P'",fontSize:'7px',color:'#FF4444',
          stroke:'#000',strokeThickness:2
        }).setOrigin(0.5).setDepth(62);
        this.tweens.add({targets:av,y:av.y-30,alpha:0,duration:900,onComplete:function(){av.destroy();}});
        this.cameras.main.flash(120,180,20,20,true);
      }
    }
  }

  // El ladrón termina su vuelta y desaparece hasta la próxima vez.
  _terminarLadron(){
    var l=this._ladron;
    l.activa=false;
    ['sprite','sombra','textoAviso'].forEach(function(k){
      if(l[k]){ try{l[k].destroy();}catch(e){} l[k]=null; }
    });
  }

  // ── Crea, para cada zona, el marcador (si falta comprarla y ya está
  // desbloqueada), el candado (si todavía está bloqueada porque la banca
  // anterior no está construida) o la banca ya instalada (si venía
  // comprada de una partida guardada).
  _crearZonasBanca(){
    var scene=this;
    this.zonasBanca.forEach(function(z,idx){
      if(z.comprada){ scene._instalarBanca(z); return; }
      var anterior = idx>0 ? scene.zonasBanca[idx-1] : null;
      z.bloqueada = anterior ? !anterior.comprada : false;
      if(z.bloqueada) scene._crearCandadoZona(z);
      else scene._crearMarcadorZona(z);
    });
  }

  // ── Candado sobre una zona todavía bloqueada: no se puede pagar ni
  // caminar-y-cobrar encima, solo se ve gris con un ícono de candado,
  // hasta que se termine de construir la banca anterior de la fila.
  _crearCandadoZona(z){
    var g=this.add.graphics().setDepth(50);
    g.lineStyle(3,0x777777,0.7); g.strokeCircle(z.x,z.y,46);
    g.fillStyle(0x222222,0.45); g.fillCircle(z.x,z.y,46);
    var txtNom=this.add.text(z.x,z.y-66,z.nombre.toUpperCase(),{
      fontFamily:"'Press Start 2P'",fontSize:'7px',color:'#888888',stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(51);
    var candado;
    if(this.textures.exists('icono_candado')){
      candado=this.add.image(z.x,z.y-6,'icono_candado').setDisplaySize(40,40).setDepth(51);
    } else {
      candado=this.add.text(z.x,z.y-6,'🔒',{fontSize:'26px'}).setOrigin(0.5).setDepth(51);
    }
    var txtEti=this.add.text(z.x,z.y+34,'[ BLOQUEADA ]',{
      fontFamily:"'Press Start 2P'",fontSize:'6px',color:'#999999'
    }).setOrigin(0.5).setDepth(51);
    z.marcador=g; z.textoNombre=txtNom; z._txtEtiqueta=txtEti; z.candado=candado;
  }

  // ── Se llama cuando la banca anterior termina de construirse: destruye
  // el candado de la siguiente zona (si tenía) y muestra su marcador de
  // pago normal, para que el jugador ya pueda empezar a construirla.
  _desbloquearZonaBanca(z){
    ['marcador','textoNombre','_txtEtiqueta','textoMonto','barraFondo','barraFill','candado'].forEach(function(k){
      if(z[k]){ try{z[k].destroy();}catch(e){} z[k]=null; }
    });
    z.bloqueada=false;
    this._crearMarcadorZona(z);
  }

  // ── Marcador en el piso: círculo, nombre, etiqueta OBLIGATORIA/OPCIONAL
  // y precio. Se ve mientras la banca todavía no está comprada.
  _crearMarcadorZona(z){
    var color=z.obligatoria?0xFFD700:0x66CCFF;
    var g=this.add.graphics().setDepth(50);
    g.lineStyle(3,color,0.85); g.strokeCircle(z.x,z.y,46);
    g.fillStyle(color,0.12); g.fillCircle(z.x,z.y,46);
    var txtNom=this.add.text(z.x,z.y-66,z.nombre.toUpperCase(),{
      fontFamily:"'Press Start 2P'",fontSize:'7px',color:z.obligatoria?'#FFD700':'#66CCFF',stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(51);
    var txtEti=this.add.text(z.x,z.y-52,z.obligatoria?'[ REQUERIDA ]':'[ OPCIONAL ]',{
      fontFamily:"'Press Start 2P'",fontSize:'6px',color:'#AAAAAA'
    }).setOrigin(0.5).setDepth(51);
    var txtPrecio=this.add.text(z.x,z.y+4,'Bs. '+z.precio,{
      fontFamily:"'Press Start 2P'",fontSize:'9px',color:'#FFFFFF',stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(51);
    var bFondo=this.add.graphics().setDepth(51).setVisible(false);
    var bFill=this.add.graphics().setDepth(52);
    z.marcador=g; z.textoNombre=txtNom; z._txtEtiqueta=txtEti; z.textoMonto=txtPrecio;
    z.barraFondo=bFondo; z.barraFill=bFill;
    this._dibujarProgresoZona(z);
  }

  // ── Redibuja la barrita de progreso y el texto "Bs. X / 500" de una
  // zona todavía no comprada, según cuánto se ha gastado en ella.
  _dibujarProgresoZona(z){
    if(!z.barraFill) return;
    var bw=76,bh=10;
    z.barraFill.clear();
    if(z.gastado<=0){
      z.barraFondo.setVisible(false);
      z.textoMonto.setText('Bs. '+z.precio);
      return;
    }
    z.barraFondo.clear().setVisible(true);
    z.barraFondo.fillStyle(0x000000,0.6); z.barraFondo.fillRoundedRect(z.x-bw/2,z.y+18,bw,bh,3);
    var pct=Phaser.Math.Clamp(z.gastado/z.precio,0,1);
    z.barraFill.fillStyle(0x33DD33,1);
    z.barraFill.fillRoundedRect(z.x-bw/2+2,z.y+20,(bw-4)*pct,bh-4,2);
    var faltan=Math.max(0,z.precio-z.gastado);
    z.textoMonto.setText('Bs. '+Math.floor(z.gastado)+' / '+z.precio);
    if(faltan>0 && this.dinero<=0){
      z.textoMonto.setColor('#FF6666');
    } else {
      z.textoMonto.setColor('#FFFFFF');
    }
  }

  // ── Destruye el marcador (si existía) y coloca la banca colonial real.
  _instalarBanca(z){
    ['marcador','textoNombre','_txtEtiqueta','textoMonto','barraFondo','barraFill','candado'].forEach(function(k){
      if(z[k]){ try{z[k].destroy();}catch(e){} z[k]=null; }
    });
    var sombra=this.add.ellipse(z.x,z.y+56,120,24,0x000000,0.25).setDepth(39);
    var img=this.add.image(z.x,z.y,'banca_colonial').setDisplaySize(150,120).setDepth(40);
    z.sombra=sombra; z.banca=img;
  }

  // ── Destruye el marcador (si existía) y coloca el farol triple real.
  _instalarFarol(z){
    ['marcador','textoNombre','_txtEtiqueta','textoMonto','barraFondo','barraFill','candado'].forEach(function(k){
      if(z[k]){ try{z[k].destroy();}catch(e){} z[k]=null; }

  // ── Crea, para cada zona de árbol toborochi, el marcador/candado/
  // árbol ya instalado. Misma lógica de bloqueo en cadena que las
  // bancas y los faroles: reutiliza _crearCandadoZona / _crearMarcadorZona
  // / _desbloquearZonaBanca, que son genéricos.
  _crearZonasArbol(){
    var scene=this;
    this.zonasArbol.forEach(function(z,idx){
      if(z.comprada){ scene._instalarArbol(z); return; }
      var anterior = idx>0 ? scene.zonasArbol[idx-1] : null;
      z.bloqueada = anterior ? !anterior.comprada : false;
      if(z.bloqueada) scene._crearCandadoZona(z);
      else scene._crearMarcadorZona(z);
    });
  }

  // ── Muestra u oculta el recordatorio de objetivo en el HUD: muestra
  // siempre la primera banca de la fila (1 a 8) que todavía no esté
  // construida, para que el jugador sepa cuál sigue en la secuencia.
  _actualizarObjetivoHUD(){
    if(!this.hudObjetivo) return;
    var pendiente=null;
    for(var i=0;i<this.zonasBanca.length;i++){
      if(!this.zonasBanca[i].comprada){ pendiente=this.zonasBanca[i]; break; }
    }
    if(this._npcBancasVisto && pendiente){
      this.hudObjetivo.setText('OBJETIVO:\nDecorar la '+pendiente.nombre+'\n(Bs. '+pendiente.precio+')').setVisible(true);
    } else {
      this.hudObjetivo.setVisible(false);
    }
  }

  // ── Arma el texto completo del panel de OBJETIVOS (papel.txt), con
  // una entrada por cada NPC rojo (guía) al que el jugador ya le haya
  // preguntado. El texto puede crecer bastante (varios NPC, cada uno
  // con su propia explicación), por eso el panel que lo muestra tiene
  // scroll. Si todavía no habló con ningún guía, muestra un aviso.
  _construirTextoObjetivos(){
    var partes=[];
    if(this._npcFarolVisto){
      var farolPend=null;
      for(var i=0;i<this.zonasFarol.length;i++){
        if(!this.zonasFarol[i].comprada){ farolPend=this.zonasFarol[i]; break; }
      }
      var txtFarol='FAROLES\n\nInstalá faroles triples a lo\nlargo de la calle central\npara que la plaza luzca\nmejor. Empezá por el\nFarol 1 y seguí en orden,\nuno por uno.';
      if(farolPend) txtFarol+='\n\nSiguiente: '+farolPend.nombre.toUpperCase()+'\n(Bs. '+farolPend.precio+')';
      else txtFarol+='\n\n¡Ya instalaste todos\nlos faroles!';
      partes.push(txtFarol);
    }
    if(this._npcArbolVisto){
      var arbolPend=null;
      for(var k=0;k<this.zonasArbol.length;k++){
        if(!this.zonasArbol[k].comprada){ arbolPend=this.zonasArbol[k]; break; }
      }
      var txtArbol='ÁRBOLES\n\nPlantá árboles toborochi\ny árboles rosa en las 4\nesquinas del mapa para\nque la plaza luzca mejor.\nSon 8 en total (4\ntoborochi + 4 rosa).\nEmpezá por el Árbol 1 y\nseguí en orden, uno por\nuno.';
      if(arbolPend) txtArbol+='\n\nSiguiente: '+arbolPend.nombre.toUpperCase()+'\n(Bs. '+arbolPend.precio+')';
      else txtArbol+='\n\n¡Ya plantaste todos\nlos árboles!';
      partes.push(txtArbol);
    }
    if(this._npcPatujuVisto){
      var patujuPendientes=[];
      for(var pp=0;pp<this.zonasPatuju.length;pp++){
        if(!this.zonasPatuju[pp].comprada) patujuPendientes.push(this.zonasPatuju[pp]);
      }
      var txtPatuju='PATUJÚ\n\nEl patujú es la flor\nnacional de Bolivia y un\nimportante símbolo de\nidentidad de las tierras\nbajas y del oriente del\npaís.\n\nAndá plantando los 3\npatujúes repartidos por\nel mapa (junto a los\nlotes 5, 6, 8 y 9).';
      if(patujuPendientes.length>0){
        txtPatuju+='\n\nFaltan: '+patujuPendientes.map(function(z){ return z.nombre.toUpperCase(); }).join(', ')+'\n(Bs. '+PRECIO_PATUJU+' c/u)';
      } else {
        txtPatuju+='\n\n¡Ya plantaste los\n3 patujúes!';
      }
      partes.push(txtPatuju);
    }
    if(this._npcLote1Visto){
      var txtLote='LOTES\n\nComprá el terreno de cada\nlote y construí tu\nestructura para generar\nganancias todos los días.\nEsas ganancias ayudan a\nmejorar la Plaza 24 de\nSeptiembre.\n\nEmpezá por el Lote 1 y\nseguí desbloqueando los\nsiguientes lotes a medida\nque avanzás.';
      partes.push(txtLote);
    }
    if(this._npcBancasVisto){
      var pendiente=null;
      for(var j=0;j<this.zonasBanca.length;j++){
        if(!this.zonasBanca[j].comprada){ pendiente=this.zonasBanca[j]; break; }
      }
      var txtBanca='BANCAS\n\nDecorá la plaza colocando\nbancas coloniales en cada\nzona marcada. Empezá por\nla Banca 1 y continuá en\norden.';
      if(pendiente) txtBanca+='\n\nSiguiente: '+pendiente.nombre.toUpperCase()+'\n(Bs. '+pendiente.precio+')';
      else txtBanca+='\n\n¡Ya decoraste todas\nlas bancas!';
      partes.push(txtBanca);
    }
    if(partes.length===0){
      return 'Todavía no hablaste con\nningún guía.\n\nAcercate a un NPC rojo\ny presioná [ E ] para que\nte explique qué hacer.';
    }
    return partes.join('\n\n────────────\n\n');
  }

  // ── Panel "papel.txt": muestra los objetivos ya explicados por los
  // NPC rojos (guías). Reutiliza el mismo mecanismo de congelar el
  // juego (this._dialogo) que usan los diálogos y otros paneles, y
  // permite desplazarse (scroll) con la rueda del mouse o arrastrando
  // con el dedo, porque el texto puede llegar a ser bastante largo.
  _abrirPanelObjetivos(){
    var scene=this;
    if(this._pausado || this._dialogo) return;
    this._dialogo=true;
    var elems=[];

    var ov=this.add.rectangle(640,360,1280,720,0x000000,0.62).setScrollFactor(0).setDepth(300).setInteractive();
    elems.push(ov);

    var BW=560, BH=440, BX=640, BY=360;
    var g=this.add.graphics().setScrollFactor(0).setDepth(301);
    g.fillStyle(0x241A05,0.97); g.fillRoundedRect(BX-BW/2,BY-BH/2,BW,BH,16);
    g.lineStyle(3,0xFFD700,1);  g.strokeRoundedRect(BX-BW/2,BY-BH/2,BW,BH,16);
    g.lineStyle(1,0xFFD700,0.35); g.strokeRoundedRect(BX-BW/2+8,BY-BH/2+8,BW-16,BH-16,12);
    g.fillStyle(0xFFD700,1);
    [[BX-BW/2,BY-BH/2],[BX+BW/2,BY-BH/2],[BX-BW/2,BY+BH/2],[BX+BW/2,BY+BH/2]].forEach(function(p){ g.fillRect(p[0]-5,p[1]-5,10,10); });
    elems.push(g);

    var titulo=this.add.text(BX,BY-BH/2+30,'OBJETIVOS',{
      fontFamily:"'Press Start 2P'",fontSize:'15px',color:'#FFD700',stroke:'#000',strokeThickness:3
    }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
    elems.push(titulo);
    g.lineStyle(1,0x8A6A10,0.6); g.lineBetween(BX-BW/2+20,BY-BH/2+52,BX+BW/2-20,BY-BH/2+52);

    // ── Viewport con scroll (el texto puede ser muy largo)
    var vpX=BX-BW/2+26, vpY=BY-BH/2+64, vpW=BW-52, vpH=BH-64-70;
    var contenido=scene._construirTextoObjetivos();
    var cuerpo=this.add.text(vpX+vpW/2,vpY,contenido,{
      fontFamily:"'Press Start 2P'",fontSize:'8px',color:'#FFFFFF',stroke:'#000',strokeThickness:1,
      lineSpacing:8, align:'center', wordWrap:{width:vpW}
    }).setOrigin(0.5,0).setScrollFactor(0).setDepth(302);
    elems.push(cuerpo);

    var maskG=this.add.graphics().setScrollFactor(0).setVisible(false);
    maskG.fillStyle(0xffffff); maskG.fillRect(vpX,vpY,vpW,vpH);
    var mask=maskG.createGeometryMask();
    cuerpo.setMask(mask);
    elems.push(maskG);

    // Barrita indicadora de scroll (solo visible si hay más contenido
    // que el que entra en el viewport)
    var barraFondo=this.add.graphics().setScrollFactor(0).setDepth(302);
    var barraFill=this.add.graphics().setScrollFactor(0).setDepth(303);
    elems.push(barraFondo,barraFill);

    var scrollY=0;
    var actualizarScroll=function(){
      var maxScroll=Math.max(0,cuerpo.height-vpH);
      scrollY=Phaser.Math.Clamp(scrollY,0,maxScroll);
      cuerpo.y=vpY-scrollY;
      barraFondo.clear(); barraFill.clear();
      if(maxScroll>0){
        var bx=vpX+vpW+6, by=vpY, bw=4, bh=vpH;
        barraFondo.fillStyle(0x000000,0.4); barraFondo.fillRoundedRect(bx,by,bw,bh,2);
        var fillH=Math.max(20,vpH*(vpH/cuerpo.height));
        var fillY=by+(vpH-fillH)*(scrollY/maxScroll);
        barraFill.fillStyle(0xFFD700,0.9); barraFill.fillRoundedRect(bx,fillY,bw,fillH,2);
      }
    };
    actualizarScroll();

    var onWheel=function(pointer,go,dx,dy){
      scrollY+=dy*0.4;
      actualizarScroll();
    };
    this.input.on('wheel',onWheel);

    // Arrastre táctil dentro del viewport (para celular)
    var arrastrando=false, ultimoY=0;
    var zonaScroll=this.add.zone(vpX+vpW/2,vpY+vpH/2,vpW,vpH).setScrollFactor(0).setDepth(304).setInteractive();
    elems.push(zonaScroll);
    zonaScroll.on('pointerdown',function(p){ arrastrando=true; ultimoY=p.y; });
    var onPointerMove=function(p){
      if(!arrastrando) return;
      scrollY-=(p.y-ultimoY);
      ultimoY=p.y;
      actualizarScroll();
    };
    var onPointerUp=function(){ arrastrando=false; };
    this.input.on('pointermove',onPointerMove);
    this.input.on('pointerup',onPointerUp);

    // Botón CERRAR
    var BWc=220, BHc=48, BCX=BX, BCY=BY+BH/2-36;
    var gb=this.add.graphics().setScrollFactor(0).setDepth(302);
    gb.fillStyle(0x000000,0.4); gb.fillRoundedRect(BCX-BWc/2+4,BCY-BHc/2+5,BWc,BHc,10);
    gb.fillStyle(0x8A1E1E,1);   gb.fillRoundedRect(BCX-BWc/2,BCY-BHc/2,BWc,BHc,10);
    gb.fillStyle(0xFFFFFF,0.10); gb.fillRoundedRect(BCX-BWc/2,BCY-BHc/2,BWc,BHc*0.42,10);
    elems.push(gb);
    var lblBtn=this.add.text(BCX,BCY,'CERRAR',{
      fontFamily:"'Press Start 2P'",fontSize:'11px',color:'#FFFFFF',stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setScrollFactor(0).setDepth(303);
    elems.push(lblBtn);
    var zBtn=this.add.zone(BCX,BCY,BWc,BHc).setScrollFactor(0).setDepth(304).setInteractive({useHandCursor:true});
    elems.push(zBtn);
    zBtn.on('pointerover',function(){ gb.clear();
      gb.fillStyle(0x000000,0.4); gb.fillRoundedRect(BCX-BWc/2+4,BCY-BHc/2+5,BWc,BHc,10);
      gb.fillStyle(0xB03030,1);   gb.fillRoundedRect(BCX-BWc/2,BCY-BHc/2,BWc,BHc,10);
      gb.fillStyle(0xFFFFFF,0.16); gb.fillRoundedRect(BCX-BWc/2,BCY-BHc/2,BWc,BHc*0.42,10);
    });
    zBtn.on('pointerout',function(){ gb.clear();
      gb.fillStyle(0x000000,0.4); gb.fillRoundedRect(BCX-BWc/2+4,BCY-BHc/2+5,BWc,BHc,10);
      gb.fillStyle(0x8A1E1E,1);   gb.fillRoundedRect(BCX-BWc/2,BCY-BHc/2,BWc,BHc,10);
      gb.fillStyle(0xFFFFFF,0.10); gb.fillRoundedRect(BCX-BWc/2,BCY-BHc/2,BWc,BHc*0.42,10);
    });

    var cerrado=false;
    var cerrar=function(){
      if(cerrado) return;
      cerrado=true;
      scene.input.off('wheel',onWheel);
      scene.input.off('pointermove',onPointerMove);
      scene.input.off('pointerup',onPointerUp);
      elems.forEach(function(e){ try{e.destroy();}catch(err){} });
      scene._dialogo=false;
      scene._dialogoCerrar=null;
      scene._flushColaRecompensas();
    };
    zBtn.on('pointerdown',cerrar);
    // También se puede cerrar con la tecla/botón [ E ], igual que los
    // demás diálogos y paneles del juego.
    this._dialogoCerrar=cerrar;
  }

  // ── Panel "GUÍA DEL MAPA" (tecla/botón Q): un mini-mapa con la
  // ubicación de los 10 lotes, la Alcaldía y la Iglesia, para que el
  // jugador sepa por dónde arrancar a construir y en qué orden. Cada
  // lote se pinta de un color según su progreso (gris = sin empezar,
  // naranja = en construcción, verde = Nivel 3 terminado), y el Lote 1
  // se marca aparte como punto de partida recomendado.
  _abrirGuiaMapa(){
    var scene=this;
    if(this._pausado || this._dialogo) return;
    this._dialogo=true;
    this._guiaMapaAbierta=true;
    var elems=[];

    var ov=this.add.rectangle(640,360,1280,720,0x000000,0.62).setScrollFactor(0).setDepth(300).setInteractive();
    elems.push(ov);

    var BW=560, BH=620, BX=640, BY=360;
    var g=this.add.graphics().setScrollFactor(0).setDepth(301);
    g.fillStyle(0x0A1830,0.97); g.fillRoundedRect(BX-BW/2,BY-BH/2,BW,BH,16);
    g.lineStyle(3,0x4FC3F7,1);  g.strokeRoundedRect(BX-BW/2,BY-BH/2,BW,BH,16);
    g.lineStyle(1,0x4FC3F7,0.35); g.strokeRoundedRect(BX-BW/2+8,BY-BH/2+8,BW-16,BH-16,12);
    g.fillStyle(0x4FC3F7,1);
    [[BX-BW/2,BY-BH/2],[BX+BW/2,BY-BH/2],[BX-BW/2,BY+BH/2],[BX+BW/2,BY+BH/2]].forEach(function(p){ g.fillRect(p[0]-5,p[1]-5,10,10); });
    elems.push(g);

    var titulo=this.add.text(BX,BY-BH/2+30,'GUÍA DEL MAPA',{
      fontFamily:"'Press Start 2P'",fontSize:'15px',color:'#4FC3F7',stroke:'#000',strokeThickness:3
    }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
    elems.push(titulo);
    g.lineStyle(1,0x2A5A80,0.6); g.lineBetween(BX-BW/2+20,BY-BH/2+52,BX+BW/2-20,BY-BH/2+52);

    // ── Mini-mapa (rectángulo que representa toda la plaza, escalado)
    var mmSize=380, mmX=BX, mmY=BY-BH/2+64+mmSize/2;
    var mmLeft=mmX-mmSize/2, mmTop=mmY-mmSize/2;
    var escala=mmSize/MAP_W; // el mapa es cuadrado (MAP_W===MAP_H)
    var mm=this.add.graphics().setScrollFactor(0).setDepth(302);
    mm.fillStyle(0x2E5B1F,1); mm.fillRect(mmLeft,mmTop,mmSize,mmSize);
    mm.lineStyle(2,0xFFD700,0.8); mm.strokeRect(mmLeft,mmTop,mmSize,mmSize);
    elems.push(mm);

    function aMinimapa(x,y){ return {x:mmLeft+x*escala, y:mmTop+y*escala}; }

    var lotesInfo=[
      {n:1, obj:this._lote,   x:LOTE_X,   y:LOTE_Y},
      {n:2, obj:this._lote2,  x:LOTE2_X,  y:LOTE2_Y},
      {n:3, obj:this._lote3,  x:LOTE3_X,  y:LOTE3_Y},
      {n:4, obj:this._lote4,  x:LOTE4_X,  y:LOTE4_Y},
      {n:5, obj:this._lote5,  x:LOTE5_X,  y:LOTE5_Y},
      {n:6, obj:this._lote6,  x:LOTE6_X,  y:LOTE6_Y},
      {n:7, obj:this._lote7,  x:LOTE7_X,  y:LOTE7_Y},
      {n:8, obj:this._lote8,  x:LOTE8_X,  y:LOTE8_Y},
      {n:9, obj:this._lote9,  x:LOTE9_X,  y:LOTE9_Y},
      {n:10,obj:this._lote10, x:LOTE10_X, y:LOTE10_Y},
    ];
    var pm=this.add.graphics().setScrollFactor(0).setDepth(303);
    elems.push(pm);
    lotesInfo.forEach(function(L){
      var p=aMinimapa(L.x,L.y);
      var fase=(L.obj&&L.obj.fase)||0;
      var color = fase>=4 ? 0x2ECC40 : (fase>=1 ? 0xFFA500 : 0x9AA0A6);
      var radio = L.n===1 ? 12 : 9; // el Lote 1 se marca un poco más grande, es el punto de partida
      pm.fillStyle(0x000000,0.5); pm.fillCircle(p.x+1,p.y+2,radio);
      pm.fillStyle(color,1); pm.fillCircle(p.x,p.y,radio);
      pm.lineStyle(2,0xFFFFFF,0.9); pm.strokeCircle(p.x,p.y,radio);
      var numTxt=scene.add.text(p.x,p.y,''+L.n,{
        fontFamily:"'Press Start 2P'",fontSize:'8px',color:'#000000'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(304);
      elems.push(numTxt);
    });
    // Alcaldía e Iglesia, como referencia adicional en el mini-mapa
    var pAlc=aMinimapa(ALCALDIA_ZONA_X,ALCALDIA_ZONA_Y);
    pm.fillStyle(0x8A4FC3,1); pm.fillRect(pAlc.x-7,pAlc.y-7,14,14);
    pm.lineStyle(2,0xFFFFFF,0.9); pm.strokeRect(pAlc.x-7,pAlc.y-7,14,14);
    var pIgl=aMinimapa(IGLESIA_X,IGLESIA_Y);
    pm.fillStyle(0xE0C040,1); pm.fillRect(pIgl.x-7,pIgl.y-7,14,14);

  // ── Recalcula la velocidad real del personaje a partir del nivel de
  //    la habilidad "Velocidad" comprada en la Alcaldía (0 = sin bono).
  _aplicarBonoVelocidad(){
    var nivel=this.habilidadVelocidad||0;

  // Si quedó alguna recompensa esperando en la cola (porque llegó
  // mientras había otro panel abierto), la muestra ahora. Se llama
  // desde el cierre de CUALQUIER panel/diálogo del juego.
  _flushColaRecompensas(){
    if(this._colaRecompensas && this._colaRecompensas.length>0){
      var next=this._colaRecompensas.shift();
      this._mostrarRecompensa(next.monto,next.subtitulo);
