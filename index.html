  _mostrarDialogoNPC(npc){
    var scene=this;
    this._dialogo=true;
    // Panel de diálogo: más angosto y centrado, con el texto centrado
    // en vez de dejar un campo grande vacío a la derecha/abajo.
    var BW=640, BX=640;
    // Medimos el texto primero para calcular el alto del cuadro según
    // la cantidad de líneas del diálogo: algunos NPC (como el del
    // patujú) tienen textos más largos que otros, y con un alto fijo
    // el texto se salía tapando el título de arriba y el aviso de
    // abajo. Con el alto dinámico, el cuadro siempre crece lo
    // necesario para que quepa todo sin superponerse.
    var txt=this.add.text(BX,-2000,npc.dialogo,{
      fontFamily:"'Press Start 2P'",fontSize:'9px',color:'#FFFFFF',
      stroke:'#000',strokeThickness:2,lineSpacing:7,align:'center'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
    var BH=Math.max(150, txt.height+80);
    var BY=Phaser.Math.Clamp(675-BH/2, 200, 600);
    txt.setPosition(BX,BY);
    var ov=this.add.rectangle(BX,BY,BW,BH,0x050A1A,0.96).setScrollFactor(0).setDepth(300);
    var gd=this.add.graphics().setScrollFactor(0).setDepth(301);
    gd.lineStyle(3,0xFFD700,1); gd.strokeRect(BX-BW/2,BY-BH/2,BW,BH);
    gd.lineStyle(1,0x3A5FD0,1); gd.strokeRect(BX-BW/2+6,BY-BH/2+6,BW-12,BH-12);
    // Píxeles decorativos en las esquinas superiores
    gd.fillStyle(0xFFD700);
    gd.fillRect(BX-BW/2+10,BY-BH/2+8,8,8); gd.fillRect(BX+BW/2-18,BY-BH/2+8,8,8);
    var nom=this.add.text(BX,BY-BH/2+22,(npc.especial==='bancas'||npc.especial==='farol'||npc.especial==='arbol'||npc.especial==='patuju')?'GUÍA DE LA PLAZA':'CIUDADANO',{
      fontFamily:"'Press Start 2P'",fontSize:'8px',color:'#FFD700',stroke:'#000',strokeThickness:1
    }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
    var hint=this.add.text(BX,BY+BH/2-18,'[ Presiona E para cerrar ]',{
      fontFamily:"'Press Start 2P'",fontSize:'7px',color:'#888888'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
    // Parpadeo del hint
    this.tweens.add({targets:hint,alpha:0.2,yoyo:true,repeat:-1,duration:500});
    var cerrar=function(){
      scene._dialogo=false;
      ov.destroy(); gd.destroy(); nom.destroy(); txt.destroy(); hint.destroy();
      scene.tweens.killTweensOf(hint);
      scene._dialogoCerrar=null;
      // El NPC que pide decorar las bancas desaparece para siempre en
      // cuanto el jugador terminó de leer su diálogo una vez.
      if(npc.especial==='bancas'){
        scene._npcBancasVisto=true;
        try{npc.img.destroy();}catch(e){}
        try{npc.shadow.destroy();}catch(e){}
        try{npc.label.destroy();}catch(e){}
        var idx=scene._npcs.indexOf(npc);
        if(idx>=0) scene._npcs.splice(idx,1);
        scene._actualizarObjetivoHUD();
      }
      // El NPC rojo que explica cómo comprar el lote 1 también
      // desaparece para siempre en cuanto se lee su diálogo una vez.
      if(npc.especial==='lote1'){
        scene._npcLote1Visto=true;
        try{npc.img.destroy();}catch(e){}
        try{npc.shadow.destroy();}catch(e){}
        try{npc.label.destroy();}catch(e){}
        var idx2=scene._npcs.indexOf(npc);
        if(idx2>=0) scene._npcs.splice(idx2,1);
      }
      // El NPC rojo que explica cómo decorar la calle con faroles
      // también desaparece para siempre en cuanto se lee su diálogo.
      if(npc.especial==='farol'){
        scene._npcFarolVisto=true;
        try{npc.img.destroy();}catch(e){}
        try{npc.shadow.destroy();}catch(e){}
        try{npc.label.destroy();}catch(e){}
        var idx3=scene._npcs.indexOf(npc);
        if(idx3>=0) scene._npcs.splice(idx3,1);
      }
      // El NPC rojo que explica cómo plantar árboles toborochi en las
      // esquinas del mapa también desaparece para siempre en cuanto se
      // lee su diálogo una vez.
      if(npc.especial==='arbol'){
        scene._npcArbolVisto=true;
        try{npc.img.destroy();}catch(e){}
        try{npc.shadow.destroy();}catch(e){}
        try{npc.label.destroy();}catch(e){}
        var idx4=scene._npcs.indexOf(npc);
        if(idx4>=0) scene._npcs.splice(idx4,1);
      }
      // El NPC rojo que explica qué es el patujú y pide plantar las 3
      // unidades también desaparece para siempre en cuanto se lee su
      // diálogo una vez.
      if(npc.especial==='patuju'){
        scene._npcPatujuVisto=true;
        try{npc.img.destroy();}catch(e){}
        try{npc.shadow.destroy();}catch(e){}
        try{npc.label.destroy();}catch(e){}
        var idx5=scene._npcs.indexOf(npc);
        if(idx5>=0) scene._npcs.splice(idx5,1);
      }
      scene._flushColaRecompensas();
    };
    // Se cierra SOLO con la tecla E (PC) o el botón E táctil (celular),
    // nunca con un clic/toque en cualquier parte de la pantalla.
    // El cierre se dispara desde _accionE(), llamado tanto por el
    // listener global de teclado como por el botón táctil.
    this._dialogoCerrar=cerrar;
  }

  update(t,delta){
    this._t=t;
    var dt=delta/1000, dx=0, dy=0, K=this.keys;
    if(K.A.isDown||K.LEFT.isDown)  dx=-1;
    if(K.D.isDown||K.RIGHT.isDown) dx= 1;
    if(K.W.isDown||K.UP.isDown)    dy=-1;
    if(K.S.isDown||K.DOWN.isDown)  dy= 1;
    // Joystick táctil analógico (ya viene normalizado -1..1, con diagonales reales)
    var usandoJoystick=false;
    if(this._joyDX || this._joyDY){
      dx=this._joyDX; dy=this._joyDY; usandoJoystick=true;
    }
    var mov=(dx!==0||dy!==0);

    // ── Tutorial: en cuanto el jugador intenta moverse por primera vez
    // (teclado o joystick), se cierra el tutorial y el personaje queda
    // libre para jugar normalmente.
    if(this._tutorialActivo){
      if(mov) this._cerrarTutorial();
    }

    if(mov && !this._dialogo && !this._tutorialActivo){
      // La corrección de velocidad diagonal solo aplica al teclado/D-pad
      // digital; el joystick analógico ya trae la magnitud correcta.
      if(!usandoJoystick && dx!==0 && dy!==0){ dx*=0.707; dy*=0.707; }
      var nextPx=Phaser.Math.Clamp(this.px+dx*this.SPEED*dt,60,MAP_W-60);
      var nextPy=Phaser.Math.Clamp(this.py+dy*this.SPEED*dt,60,MAP_H-60);
      // ── Colisión con el mercado ya construido: se mueve eje por eje
      // para poder "deslizarse" por el borde del edificio en vez de
      // quedar trabado, y para que nunca lo atraviese caminando.
      if(!this._colisionaConMercado(nextPx,this.py) && !this._colisionaConMercado2(nextPx,this.py) && !this._colisionaConMercado3(nextPx,this.py) && !this._colisionaConMercado4(nextPx,this.py) && !this._colisionaConMercado5(nextPx,this.py) && !this._colisionaConMercado6(nextPx,this.py) && !this._colisionaConMercado7(nextPx,this.py) && !this._colisionaConMercado8(nextPx,this.py) && !this._colisionaConMercado9(nextPx,this.py) && !this._colisionaConMercado10(nextPx,this.py) && !this._colisionaConAlcaldia(nextPx,this.py)) this.px=nextPx;
      if(!this._colisionaConMercado(this.px,nextPy) && !this._colisionaConMercado2(this.px,nextPy) && !this._colisionaConMercado3(this.px,nextPy) && !this._colisionaConMercado4(this.px,nextPy) && !this._colisionaConMercado5(this.px,nextPy) && !this._colisionaConMercado6(this.px,nextPy) && !this._colisionaConMercado7(this.px,nextPy) && !this._colisionaConMercado8(this.px,nextPy) && !this._colisionaConMercado9(this.px,nextPy) && !this._colisionaConMercado10(this.px,nextPy) && !this._colisionaConAlcaldia(this.px,nextPy)) this.py=nextPy;

      // ── Sprites direccionales (8 direcciones)
      var tex='char_front';
      var EPS=0.15;
      var mx = dx>EPS?1:(dx<-EPS?-1:0);
      var my = dy>EPS?1:(dy<-EPS?-1:0);
      if     (my<0&&mx===0)  tex='char_back';
      else if(my>0&&mx===0)  tex='char_front';
      else if(my<0&&mx>0)    tex='char_diag_ur';
      else if(my<0&&mx<0)    tex='char_diag_ul';
      else if(my>0&&mx>0)    tex='char_diag_dr';   // diagonal abajo-derecha
      else if(my>0&&mx<0)    tex='char_diag_dl';   // diagonal abajo-izquierda
      else if(mx>0)          tex='char_right';
      else if(mx<0)          tex='char_left';
      this._lastTex=tex;
      this.jugador.setTexture(tex);
    }

    var bob=mov?Math.sin(t*0.014)*3.5:0;
    this.jugador.setPosition(this.px,this.py+bob);
    this.sombra.setPosition(this.px,this.py+14);

    // ── Orden de profundidad frente al mercado: si el jugador está
    // parado delante (al sur) del edificio debe dibujarse ENCIMA de él;
    // si está detrás (al norte) debe quedar DEBAJO. Así nunca "flota"
    // sobre la fachada cuando pasa por delante.
    // FIX: antes cada bloque pisaba ciegamente el depth que dejó el
    // bloque anterior, sin comprobar si el jugador estaba siquiera
    // cerca de ESE lote. Resultado: en cuanto había más de un lote
    // construido, el de número más alto en la lista terminaba
    // mandando en TODO el mapa (aunque el jugador estuviera parado
    // frente a otro lote), haciendo que el personaje se viera "metido"
    // dentro de estructuras. Ahora cada lote solo aplica su regla de
    // profundidad si el jugador está dentro de su franja horizontal;
    // si no está cerca de ningún lote construido, se usa el depth
    // normal (por delante de todo).
    var depthAplicado=false;
    if(this._aplicarDepthLote(this._lote,  LOTE_X,  LOTE_Y,  MERCADO_COL_ANCHO,  MERCADO_COL_ALTO))  depthAplicado=true;
    if(this._aplicarDepthLote(this._lote2, LOTE2_X, LOTE2_Y, MERCADO2_COL_ANCHO, MERCADO2_COL_ALTO)) depthAplicado=true;
    if(this._aplicarDepthLote(this._lote3, LOTE3_X, LOTE3_Y, MERCADO3_COL_ANCHO, MERCADO3_COL_ALTO)) depthAplicado=true;
    if(this._aplicarDepthLote(this._lote4, LOTE4_X, LOTE4_Y, MERCADO4_COL_ANCHO, MERCADO4_COL_ALTO)) depthAplicado=true;
    if(this._aplicarDepthLote(this._lote5, LOTE5_X, LOTE5_Y, MERCADO5_COL_ANCHO, MERCADO5_COL_ALTO)) depthAplicado=true;
    if(this._aplicarDepthLote(this._lote6, LOTE6_X, LOTE6_Y, MERCADO6_COL_ANCHO, MERCADO6_COL_ALTO)) depthAplicado=true;
    if(this._aplicarDepthLote(this._lote7, LOTE7_X, LOTE7_Y, MERCADO7_COL_ANCHO, MERCADO7_COL_ALTO)) depthAplicado=true;
    if(this._aplicarDepthLote(this._lote8, LOTE8_X, LOTE8_Y, MERCADO8_COL_ANCHO, MERCADO8_COL_ALTO)) depthAplicado=true;
    if(this._aplicarDepthLote(this._lote9, LOTE9_X, LOTE9_Y, MERCADO9_COL_ANCHO, MERCADO9_COL_ALTO)) depthAplicado=true;
    if(this._aplicarDepthLote(this._lote10,LOTE10_X,LOTE10_Y,MERCADO10_COL_ANCHO,MERCADO10_COL_ALTO)) depthAplicado=true;
    if(!depthAplicado){ this.jugador.setDepth(50); this.sombra.setDepth(49); }

    // ── Recoger monedas
    for(var i=this.monedas.length-1;i>=0;i--){
      var m=this.monedas[i];
      if(Phaser.Math.Distance.Between(this.px,this.py,m.x,m.y)<48){
        this.dinero+=m.val;
        this.hudDinero.setText('Bs. '+this.dinero);
        m.g.destroy(); m.txt.destroy();
        this.monedas.splice(i,1);
        this.cameras.main.flash(120,255,210,0,true);
        this._recogerMonedaParaProtesta();
      }
    }

    // ── Zonas de decoración con bancas: si el jugador está parado
    // encima de una zona sin comprar, el dinero se va descontando solo,
    // poco a poco, hasta juntar el precio total (estilo tycoon).
    if(!this._pausado && !this._dialogo && !this._tutorialActivo){
      for(var zi=0;zi<this.zonasBanca.length;zi++){
        var zb=this.zonasBanca[zi];
        if(zb.comprada || zb.bloqueada) continue;
        var dz=Phaser.Math.Distance.Between(this.px,this.py,zb.x,zb.y);
        if(dz<70){
          zb._acumulador+=VELOCIDAD_COMPRA_BANCA*dt;
          var enteros=Math.floor(zb._acumulador);
          if(enteros>0){
            var faltante=zb.precio-zb.gastado;
            var aCobrar=Math.min(enteros,faltante,this.dinero);
            zb._acumulador-=enteros;
            if(aCobrar>0){
              zb.gastado+=aCobrar;
              this.dinero-=aCobrar;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoZona(zb);
            if(zb.gastado>=zb.precio){
              zb.gastado=zb.precio; zb.comprada=true;
              this._instalarBanca(zb);
              this._notificarBancaLista(zb);
              var siguiente=this.zonasBanca[zi+1];
              if(siguiente && siguiente.bloqueada) this._desbloquearZonaBanca(siguiente);
            }
          }
        }
      }
      // ── Zonas de decoración con faroles: misma lógica de cobro
      // automático parado encima, en cadena (Farol 1 → 2 → ... → 8).
      for(var fi=0;fi<this.zonasFarol.length;fi++){
        var zf=this.zonasFarol[fi];
        if(zf.comprada || zf.bloqueada) continue;
        var df=Phaser.Math.Distance.Between(this.px,this.py,zf.x,zf.y);
        if(df<70){
          zf._acumulador+=VELOCIDAD_COMPRA_FAROL*dt;
          var enterosF=Math.floor(zf._acumulador);
          if(enterosF>0){
            var faltanteF=zf.precio-zf.gastado;
            var aCobrarF=Math.min(enterosF,faltanteF,this.dinero);
            zf._acumulador-=enterosF;
            if(aCobrarF>0){
              zf.gastado+=aCobrarF;
              this.dinero-=aCobrarF;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoZona(zf);
            if(zf.gastado>=zf.precio){
              zf.gastado=zf.precio; zf.comprada=true;
              this._instalarFarol(zf);
              this._notificarFarolListo(zf);
              var siguienteF=this.zonasFarol[fi+1];
              if(siguienteF && siguienteF.bloqueada) this._desbloquearZonaBanca(siguienteF);
            }
          }
        }
      }
      // ── Zonas de decoración con árboles toborochi: misma lógica de
      // cobro automático parado encima, en cadena por las 4 esquinas
      // del mapa (Árbol 1 → 2 → 3 → 4).
      for(var ai=0;ai<this.zonasArbol.length;ai++){
        var za=this.zonasArbol[ai];
        if(za.comprada || za.bloqueada) continue;
        var da=Phaser.Math.Distance.Between(this.px,this.py,za.x,za.y);
        if(da<70){
          za._acumulador+=VELOCIDAD_COMPRA_ARBOL*dt;
          var enterosA=Math.floor(za._acumulador);
          if(enterosA>0){
            var faltanteA=za.precio-za.gastado;
            var aCobrarA=Math.min(enterosA,faltanteA,this.dinero);
            za._acumulador-=enterosA;
            if(aCobrarA>0){
              za.gastado+=aCobrarA;
              this.dinero-=aCobrarA;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoZona(za);
            if(za.gastado>=za.precio){
              za.gastado=za.precio; za.comprada=true;
              this._instalarArbol(za);
              this._notificarArbolListo(za);
              var siguienteA=this.zonasArbol[ai+1];
              if(siguienteA && siguienteA.bloqueada) this._desbloquearZonaBanca(siguienteA);
            }
          }
        }
      }
      // ── Patujúes: mismo cobro automático parado encima, ahora EN
      // CADENA como las bancas/faroles/árboles (Patujú 1 → 2 → 3).
      for(var pi=0;pi<this.zonasPatuju.length;pi++){
        var zp=this.zonasPatuju[pi];
        if(zp.comprada || zp.bloqueada) continue;
        var dp=Phaser.Math.Distance.Between(this.px,this.py,zp.x,zp.y);
        if(dp<70){
          zp._acumulador+=VELOCIDAD_COMPRA_PATUJU*dt;
          var enterosP=Math.floor(zp._acumulador);
          if(enterosP>0){
            var faltanteP=zp.precio-zp.gastado;
            var aCobrarP=Math.min(enterosP,faltanteP,this.dinero);
            zp._acumulador-=enterosP;
            if(aCobrarP>0){
              zp.gastado+=aCobrarP;
              this.dinero-=aCobrarP;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoZona(zp);
            if(zp.gastado>=zp.precio){
              zp.gastado=zp.precio; zp.comprada=true;
              this._instalarPatuju(zp);
              this._notificarPatujuListo(zp);
              var siguienteP=this.zonasPatuju[pi+1];
              if(siguienteP && siguienteP.bloqueada) this._desbloquearZonaBanca(siguienteP);
            }
          }
        }
      }
    }

    // ── Sistema de Rebeldía / Protesta: descuento por segundo + chequeo de monedas
    this._actualizarProtesta(delta);

    // ── Sistema de Ladrón: recorre el mapa robando el dinero acumulado de los lotes
    this._actualizarLadron(delta);

    // ── Sistema de lote: ingreso pasivo + compra por zona
    this._actualizarSistemaLote(delta);
    // ── Sistema del segundo lote: ingreso pasivo + compra por zona
    this._actualizarSistemaLote2(delta);
    // ── Sistema del tercer lote: ingreso pasivo + compra por zona
    this._actualizarSistemaLote3(delta);
    // ── Sistema del cuarto lote: ingreso pasivo + compra por zona
    this._actualizarSistemaLote4(delta);
    // ── Sistema del quinto lote: ingreso pasivo + compra por zona
    this._actualizarSistemaLote5(delta);
    // ── Sistema del sexto lote: ingreso pasivo + compra por zona
    this._actualizarSistemaLote6(delta);
    // ── Sistema del séptimo lote: ingreso pasivo + compra por zona
    this._actualizarSistemaLote7(delta);
    // ── Sistema del octavo lote: ingreso pasivo + compra por zona
    this._actualizarSistemaLote8(delta);
    // ── Sistema del noveno lote: ingreso pasivo + compra por zona
    this._actualizarSistemaLote9(delta);
    // ── Sistema del décimo lote: ingreso pasivo + compra por zona
    this._actualizarSistemaLote10(delta);
    // ── Alcaldía: candado / zona de desbloqueo / etiqueta de mejoras
    this._actualizarAlcaldia(delta);
    this._actualizarIglesia(delta);

    // ── NPCs proximidad (resalta la etiqueta [E]; la apertura del
    // diálogo la maneja _accionE(), llamada desde el listener de
    // teclado global y desde el botón táctil)
    for(var j=0;j<this._npcs.length;j++){
      var npc=this._npcs[j];
      var dist=Phaser.Math.Distance.Between(this.px,this.py,npc.x,npc.y);
      if(dist<110){
        if(!npc.near){ npc.near=true; this.tweens.add({targets:npc.label,alpha:1,duration:200}); }
      } else {
        if(npc.near){ npc.near=false; this.tweens.add({targets:npc.label,alpha:0,duration:200}); }
      }
    }
  }

  // ══════════════════════════════════════════════════
  //  PANEL DE RECOMPENSA (mismo estilo visual que PAUSA:
  //  caja azul, borde celeste, esquinas doradas, botón CONTINUAR)
  // ══════════════════════════════════════════════════
  _mostrarRecompensa(monto,subtitulo){
    var scene=this;
    // FIX: si ya hay un panel abierto (otra recompensa, un diálogo, el
    // aviso de protesta, etc.), NO se abre uno encima — se encola y se
    // muestra automáticamente apenas se cierre el que está abierto. Ver
    // nota completa en create() donde se inicializa _colaRecompensas.
    if(this._dialogo){
      this._colaRecompensas.push({monto:monto,subtitulo:subtitulo});
      return;
    }
    this._dialogo=true; // congela movimiento y sistemas mientras el panel está abierto
    var elems=[];

    // Overlay semi-transparente (fijo a la cámara)
    var ov=scene.add.rectangle(640,360,1280,720,0x000000,0.62).setScrollFactor(0).setDepth(300);
    elems.push(ov);

    // Panel pixel-art centrado (idéntico al de PAUSA)
    var g=scene.add.graphics().setScrollFactor(0).setDepth(301);
    g.fillStyle(0x03015E,0.97); g.fillRoundedRect(390,210,500,300,16);
    g.lineStyle(3,0x3A70D0,1);  g.strokeRoundedRect(390,210,500,300,16);
    g.lineStyle(1,0xFFD700,0.35); g.strokeRoundedRect(398,218,484,284,12);
    g.fillStyle(0xFFD700,1);
    [[390,210],[890,210],[390,510],[890,510]].forEach(function(p){ g.fillRect(p[0],p[1],10,10); });
    elems.push(g);

    // Título RECOMPENSA
    var titulo=scene.add.text(640,255,'RECOMPENSA',{
      fontFamily:"'Press Start 2P'",fontSize:'20px',color:'#FFD700',
      stroke:'#000000',strokeThickness:4
    }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
    elems.push(titulo);

    // Línea decorativa bajo el título
    g.lineStyle(1,0x3A5FD0,0.5); g.lineBetween(410,285,870,285);

    // Subtítulo (motivo de la recompensa)
    var sub=scene.add.text(640,325,subtitulo,{
      fontFamily:"'Press Start 2P'",fontSize:'9px',color:'#FFFFFF',
      stroke:'#000000',strokeThickness:2,align:'center',wordWrap:{width:440}
    }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
    elems.push(sub);

    // Monto ganado
    var monttxt=scene.add.text(640,385,'+Bs. '+monto,{
      fontFamily:"'Press Start 2P'",fontSize:'22px',color:'#66FF66',
      stroke:'#000000',strokeThickness:4
    }).setOrigin(0.5).setScrollFactor(0).setDepth(302);
    elems.push(monttxt);
    scene.tweens.add({targets:monttxt,scaleX:1.12,scaleY:1.12,duration:420,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});

    // Botón CONTINUAR (verde, igual estilo que el de PAUSA)
    var BW=360, BH=62, BCX=640, BCY=460;
    var gb=scene.add.graphics().setScrollFactor(0).setDepth(302);
    gb.fillStyle(0x000000,0.4); gb.fillRoundedRect(BCX-BW/2+4,BCY-BH/2+5,BW,BH,10);
    gb.fillStyle(0x1D8C38,1);   gb.fillRoundedRect(BCX-BW/2,BCY-BH/2,BW,BH,10);
    gb.fillStyle(0xFFFFFF,0.10); gb.fillRoundedRect(BCX-BW/2,BCY-BH/2,BW,BH*0.42,10);
    elems.push(gb);
    var lblBtn=scene.add.text(BCX,BCY,'CONTINUAR',{
      fontFamily:"'Press Start 2P'",fontSize:'12px',color:'#FFFFFF',
      stroke:'#000000',strokeThickness:2
    }).setOrigin(0.5).setScrollFactor(0).setDepth(303);
    elems.push(lblBtn);
    var zBtn=scene.add.zone(BCX,BCY,BW,BH).setScrollFactor(0).setDepth(304).setInteractive({useHandCursor:true});
    elems.push(zBtn);

    var cerrado=false;
    var cerrar=function(){
      if(cerrado) return;
      cerrado=true;
      scene.dinero+=monto;
      scene.hudDinero.setText('Bs. '+scene.dinero);
      AudioMgr.playFX(scene);
      elems.forEach(function(e){ try{e.destroy();}catch(err){} });
      scene._dialogo=false;
      scene._flushColaRecompensas();
    };
    zBtn.on('pointerover',function(){
      gb.clear();
      gb.fillStyle(0x000000,0.4); gb.fillRoundedRect(BCX-BW/2+4,BCY-BH/2+5,BW,BH,10);
      gb.fillStyle(0x27AE48,1);   gb.fillRoundedRect(BCX-BW/2,BCY-BH/2,BW,BH,10);
      gb.fillStyle(0xFFFFFF,0.16); gb.fillRoundedRect(BCX-BW/2,BCY-BH/2,BW,BH*0.42,10);
    });
    zBtn.on('pointerdown',cerrar);
  }

  // true si el punto (px,py) cae dentro del rectángulo del mercado ya
  // construido (fase>=2). Se usa para bloquear el paso del jugador.
  _colisionaConMercado(px,py){
    var lote=this._lote;
    if(!lote||lote.fase<2) return false;
    var halfW=MERCADO_COL_ANCHO/2, halfH=MERCADO_COL_ALTO/2;
    var cx=LOTE_X, cy=LOTE_Y-16;
    return (px>cx-halfW && px<cx+halfW && py>cy-halfH && py<cy+halfH);
  }

  _colisionaConMercado10(px,py){
    var lote=this._lote10;
    if(!lote||lote.fase<2) return false;
    var halfW=MERCADO10_COL_ANCHO/2, halfH=MERCADO10_COL_ALTO/2;
    var cx=LOTE10_X, cy=LOTE10_Y-16;
    return (px>cx-halfW && px<cx+halfW && py>cy-halfH && py<cy+halfH);
  }

  // FIX (bug de profundidad/z-order): calcula y aplica el depth del
  // jugador SOLO si está dentro de la franja horizontal del lote dado
  // (ya construido). Devuelve true si aplicó el cambio, false si el
  // jugador no está cerca de este lote (para no pisar el depth de
  // otro lote donde sí esté parado). Antes, este chequeo horizontal
  // no existía y el último lote construido de la lista decidía el
  // depth para todo el mapa.
  _aplicarDepthLote(loteObj, loteX, loteY, colAncho, colAlto){
    if(!loteObj || loteObj.fase<2) return false;
    var halfW=colAncho/2;
    if(this.px < loteX-halfW || this.px > loteX+halfW) return false;
    var frenteY=(loteY-16)+colAlto/2;
    var d=(this.py>=frenteY)?50:44;
    this.jugador.setDepth(d);
    this.sombra.setDepth(d-1);
    return true;
  }

  // Inicializa el objeto _lote y restaura el estado guardado
  _crearSistemaLote(){
    var sv=this._loteSave||null;
    this._lote={
      fase:               sv?sv.fase:0,
      gastadoTerreno:     sv?sv.gastadoTerreno:0,
      gastadoEstructura:  sv?sv.gastadoEstructura:0,
      gastadoNivel2:      sv?(sv.gastadoNivel2||0):0,
      gastadoNivel3:      sv?(sv.gastadoNivel3||0):0,
      acumuladoDinero:    sv?(sv.acumuladoDinero||0):0,
      _acum:0, _acumN2:0, _acumN3:0, _ingresoTimer:0,
      circulo:null, textoFase:null, textoPrecio:null,
      barraFondo:null, barraFill:null,
      circuloN2:null, textoFaseN2:null, textoPrecioN2:null,
      barraFondoN2:null, barraFillN2:null,
      circuloN3:null, textoFaseN3:null, textoPrecioN3:null,
      barraFondoN3:null, barraFillN3:null,
      imgTerreno:null, imgEstructura:null, lblNivel:null,
      recogidaPad:null, monedaImg:null, textoAcumulado:null
    };
    this._monedasLote=[];  // Fallback para monedas (ahora no se usa)
    // Restaurar visual (sin animación) si había partida guardada
    if(this._lote.fase===1) this._restaurarTerreno(false);
    if(this._lote.fase>=2) this._restaurarEstructura(false);
    if(this._lote.fase< 2) this._dibujarZonaLote();
  }

  // Dibuja el círculo de compra (celeste = terreno, naranja = estructura) en la calle
  _dibujarZonaLote(){
    var scene=this, lote=this._lote;
    var x=LOTE_BOTON_X, y=LOTE_BOTON_Y;
    ['circulo','textoFase','textoPrecio','barraFondo','barraFill'].forEach(function(k){
      if(lote[k]){ try{lote[k].destroy();}catch(e){} lote[k]=null; }
    });
    var esTerreno=(lote.fase===0);
    var color=esTerreno?0x00DDFF:0xFF9900;
    var g=this.add.graphics().setDepth(50);
    g.lineStyle(3,color,0.9);  g.strokeCircle(x,y,32);
    g.fillStyle(color,0.13);   g.fillCircle(x,y,32);
    lote.circulo=g;
    var lbl=esTerreno?'COMPRAR\nLOTE':'CONSTRUIR\nMERCADO';
    lote.textoFase=this.add.text(x,y-46,lbl,{
      fontFamily:"'Press Start 2P'",fontSize:'7px',
      color:esTerreno?'#00DDFF':'#FF9900',
      stroke:'#000',strokeThickness:2,align:'center'
    }).setOrigin(0.5).setDepth(51);
    var precio=esTerreno?PRECIO_LOTE_TERRENO:PRECIO_LOTE_ESTRUCTURA;
    lote.textoPrecio=this.add.text(x,y+4,'Bs. '+precio,{
      fontFamily:"'Press Start 2P'",fontSize:'9px',
      color:'#FFFFFF',stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(51);
    lote.barraFondo=this.add.graphics().setDepth(51).setVisible(false);
    lote.barraFill =this.add.graphics().setDepth(52);
  }

  // Redibuja la barra de progreso y el texto del costo del lote en la calle
  _dibujarProgresoLote(){
    var lote=this._lote;
    if(!lote||!lote.barraFill) return;
    var bw=60, bh=8, x=LOTE_BOTON_X, y=LOTE_BOTON_Y;
    var esTerreno=(lote.fase===0);
    var precio  =esTerreno?PRECIO_LOTE_TERRENO:PRECIO_LOTE_ESTRUCTURA;
    var gastado =esTerreno?lote.gastadoTerreno:lote.gastadoEstructura;
    lote.barraFill.clear();
    if(gastado<=0){ lote.barraFondo.setVisible(false); return; }
    lote.barraFondo.clear().setVisible(true);
    lote.barraFondo.fillStyle(0x000000,0.6);
    lote.barraFondo.fillRoundedRect(x-bw/2,y+16,bw,bh,2);
    var pct=Phaser.Math.Clamp(gastado/precio,0,1);
    lote.barraFill.fillStyle(0x00FFAA,1);
    lote.barraFill.fillRoundedRect(x-bw/2+2,y+18,(bw-4)*pct,bh-4,2);
    lote.textoPrecio.setText('Bs.'+Math.floor(gastado)+' / '+precio);
  }

  // Dibuja el cuadrado ROJO en la calle para subir el mercado a Nivel 2
  _dibujarZonaNivel2(){
    var scene=this, lote=this._lote;
    var x=NIVEL2_ZONA_X, y=NIVEL2_ZONA_Y;

    });
    var g=this.add.graphics().setDepth(50);

    g.fillStyle(0xFF2222,0.16);  g.fillRect(x-24,y-24,48,48);
    lote.circuloN2=g;
    lote.textoFaseN2=this.add.text(x,y-46,'SUBIR A\nNIVEL 2',{
      fontFamily:"'Press Start 2P'",fontSize:'7px',
      color:'#FF3333',stroke:'#000',strokeThickness:2,align:'center'
    }).setOrigin(0.5).setDepth(51);
    lote.textoPrecioN2=this.add.text(x,y+4,'Bs. '+PRECIO_NIVEL2,{
      fontFamily:"'Press Start 2P'",fontSize:'9px',
      color:'#FFFFFF',stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(51);
    lote.barraFondoN2=this.add.graphics().setDepth(51).setVisible(false);

  // Redibuja la barra de progreso del cuadrado rojo (Nivel 2)

  // Llamado cada frame: maneja el descuento de dinero y la generación de ingresos
  _actualizarSistemaLote(delta){
    var lote=this._lote;
    if(!lote) return;
    var dt=delta/1000;

    // Ingreso pasivo: acumula dinero en el pad de recogida cada LOTE_INGRESO_MS
    if(lote.fase>=2){
      var ingresoActual = LOTE_INGRESO_BS;
      if(lote.fase>=4) ingresoActual = LOTE_INGRESO_BS_N3;
      else if(lote.fase>=3) ingresoActual = LOTE_INGRESO_BS_N2;
      lote._ingresoTimer+=delta;
      if(lote._ingresoTimer>=LOTE_INGRESO_MS){
        lote._ingresoTimer-=LOTE_INGRESO_MS;
        lote.acumuladoDinero = (lote.acumuladoDinero || 0) + ingresoActual;
        this._actualizarVisualRecogida();
      }
      // Recolectar dinero si el jugador está sobre el pad de recogida
      if((lote.acumuladoDinero || 0) > 0){
        var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE_BOTON_X,LOTE_BOTON_Y);
        if(dist<36){
          var recolectado=lote.acumuladoDinero;
          lote.acumuladoDinero=0;
          this._actualizarVisualRecogida();
          this.dinero+=recolectado;
          this.hudDinero.setText('Bs. '+this.dinero);
          AudioMgr.playRecogerDinero(this);

          // Mostrar texto flotante encima de la recogida
          var av=this.add.text(LOTE_BOTON_X,LOTE_BOTON_Y-30,'+Bs. '+recolectado,{
            fontFamily:"'Press Start 2P'",fontSize:'9px',
            color:'#66FF66',stroke:'#000000',strokeThickness:2
          }).setOrigin(0.5).setDepth(60);
          this.tweens.add({
            targets:av,y:LOTE_BOTON_Y-70,alpha:0,duration:1200,
            onComplete:function(){ av.destroy(); }
          });
        }
      }

      // ── Fase 2 (Nivel 1 construido): permite subir a Nivel 2 parándose
      // sobre el cuadrado ROJO, descontando dinero poco a poco.
      if(lote.fase===2 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN2=Phaser.Math.Distance.Between(this.px,this.py,NIVEL2_ZONA_X,NIVEL2_ZONA_Y);
        if(distN2<70){
          lote._acumN2 += VELOCIDAD_COMPRA_NIVEL2*dt;
          var enterosN2=Math.floor(lote._acumN2);
          if(enterosN2>0){
            lote._acumN2-=enterosN2;
            var faltanteN2=PRECIO_NIVEL2-(lote.gastadoNivel2||0);
            var aCobrarN2=Math.min(enterosN2,faltanteN2,this.dinero);
            if(aCobrarN2>0){
              lote.gastadoNivel2=(lote.gastadoNivel2||0)+aCobrarN2;
              this.dinero-=aCobrarN2;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel2();
            if(lote.gastadoNivel2>=PRECIO_NIVEL2){
              lote.gastadoNivel2=PRECIO_NIVEL2;
              lote.fase=3;
              this._subirANivel2();
            }
          }
        }
      }

      // ── Fase 3 (Nivel 2 construido): permite subir a Nivel 3 parándose
      // sobre el cuadrado MORADO, descontando dinero poco a poco.
      if(lote.fase===3 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN3=Phaser.Math.Distance.Between(this.px,this.py,NIVEL3_ZONA_X,NIVEL3_ZONA_Y);
        if(distN3<70){
          lote._acumN3 += VELOCIDAD_COMPRA_NIVEL3*dt;
          var enterosN3=Math.floor(lote._acumN3);
          if(enterosN3>0){
            lote._acumN3-=enterosN3;
            var faltanteN3=PRECIO_NIVEL3-(lote.gastadoNivel3||0);
            var aCobrarN3=Math.min(enterosN3,faltanteN3,this.dinero);
            if(aCobrarN3>0){
              lote.gastadoNivel3=(lote.gastadoNivel3||0)+aCobrarN3;
              this.dinero-=aCobrarN3;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel3();
            if(lote.gastadoNivel3>=PRECIO_NIVEL3){
              lote.gastadoNivel3=PRECIO_NIVEL3;
              lote.fase=4;
              this._subirANivel3();
            }
          }
        }
      }
      return;
    }

    // Fase 0 o 1: descontar dinero mientras el jugador está encima del círculo en la calle
    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE_BOTON_X,LOTE_BOTON_Y);
    if(dist<70){
      lote._acum+=VELOCIDAD_COMPRA_LOTE*dt;
      var enteros=Math.floor(lote._acum);
      if(enteros>0){
        lote._acum-=enteros;
        var esTerreno=(lote.fase===0);
        var precio  =esTerreno?PRECIO_LOTE_TERRENO:PRECIO_LOTE_ESTRUCTURA;
        var gKey    =esTerreno?'gastadoTerreno':'gastadoEstructura';
        var faltante=precio-lote[gKey];
        var aCobrar =Math.min(enteros,faltante,this.dinero);
        if(aCobrar>0){
          lote[gKey]+=aCobrar;
          this.dinero-=aCobrar;
          this.hudDinero.setText('Bs. '+this.dinero);
        }
        this._dibujarProgresoLote();
        if(lote[gKey]>=precio){
          lote[gKey]=precio;
          if(esTerreno){ lote.fase=1; this._aparecerTerreno(); }
          else          { lote.fase=2; this._aparecerEstructura(); }
        }
      }
    }
  }

  // Crea el Pad de recogida cuadrado en la calle
  _crearPadRecogida(){
    var scene=this, lote=this._lote;
    var x=LOTE_BOTON_X, y=LOTE_BOTON_Y;

    ['recogidaPad','monedaImg','textoAcumulado'].forEach(function(k){
      if(lote[k]){ try{lote[k].destroy();}catch(e){} lote[k]=null; }
    });

    // Dibujar base cuadrada del pad (verde brillante con fondo oscuro)
    var g = scene.add.graphics().setDepth(45);
    g.lineStyle(3, 0x00FF88, 0.95);
    g.fillStyle(0x00240F, 0.55);
    g.strokeRoundedRect(x-24, y-24, 48, 48, 6);
    g.fillRoundedRect(x-24, y-24, 48, 48, 6);
    lote.recogidaPad = g;

    // Dibujar moneda dorada (se muestra solo cuando hay dinero acumulado)
    var coin = scene.add.graphics().setDepth(46);
    coin.x = x; coin.y = y;
    coin.fillStyle(0xFFDD00, 1); coin.fillCircle(0, 0, 10);
    coin.fillStyle(0xFFCC00, 1); coin.fillCircle(0, 0, 8);
    coin.lineStyle(1.5, 0xCC8800, 1); coin.strokeCircle(0, 0, 10);
    lote.monedaImg = coin;

    // Animación de bote para la moneda
    scene.tweens.add({
      targets: coin,
      y: y - 5,
      duration: 800,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    });

    // Texto de dinero acumulado
    lote.textoAcumulado = scene.add.text(x, y - 26, '0', {
      fontFamily: "'Press Start 2P'",
      fontSize: '8px',
      color: '#FFD700',
      stroke: '#000000',
      strokeThickness: 2
    }).setOrigin(0.5).setDepth(47);

    scene._actualizarVisualRecogida();
  }

  _actualizarVisualRecogida(){
    var lote=this._lote;
    if(!lote || !lote.recogidaPad) return;
    var val = lote.acumuladoDinero || 0;
    if(val > 0){
      if(lote.monedaImg) lote.monedaImg.setVisible(true);
      if(lote.textoAcumulado) {
        lote.textoAcumulado.setVisible(true);
        lote.textoAcumulado.setText(val);
      }
    } else {
      if(lote.monedaImg) lote.monedaImg.setVisible(false);
      if(lote.textoAcumulado) lote.textoAcumulado.setVisible(false);
    }
  }

  // Muestra la imagen del terreno seco en el césped. animar=true → escala de 0 a 1

      try{

        var c=document.createElement('canvas'); c.width=iw; c.height=ih;

      }catch(e){ loteImg=null; }
    }
    if(!loteImg){
      // Fallback: rectángulo de tierra marrón
      var gc=scene.add.graphics().setDepth(43);
      gc.fillStyle(0x8B6914,1); gc.fillRect(x-40,y-32,80,65);
      gc.fillStyle(0xA07A22,1); gc.fillRect(x-35,y-27,70,55);

        gc.fillStyle(0x6B5012,1);
        gc.fillRect(x-28+i*22,y-18+(i%2)*18,6,6);

      loteImg=gc;

        fontFamily:"'Press Start 2P'",fontSize:'8px',color:'#00FFAA',stroke:'#000',strokeThickness:2

  // true si el punto (px,py) cae dentro del rectángulo del 2do
  // mercado ya construido (fase>=2). Bloquea el paso del jugador.
  _colisionaConMercado2(px,py){
    var lote=this._lote2;
    if(!lote||lote.fase<2) return false;
    var halfW=MERCADO2_COL_ANCHO/2, halfH=MERCADO2_COL_ALTO/2;
    var cx=LOTE2_X, cy=LOTE2_Y-16;
    return (px>cx-halfW && px<cx+halfW && py>cy-halfH && py<cy+halfH);
  }

  // Inicializa el objeto _lote2 y restaura el estado guardado
  _crearSistemaLote2(){
    var sv=this._lote2Save||null;
    this._lote2={
      fase:               sv?sv.fase:0,
      gastadoTerreno:     sv?sv.gastadoTerreno:0,
      gastadoEstructura:  sv?sv.gastadoEstructura:0,
      gastadoNivel2:      sv?(sv.gastadoNivel2||0):0,
      gastadoNivel3:      sv?(sv.gastadoNivel3||0):0,
      acumuladoDinero:    sv?(sv.acumuladoDinero||0):0,
      _acum:0, _acumN2:0, _acumN3:0, _ingresoTimer:0,
      circulo:null, textoFase:null, textoPrecio:null,
      barraFondo:null, barraFill:null,
      circuloN2:null, textoFaseN2:null, textoPrecioN2:null,
      barraFondoN2:null, barraFillN2:null,
      circuloN3:null, textoFaseN3:null, textoPrecioN3:null,
      barraFondoN3:null, barraFillN3:null,
      imgTerreno:null, imgEstructura:null, lblNivel:null,
      recogidaPad:null, monedaImg:null, textoAcumulado:null
    };
    if(this._lote2.fase===1) this._restaurarTerreno2(false);
    if(this._lote2.fase>=2) this._restaurarEstructura2(false);
    if(this._lote2.fase< 2) this._dibujarZonaLote2();

  // Llamado cada frame: maneja el descuento de dinero y la generación de ingresos del 2do lote
  _actualizarSistemaLote2(delta){
    var lote=this._lote2;
    if(!lote) return;
    var dt=delta/1000;

    if(lote.fase>=2){
      var ingresoActual = LOTE2_INGRESO_BS;
      if(lote.fase>=4) ingresoActual = LOTE2_INGRESO_BS_N3;
      else if(lote.fase>=3) ingresoActual = LOTE2_INGRESO_BS_N2;
      lote._ingresoTimer+=delta;
      if(lote._ingresoTimer>=LOTE2_INGRESO_MS){
        lote._ingresoTimer-=LOTE2_INGRESO_MS;
        lote.acumuladoDinero = (lote.acumuladoDinero || 0) + ingresoActual;
        this._actualizarVisualRecogida2();
      }
      if((lote.acumuladoDinero || 0) > 0){
        var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE2_BOTON_X,LOTE2_BOTON_Y);
        if(dist<36){
          var recolectado=lote.acumuladoDinero;
          lote.acumuladoDinero=0;
          this._actualizarVisualRecogida2();
          this.dinero+=recolectado;
          this.hudDinero.setText('Bs. '+this.dinero);
          AudioMgr.playRecogerDinero(this);
          var av=this.add.text(LOTE2_BOTON_X,LOTE2_BOTON_Y-30,'+Bs. '+recolectado,{
            fontFamily:"'Press Start 2P'",fontSize:'9px',
            color:'#66FF66',stroke:'#000000',strokeThickness:2
          }).setOrigin(0.5).setDepth(60);
          this.tweens.add({
            targets:av,y:LOTE2_BOTON_Y-70,alpha:0,duration:1200,
            onComplete:function(){ av.destroy(); }
          });
        }
      }

      if(lote.fase===2 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN2=Phaser.Math.Distance.Between(this.px,this.py,NIVEL2_LOTE2_ZONA_X,NIVEL2_LOTE2_ZONA_Y);
        if(distN2<70){
          lote._acumN2 += VELOCIDAD_COMPRA_NIVEL2_LOTE2*dt;
          var enterosN2=Math.floor(lote._acumN2);
          if(enterosN2>0){
            lote._acumN2-=enterosN2;
            var faltanteN2=PRECIO_NIVEL2_LOTE2-(lote.gastadoNivel2||0);
            var aCobrarN2=Math.min(enterosN2,faltanteN2,this.dinero);
            if(aCobrarN2>0){
              lote.gastadoNivel2=(lote.gastadoNivel2||0)+aCobrarN2;
              this.dinero-=aCobrarN2;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel2Lote2();
            if(lote.gastadoNivel2>=PRECIO_NIVEL2_LOTE2){
              lote.gastadoNivel2=PRECIO_NIVEL2_LOTE2;
              lote.fase=3;
              this._subirANivel2Lote2();
            }
          }
        }
      }

      if(lote.fase===3 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN3=Phaser.Math.Distance.Between(this.px,this.py,NIVEL3_LOTE2_ZONA_X,NIVEL3_LOTE2_ZONA_Y);
        if(distN3<70){
          lote._acumN3 += VELOCIDAD_COMPRA_NIVEL3_LOTE2*dt;
          var enterosN3=Math.floor(lote._acumN3);
          if(enterosN3>0){
            lote._acumN3-=enterosN3;
            var faltanteN3=PRECIO_NIVEL3_LOTE2-(lote.gastadoNivel3||0);
            var aCobrarN3=Math.min(enterosN3,faltanteN3,this.dinero);
            if(aCobrarN3>0){
              lote.gastadoNivel3=(lote.gastadoNivel3||0)+aCobrarN3;
              this.dinero-=aCobrarN3;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel3Lote2();
            if(lote.gastadoNivel3>=PRECIO_NIVEL3_LOTE2){
              lote.gastadoNivel3=PRECIO_NIVEL3_LOTE2;
              lote.fase=4;
              this._subirANivel3Lote2();
            }
          }
        }
      }
      return;
    }

    // Fase 0 o 1: descontar dinero mientras el jugador está encima del círculo en la calle
    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE2_BOTON_X,LOTE2_BOTON_Y);
    if(dist<70){
      lote._acum+=VELOCIDAD_COMPRA_LOTE2*dt;
      var enteros=Math.floor(lote._acum);
      if(enteros>0){
        lote._acum-=enteros;
        var esTerreno=(lote.fase===0);
        var precio  =esTerreno?PRECIO_LOTE2_TERRENO:PRECIO_LOTE2_ESTRUCTURA;
        var gKey    =esTerreno?'gastadoTerreno':'gastadoEstructura';
        var faltante=precio-lote[gKey];
        var aCobrar =Math.min(enteros,faltante,this.dinero);
        if(aCobrar>0){
          lote[gKey]+=aCobrar;
          this.dinero-=aCobrar;
          this.hudDinero.setText('Bs. '+this.dinero);
        }
        this._dibujarProgresoLote2();
        if(lote[gKey]>=precio){
          lote[gKey]=precio;
          if(esTerreno){ lote.fase=1; this._aparecerTerreno2(); }
          else          { lote.fase=2; this._aparecerEstructura2(); }
        }
      }
    }
  }

  _actualizarVisualRecogida2(){
    var lote=this._lote2;
    if(!lote || !lote.recogidaPad) return;
    var val = lote.acumuladoDinero || 0;
    if(val > 0){
      if(lote.monedaImg) lote.monedaImg.setVisible(true);
      if(lote.textoAcumulado) {
        lote.textoAcumulado.setVisible(true);
        lote.textoAcumulado.setText(val);
      }
    } else {
      if(lote.monedaImg) lote.monedaImg.setVisible(false);
      if(lote.textoAcumulado) lote.textoAcumulado.setVisible(false);
    }
  }

  // Muestra la imagen del terreno seco del 2do lote. animar=true → escala de 0 a 1
  _restaurarTerreno2(animar){
    var scene=this;
    var x=LOTE2_X, y=LOTE2_Y;
    var sc0=animar?0:1;
    var loteImg=null;
    if(IMG_LOTE_SECO){
      try{
        var iw=IMG_LOTE_SECO.width||200, ih=IMG_LOTE_SECO.height||160;
        var MAX=250;
        if(iw>MAX||ih>MAX){ var esc=Math.min(MAX/iw,MAX/ih); iw=Math.round(iw*esc); ih=Math.round(ih*esc); }
        var c=document.createElement('canvas'); c.width=iw; c.height=ih;
        c.getContext('2d').drawImage(IMG_LOTE_SECO,0,0,iw,ih);
        if(scene.textures.exists('lote2_seco_tex')) scene.textures.remove('lote2_seco_tex');
        scene.textures.addCanvas('lote2_seco_tex',c);
        loteImg=scene.add.image(x,y,'lote2_seco_tex').setDisplaySize(80,65).setOrigin(0.5).setDepth(43).setScale(sc0);
      }catch(e){ loteImg=null; }
    }
    if(!loteImg){
      var gc=scene.add.graphics().setDepth(43);
      gc.fillStyle(0x8B6914,1); gc.fillRect(x-40,y-32,80,65);
      gc.fillStyle(0xA07A22,1); gc.fillRect(x-35,y-27,70,55);
      gc.lineStyle(3,0x5A3A0A,1); gc.strokeRect(x-40,y-32,80,65);
      for(var i=0;i<3;i++){
        gc.fillStyle(0x6B5012,1);
        gc.fillRect(x-28+i*22,y-18+(i%2)*18,6,6);
      }
      loteImg=gc;
    }
    scene._lote2.imgTerreno=loteImg;
    if(animar){
      if(loteImg.setScale){
        scene.tweens.add({targets:loteImg,scaleX:1,scaleY:1,duration:700,ease:'Back.easeOut'});
      }
      scene.cameras.main.flash(200,255,230,100,true);
      var av=scene.add.text(x,y-56,'¡Terreno del 2do lote adquirido!',{
        fontFamily:"'Press Start 2P'",fontSize:'8px',color:'#00FFAA',stroke:'#000',strokeThickness:2
      }).setOrigin(0.5).setDepth(60);
      scene.tweens.add({targets:av,y:y-90,alpha:0,duration:1600,onComplete:function(){av.destroy();}});
      scene.time.delayedCall(800,function(){ scene._dibujarZonaLote2(); });
      scene.time.delayedCall(300,function(){
        scene._mostrarRecompensa(RECOMPENSA_LOTE2_TERRENO,'¡Compraste el 2do lote!');

    var mImg=scene.add.image(x,y-16,'mercado_mutualista')
      .setDisplaySize(130,105).setOrigin(0.5,0.5).setDepth(48).setScale(sc0);
    scene._lote2.imgEstructura=mImg;
    var textoNivel=scene._lote2.fase>=4?'★  NIVEL 3':(scene._lote2.fase>=3?'★  NIVEL 2':'★  NIVEL 1');
    var lblNivel=scene.add.text(x,y-80,textoNivel,{

      stroke:'#000000',strokeThickness:3,

  // true si el punto (px,py) cae dentro del rectángulo del 3er
  // mercado ya construido (fase>=2). Bloquea el paso del jugador.
  _colisionaConMercado3(px,py){
    var lote=this._lote3;
    if(!lote||lote.fase<2) return false;
    var halfW=MERCADO3_COL_ANCHO/2, halfH=MERCADO3_COL_ALTO/2;
    var cx=LOTE3_X, cy=LOTE3_Y-16;
    return (px>cx-halfW && px<cx+halfW && py>cy-halfH && py<cy+halfH);
  }

  // Llamado cada frame: maneja el descuento de dinero y la generación de ingresos del 3er lote
  _actualizarSistemaLote3(delta){
    var lote=this._lote3;
    if(!lote) return;
    var dt=delta/1000;

    if(lote.fase>=2){
      var ingresoActual = LOTE3_INGRESO_BS;
      if(lote.fase>=4) ingresoActual = LOTE3_INGRESO_BS_N3;
      else if(lote.fase>=3) ingresoActual = LOTE3_INGRESO_BS_N2;
      lote._ingresoTimer+=delta;
      if(lote._ingresoTimer>=LOTE3_INGRESO_MS){
        lote._ingresoTimer-=LOTE3_INGRESO_MS;
        lote.acumuladoDinero = (lote.acumuladoDinero || 0) + ingresoActual;
        this._actualizarVisualRecogida3();
      }
      if((lote.acumuladoDinero || 0) > 0){
        var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE3_BOTON_X,LOTE3_BOTON_Y);
        if(dist<36){
          var recolectado=lote.acumuladoDinero;
          lote.acumuladoDinero=0;
          this._actualizarVisualRecogida3();
          this.dinero+=recolectado;
          this.hudDinero.setText('Bs. '+this.dinero);
          AudioMgr.playRecogerDinero(this);
          var av=this.add.text(LOTE3_BOTON_X,LOTE3_BOTON_Y-30,'+Bs. '+recolectado,{
            fontFamily:"'Press Start 2P'",fontSize:'9px',
            color:'#66FF66',stroke:'#000000',strokeThickness:2
          }).setOrigin(0.5).setDepth(60);
          this.tweens.add({
            targets:av,y:LOTE3_BOTON_Y-70,alpha:0,duration:1200,
            onComplete:function(){ av.destroy(); }
          });
        }
      }

      if(lote.fase===2 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN2=Phaser.Math.Distance.Between(this.px,this.py,NIVEL2_LOTE3_ZONA_X,NIVEL2_LOTE3_ZONA_Y);
        if(distN2<70){
          lote._acumN2 += VELOCIDAD_COMPRA_NIVEL2_LOTE3*dt;
          var enterosN2=Math.floor(lote._acumN2);
          if(enterosN2>0){
            lote._acumN2-=enterosN2;
            var faltanteN2=PRECIO_NIVEL2_LOTE3-(lote.gastadoNivel2||0);
            var aCobrarN2=Math.min(enterosN2,faltanteN2,this.dinero);
            if(aCobrarN2>0){
              lote.gastadoNivel2=(lote.gastadoNivel2||0)+aCobrarN2;
              this.dinero-=aCobrarN2;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel2Lote3();
            if(lote.gastadoNivel2>=PRECIO_NIVEL2_LOTE3){
              lote.gastadoNivel2=PRECIO_NIVEL2_LOTE3;
              lote.fase=3;
              this._subirANivel2Lote3();
            }
          }
        }
      }

      if(lote.fase===3 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN3=Phaser.Math.Distance.Between(this.px,this.py,NIVEL3_LOTE3_ZONA_X,NIVEL3_LOTE3_ZONA_Y);
        if(distN3<70){
          lote._acumN3 += VELOCIDAD_COMPRA_NIVEL3_LOTE3*dt;
          var enterosN3=Math.floor(lote._acumN3);
          if(enterosN3>0){
            lote._acumN3-=enterosN3;
            var faltanteN3=PRECIO_NIVEL3_LOTE3-(lote.gastadoNivel3||0);
            var aCobrarN3=Math.min(enterosN3,faltanteN3,this.dinero);
            if(aCobrarN3>0){
              lote.gastadoNivel3=(lote.gastadoNivel3||0)+aCobrarN3;
              this.dinero-=aCobrarN3;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel3Lote3();
            if(lote.gastadoNivel3>=PRECIO_NIVEL3_LOTE3){
              lote.gastadoNivel3=PRECIO_NIVEL3_LOTE3;
              lote.fase=4;
              this._subirANivel3Lote3();
            }
          }
        }
      }
      return;
    }

    // Fase 0 o 1: descontar dinero mientras el jugador está encima del círculo en la calle
    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE3_BOTON_X,LOTE3_BOTON_Y);
    if(dist<70){
      lote._acum+=VELOCIDAD_COMPRA_LOTE3*dt;
      var enteros=Math.floor(lote._acum);
      if(enteros>0){
        lote._acum-=enteros;
        var esTerreno=(lote.fase===0);
        var precio  =esTerreno?PRECIO_LOTE3_TERRENO:PRECIO_LOTE3_ESTRUCTURA;
        var gKey    =esTerreno?'gastadoTerreno':'gastadoEstructura';
        var faltante=precio-lote[gKey];
        var aCobrar =Math.min(enteros,faltante,this.dinero);
        if(aCobrar>0){
          lote[gKey]+=aCobrar;
          this.dinero-=aCobrar;
          this.hudDinero.setText('Bs. '+this.dinero);
        }
        this._dibujarProgresoLote3();
        if(lote[gKey]>=precio){
          lote[gKey]=precio;
          if(esTerreno){ lote.fase=1; this._aparecerTerreno3(); }
          else          { lote.fase=2; this._aparecerEstructura3(); }
        }
      }
    }
  }

  // Crea el Pad de recogida cuadrado del 3er lote en la calle
  _crearPadRecogida3(){
    var scene=this, lote=this._lote3;
    var x=LOTE3_BOTON_X, y=LOTE3_BOTON_Y;

    ['recogidaPad','monedaImg','textoAcumulado'].forEach(function(k){
      if(lote[k]){ try{lote[k].destroy();}catch(e){} lote[k]=null; }
    });

    var g = scene.add.graphics().setDepth(45);
    g.lineStyle(3, 0x00FF88, 0.95);
    g.fillStyle(0x00240F, 0.55);
    g.strokeRoundedRect(x-24, y-24, 48, 48, 6);
    g.fillRoundedRect(x-24, y-24, 48, 48, 6);
    lote.recogidaPad = g;

    var coin = scene.add.graphics().setDepth(46);
    coin.x = x; coin.y = y;
    coin.fillStyle(0xFFDD00, 1); coin.fillCircle(0, 0, 10);
    coin.fillStyle(0xFFCC00, 1); coin.fillCircle(0, 0, 8);
    coin.lineStyle(1.5, 0xCC8800, 1); coin.strokeCircle(0, 0, 10);
    lote.monedaImg = coin;

    scene.tweens.add({
      targets: coin,
      y: y - 5,
      duration: 800,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    });

    lote.textoAcumulado = scene.add.text(x, y - 26, '0', {
      fontFamily: "'Press Start 2P'",
      fontSize: '8px',
      color: '#FFD700',
      stroke: '#000000',
      strokeThickness: 2
    }).setOrigin(0.5).setDepth(47);

    scene._actualizarVisualRecogida3();
  }

  _actualizarVisualRecogida3(){
    var lote=this._lote3;
    if(!lote || !lote.recogidaPad) return;
    var val = lote.acumuladoDinero || 0;
    if(val > 0){
      if(lote.monedaImg) lote.monedaImg.setVisible(true);
      if(lote.textoAcumulado) {
        lote.textoAcumulado.setVisible(true);
        lote.textoAcumulado.setText(val);
      }
    } else {
      if(lote.monedaImg) lote.monedaImg.setVisible(false);
      if(lote.textoAcumulado) lote.textoAcumulado.setVisible(false);
    }
  }

  // Compra del terreno del 3er lote completada
  _aparecerTerreno3(){
    var scene=this;
    ['circulo','textoFase','textoPrecio','barraFondo','barraFill'].forEach(function(k){
      if(scene._lote3[k]){ try{scene._lote3[k].destroy();}catch(e){} scene._lote3[k]=null; }
    });
    this._restaurarTerreno3(true);
  }

  // Muestra la imagen del terreno seco del 3er lote. animar=true → escala de 0 a 1
  _restaurarTerreno3(animar){
    var scene=this;

    var sc0=animar?0:1;
    var loteImg=null;
    if(IMG_LOTE_SECO){
      try{
        var iw=IMG_LOTE_SECO.width||200, ih=IMG_LOTE_SECO.height||160;

  // true si el punto (px,py) cae dentro del rectángulo del 4to
  // mercado ya construido (fase>=2). Bloquea el paso del jugador.
  _colisionaConMercado4(px,py){
    var lote=this._lote4;
    if(!lote||lote.fase<2) return false;
    var halfW=MERCADO4_COL_ANCHO/2, halfH=MERCADO4_COL_ALTO/2;
    var cx=LOTE4_X, cy=LOTE4_Y-16;
    return (px>cx-halfW && px<cx+halfW && py>cy-halfH && py<cy+halfH);
  }

    var sv=this._lote4Save||null;
    this._lote4={

      gastadoTerreno:     sv?sv.gastadoTerreno:0,
      gastadoEstructura:  sv?sv.gastadoEstructura:0,
      gastadoNivel2:      sv?(sv.gastadoNivel2||0):0,
      gastadoNivel3:      sv?(sv.gastadoNivel3||0):0,
      acumuladoDinero:    sv?(sv.acumuladoDinero||0):0,
      _acum:0, _acumN2:0, _acumN3:0, _ingresoTimer:0,
      circulo:null, textoFase:null, textoPrecio:null,
      barraFondo:null, barraFill:null,
      circuloN2:null, textoFaseN2:null, textoPrecioN2:null,
      barraFondoN2:null, barraFillN2:null,
      circuloN3:null, textoFaseN3:null, textoPrecioN3:null,

      imgTerreno:null, imgEstructura:null, lblNivel:null,

    };

  // Dibuja el círculo de compra (celeste = terreno, naranja = estructura) en la calle
  _dibujarZonaLote4(){
    var lote=this._lote4;
    var x=LOTE4_BOTON_X, y=LOTE4_BOTON_Y;
    ['circulo','textoFase','textoPrecio','barraFondo','barraFill'].forEach(function(k){
      if(lote[k]){ try{lote[k].destroy();}catch(e){} lote[k]=null; }
    });
    var esTerreno=(lote.fase===0);
    var color=esTerreno?0x00DDFF:0xFF9900;
    var g=this.add.graphics().setDepth(50);
    g.lineStyle(3,color,0.9);  g.strokeCircle(x,y,32);
    g.fillStyle(color,0.13);   g.fillCircle(x,y,32);
    lote.circulo=g;
    var lbl=esTerreno?'COMPRAR\nLOTE':'CONSTRUIR\nESCUELA';
    lote.textoFase=this.add.text(x,y-46,lbl,{
      fontFamily:"'Press Start 2P'",fontSize:'7px',
      color:esTerreno?'#00DDFF':'#FF9900',
      stroke:'#000',strokeThickness:2,align:'center'
    }).setOrigin(0.5).setDepth(51);

      fontFamily:"'Press Start 2P'",fontSize:'9px',
      color:'#FFFFFF',stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(51);
    lote.barraFondo=this.add.graphics().setDepth(51).setVisible(false);
    lote.barraFill =this.add.graphics().setDepth(52);
  }

  // Redibuja la barra de progreso y el texto del costo del 4to lote en la calle
  _dibujarProgresoLote4(){
    var lote=this._lote4;
    if(!lote||!lote.barraFill) return;
    var bw=60, bh=8, x=LOTE4_BOTON_X, y=LOTE4_BOTON_Y;
    var esTerreno=(lote.fase===0);
    var precio  =esTerreno?PRECIO_LOTE4_TERRENO:PRECIO_LOTE4_ESTRUCTURA;
    var gastado =esTerreno?lote.gastadoTerreno:lote.gastadoEstructura;
    lote.barraFill.clear();
    if(gastado<=0){ lote.barraFondo.setVisible(false); return; }
    lote.barraFondo.clear().setVisible(true);
    lote.barraFondo.fillStyle(0x000000,0.6);
    lote.barraFondo.fillRoundedRect(x-bw/2,y+16,bw,bh,2);
    var pct=Phaser.Math.Clamp(gastado/precio,0,1);
    lote.barraFill.fillStyle(0x00FFAA,1);
    lote.barraFill.fillRoundedRect(x-bw/2+2,y+18,(bw-4)*pct,bh-4,2);
    lote.textoPrecio.setText('Bs.'+Math.floor(gastado)+' / '+precio);

  // Llamado cada frame: maneja el descuento de dinero y la generación de ingresos del 4to lote
  _actualizarSistemaLote4(delta){
    var lote=this._lote4;
    if(!lote) return;
    var dt=delta/1000;

    if(lote.fase>=2){
      var ingresoActual = LOTE4_INGRESO_BS;
      if(lote.fase>=4) ingresoActual = LOTE4_INGRESO_BS_N3;
      else if(lote.fase>=3) ingresoActual = LOTE4_INGRESO_BS_N2;
      lote._ingresoTimer+=delta;
      if(lote._ingresoTimer>=LOTE4_INGRESO_MS){
        lote._ingresoTimer-=LOTE4_INGRESO_MS;
        lote.acumuladoDinero = (lote.acumuladoDinero || 0) + ingresoActual;
        this._actualizarVisualRecogida4();
      }
      if((lote.acumuladoDinero || 0) > 0){
        var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE4_BOTON_X,LOTE4_BOTON_Y);
        if(dist<36){
          var recolectado=lote.acumuladoDinero;
          lote.acumuladoDinero=0;
          this._actualizarVisualRecogida4();
          this.dinero+=recolectado;
          this.hudDinero.setText('Bs. '+this.dinero);
          AudioMgr.playRecogerDinero(this);
          var av=this.add.text(LOTE4_BOTON_X,LOTE4_BOTON_Y-30,'+Bs. '+recolectado,{
            fontFamily:"'Press Start 2P'",fontSize:'9px',
            color:'#66FF66',stroke:'#000000',strokeThickness:2
          }).setOrigin(0.5).setDepth(60);
          this.tweens.add({
            targets:av,y:LOTE4_BOTON_Y-70,alpha:0,duration:1200,
            onComplete:function(){ av.destroy(); }
          });
        }
      }

      if(lote.fase===2 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN2=Phaser.Math.Distance.Between(this.px,this.py,NIVEL2_LOTE4_ZONA_X,NIVEL2_LOTE4_ZONA_Y);
        if(distN2<70){
          lote._acumN2 += VELOCIDAD_COMPRA_NIVEL2_LOTE4*dt;
          var enterosN2=Math.floor(lote._acumN2);
          if(enterosN2>0){
            lote._acumN2-=enterosN2;
            var faltanteN2=PRECIO_NIVEL2_LOTE4-(lote.gastadoNivel2||0);
            var aCobrarN2=Math.min(enterosN2,faltanteN2,this.dinero);
            if(aCobrarN2>0){
              lote.gastadoNivel2=(lote.gastadoNivel2||0)+aCobrarN2;
              this.dinero-=aCobrarN2;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel2Lote4();
            if(lote.gastadoNivel2>=PRECIO_NIVEL2_LOTE4){
              lote.gastadoNivel2=PRECIO_NIVEL2_LOTE4;
              lote.fase=3;
              this._subirANivel2Lote4();
            }
          }
        }
      }

      if(lote.fase===3 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN3=Phaser.Math.Distance.Between(this.px,this.py,NIVEL3_LOTE4_ZONA_X,NIVEL3_LOTE4_ZONA_Y);
        if(distN3<70){
          lote._acumN3 += VELOCIDAD_COMPRA_NIVEL3_LOTE4*dt;
          var enterosN3=Math.floor(lote._acumN3);
          if(enterosN3>0){
            lote._acumN3-=enterosN3;
            var faltanteN3=PRECIO_NIVEL3_LOTE4-(lote.gastadoNivel3||0);
            var aCobrarN3=Math.min(enterosN3,faltanteN3,this.dinero);
            if(aCobrarN3>0){
              lote.gastadoNivel3=(lote.gastadoNivel3||0)+aCobrarN3;
              this.dinero-=aCobrarN3;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel3Lote4();
            if(lote.gastadoNivel3>=PRECIO_NIVEL3_LOTE4){
              lote.gastadoNivel3=PRECIO_NIVEL3_LOTE4;
              lote.fase=4;
              this._subirANivel3Lote4();
            }
          }
        }
      }
      return;
    }

    // Fase 0 o 1: descontar dinero mientras el jugador está encima del círculo en la calle
    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE4_BOTON_X,LOTE4_BOTON_Y);
    if(dist<70){
      lote._acum+=VELOCIDAD_COMPRA_LOTE4*dt;
      var enteros=Math.floor(lote._acum);
      if(enteros>0){
        lote._acum-=enteros;
        var esTerreno=(lote.fase===0);
        var precio  =esTerreno?PRECIO_LOTE4_TERRENO:PRECIO_LOTE4_ESTRUCTURA;
        var gKey    =esTerreno?'gastadoTerreno':'gastadoEstructura';
        var faltante=precio-lote[gKey];
        var aCobrar =Math.min(enteros,faltante,this.dinero);
        if(aCobrar>0){
          lote[gKey]+=aCobrar;
          this.dinero-=aCobrar;
          this.hudDinero.setText('Bs. '+this.dinero);
        }
        this._dibujarProgresoLote4();
        if(lote[gKey]>=precio){
          lote[gKey]=precio;
          if(esTerreno){ lote.fase=1; this._aparecerTerreno4(); }
          else          { lote.fase=2; this._aparecerEstructura4(); }
        }
      }
    }
  }

  _actualizarVisualRecogida4(){

  }

  // Muestra la imagen del terreno seco del 4to lote. animar=true → escala de 0 a 1
  _restaurarTerreno4(animar){

        c.getContext('2d').drawImage(IMG_LOTE_SECO,0,0,iw,ih);

  // true si el punto (px,py) cae dentro del rectángulo del 5to
  // mercado ya construido (fase>=2). Bloquea el paso del jugador.
  _colisionaConMercado5(px,py){
    var lote=this._lote5;
    if(!lote||lote.fase<2) return false;
    var halfW=MERCADO5_COL_ANCHO/2, halfH=MERCADO5_COL_ALTO/2;
    var cx=LOTE5_X, cy=LOTE5_Y-16;
    return (px>cx-halfW && px<cx+halfW && py>cy-halfH && py<cy+halfH);
  }

    lote.barraFondo.fillStyle(0x000000,0.6);
    lote.barraFondo.fillRoundedRect(x-bw/2,y+16,bw,bh,2);
    var pct=Phaser.Math.Clamp(gastado/precio,0,1);
    lote.barraFill.fillStyle(0x00FFAA,1);
    lote.barraFill.fillRoundedRect(x-bw/2+2,y+18,(bw-4)*pct,bh-4,2);
    lote.textoPrecio.setText('Bs.'+Math.floor(gastado)+' / '+precio);

  // Llamado cada frame: maneja el descuento de dinero y la generación de ingresos del 5to lote
  _actualizarSistemaLote5(delta){
    var lote=this._lote5;
    if(!lote) return;
    var dt=delta/1000;

    if(lote.fase>=2){
      var ingresoActual = LOTE5_INGRESO_BS;
      if(lote.fase>=4) ingresoActual = LOTE5_INGRESO_BS_N3;
      else if(lote.fase>=3) ingresoActual = LOTE5_INGRESO_BS_N2;
      lote._ingresoTimer+=delta;
      if(lote._ingresoTimer>=LOTE5_INGRESO_MS){
        lote._ingresoTimer-=LOTE5_INGRESO_MS;
        lote.acumuladoDinero = (lote.acumuladoDinero || 0) + ingresoActual;
        this._actualizarVisualRecogida5();
      }
      if((lote.acumuladoDinero || 0) > 0){
        var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE5_BOTON_X,LOTE5_BOTON_Y);
        if(dist<36){
          var recolectado=lote.acumuladoDinero;
          lote.acumuladoDinero=0;
          this._actualizarVisualRecogida5();
          this.dinero+=recolectado;
          this.hudDinero.setText('Bs. '+this.dinero);
          AudioMgr.playRecogerDinero(this);
          var av=this.add.text(LOTE5_BOTON_X,LOTE5_BOTON_Y-30,'+Bs. '+recolectado,{
            fontFamily:"'Press Start 2P'",fontSize:'9px',
            color:'#66FF66',stroke:'#000000',strokeThickness:2
          }).setOrigin(0.5).setDepth(60);
          this.tweens.add({
            targets:av,y:LOTE5_BOTON_Y-70,alpha:0,duration:1200,
            onComplete:function(){ av.destroy(); }
          });
        }
      }

      if(lote.fase===2 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN2=Phaser.Math.Distance.Between(this.px,this.py,NIVEL2_LOTE5_ZONA_X,NIVEL2_LOTE5_ZONA_Y);
        if(distN2<70){
          lote._acumN2 += VELOCIDAD_COMPRA_NIVEL2_LOTE5*dt;
          var enterosN2=Math.floor(lote._acumN2);
          if(enterosN2>0){
            lote._acumN2-=enterosN2;
            var faltanteN2=PRECIO_NIVEL2_LOTE5-(lote.gastadoNivel2||0);
            var aCobrarN2=Math.min(enterosN2,faltanteN2,this.dinero);
            if(aCobrarN2>0){
              lote.gastadoNivel2=(lote.gastadoNivel2||0)+aCobrarN2;
              this.dinero-=aCobrarN2;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel2Lote5();
            if(lote.gastadoNivel2>=PRECIO_NIVEL2_LOTE5){
              lote.gastadoNivel2=PRECIO_NIVEL2_LOTE5;
              lote.fase=3;
              this._subirANivel2Lote5();
            }
          }
        }
      }

      if(lote.fase===3 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN3=Phaser.Math.Distance.Between(this.px,this.py,NIVEL3_LOTE5_ZONA_X,NIVEL3_LOTE5_ZONA_Y);
        if(distN3<70){
          lote._acumN3 += VELOCIDAD_COMPRA_NIVEL3_LOTE5*dt;
          var enterosN3=Math.floor(lote._acumN3);
          if(enterosN3>0){
            lote._acumN3-=enterosN3;
            var faltanteN3=PRECIO_NIVEL3_LOTE5-(lote.gastadoNivel3||0);
            var aCobrarN3=Math.min(enterosN3,faltanteN3,this.dinero);
            if(aCobrarN3>0){
              lote.gastadoNivel3=(lote.gastadoNivel3||0)+aCobrarN3;
              this.dinero-=aCobrarN3;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel3Lote5();
            if(lote.gastadoNivel3>=PRECIO_NIVEL3_LOTE5){
              lote.gastadoNivel3=PRECIO_NIVEL3_LOTE5;
              lote.fase=4;
              this._subirANivel3Lote5();
            }
          }
        }
      }
      return;
    }

    // Fase 0 o 1: descontar dinero mientras el jugador esté encima del círculo en la calle
    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE5_BOTON_X,LOTE5_BOTON_Y);
    if(dist<70){
      lote._acum+=VELOCIDAD_COMPRA_LOTE5*dt;
      var enteros=Math.floor(lote._acum);
      if(enteros>0){
        lote._acum-=enteros;
        var esTerreno=(lote.fase===0);
        var precio  =esTerreno?PRECIO_LOTE5_TERRENO:PRECIO_LOTE5_ESTRUCTURA;
        var gKey    =esTerreno?'gastadoTerreno':'gastadoEstructura';
        var faltante=precio-lote[gKey];
        var aCobrar =Math.min(enteros,faltante,this.dinero);
        if(aCobrar>0){
          lote[gKey]+=aCobrar;
          this.dinero-=aCobrar;
          this.hudDinero.setText('Bs. '+this.dinero);
        }
        this._dibujarProgresoLote5();
        if(lote[gKey]>=precio){
          lote[gKey]=precio;
          if(esTerreno){ lote.fase=1; this._aparecerTerreno5(); }
          else          { lote.fase=2; this._aparecerEstructura5(); }
        }
      }
    }
  }

  _actualizarVisualRecogida5(){
    var lote=this._lote5;
    if(!lote || !lote.recogidaPad) return;
    var val = lote.acumuladoDinero || 0;
    if(val > 0){
      if(lote.monedaImg) lote.monedaImg.setVisible(true);
      if(lote.textoAcumulado) {
        lote.textoAcumulado.setVisible(true);
        lote.textoAcumulado.setText(val);
      }
    } else {
      if(lote.monedaImg) lote.monedaImg.setVisible(false);
      if(lote.textoAcumulado) lote.textoAcumulado.setVisible(false);
    }
  }

  // Muestra la imagen del terreno seco del 5to lote. animar=true -> escala de 0 a 1
  _restaurarTerreno5(animar){
    var scene=this;
    var x=LOTE5_X, y=LOTE5_Y;
    var sc0=animar?0:1;

    if(IMG_LOTE_SECO){
      try{
        var iw=IMG_LOTE_SECO.width||200, ih=IMG_LOTE_SECO.height||160;
        var MAX=250;
        if(iw>MAX||ih>MAX){ var esc=Math.min(MAX/iw,MAX/ih); iw=Math.round(iw*esc); ih=Math.round(ih*esc); }
        var c=document.createElement('canvas'); c.width=iw; c.height=ih;
        c.getContext('2d').drawImage(IMG_LOTE_SECO,0,0,iw,ih);
        if(scene.textures.exists('lote5_seco_tex')) scene.textures.remove('lote5_seco_tex');
        scene.textures.addCanvas('lote5_seco_tex',c);
        loteImg=scene.add.image(x,y,'lote5_seco_tex').setDisplaySize(80,65).setOrigin(0.5).setDepth(43).setScale(sc0);
      }catch(e){ loteImg=null; }
    }
    if(!loteImg){
      var gc=scene.add.graphics().setDepth(43);
      gc.fillStyle(0x8B6914,1); gc.fillRect(x-40,y-32,80,65);
      gc.fillStyle(0xA07A22,1); gc.fillRect(x-35,y-27,70,55);
      gc.lineStyle(3,0x5A3A0A,1); gc.strokeRect(x-40,y-32,80,65);
      for(var i=0;i<3;i++){
        gc.fillStyle(0x6B5012,1);
        gc.fillRect(x-28+i*22,y-18+(i%2)*18,6,6);
      }
      loteImg=gc;
    }
    scene._lote5.imgTerreno=loteImg;
    if(animar){
      if(loteImg.setScale){
        scene.tweens.add({targets:loteImg,scaleX:1,scaleY:1,duration:700,ease:'Back.easeOut'});
      }
      scene.cameras.main.flash(200,255,230,100,true);
      var av=scene.add.text(x,y-56,'¡Terreno de Pizzanchez adquirido!',{
        fontFamily:"'Press Start 2P'",fontSize:'8px',color:'#00FFAA',stroke:'#000',strokeThickness:2
      }).setOrigin(0.5).setDepth(60);
      scene.tweens.add({targets:av,y:y-90,alpha:0,duration:1600,onComplete:function(){av.destroy();}});
      scene.time.delayedCall(800,function(){ scene._dibujarZonaLote5(); });
      scene.time.delayedCall(300,function(){
        scene._mostrarRecompensa(RECOMPENSA_LOTE5_TERRENO,'¡Compraste el 5to lote!');
      });
    }

  // ── SISTEMA DEL SEXTO LOTE / NEGOCIO (debajo del cuarto lote)
  // ──

  // true si el punto (px,py) cae dentro del rectángulo del 6to
  // mercado ya construido (fase>=2). Bloquea el paso del jugador.
  _colisionaConMercado6(px,py){
    var lote=this._lote6;
    if(!lote||lote.fase<2) return false;
    var halfW=MERCADO6_COL_ANCHO/2, halfH=MERCADO6_COL_ALTO/2;
    var cx=LOTE6_X, cy=LOTE6_Y-16;
    return (px>cx-halfW && px<cx+halfW && py>cy-halfH && py<cy+halfH);
  }

  // Inicializa el objeto _lote6 y restaura el estado guardado
  _crearSistemaLote6(){
    var sv=this._lote6Save||null;
    this._lote6={
      fase:               sv?sv.fase:0,
      gastadoTerreno:     sv?sv.gastadoTerreno:0,
      gastadoEstructura:  sv?sv.gastadoEstructura:0,
      gastadoNivel2:      sv?(sv.gastadoNivel2||0):0,
      gastadoNivel3:      sv?(sv.gastadoNivel3||0):0,
      acumuladoDinero:    sv?(sv.acumuladoDinero||0):0,
      _acum:0, _acumN2:0, _acumN3:0, _ingresoTimer:0,
      circulo:null, textoFase:null, textoPrecio:null,
      barraFondo:null, barraFill:null,
      circuloN2:null, textoFaseN2:null, textoPrecioN2:null,
      barraFondoN2:null, barraFillN2:null,
      circuloN3:null, textoFaseN3:null, textoPrecioN3:null,
      barraFondoN3:null, barraFillN3:null,
      imgTerreno:null, imgEstructura:null, lblNivel:null,
      recogidaPad:null, monedaImg:null, textoAcumulado:null
    };
    if(this._lote6.fase===1) this._restaurarTerreno6(false);
    if(this._lote6.fase>=2) this._restaurarEstructura6(false);
    if(this._lote6.fase< 2) this._dibujarZonaLote6();
  }

  // Dibuja el círculo de compra (celeste = terreno, naranja = estructura) en la calle
  _dibujarZonaLote6(){
    var lote=this._lote6;
    var x=LOTE6_BOTON_X, y=LOTE6_BOTON_Y;
    ['circulo','textoFase','textoPrecio','barraFondo','barraFill'].forEach(function(k){
      if(lote[k]){ try{lote[k].destroy();}catch(e){} lote[k]=null; }
    });
    var esTerreno=(lote.fase===0);
    var color=esTerreno?0x00DDFF:0xFF9900;
    var g=this.add.graphics().setDepth(50);
    g.lineStyle(3,color,0.9);  g.strokeCircle(x,y,32);
    g.fillStyle(color,0.13);   g.fillCircle(x,y,32);
    lote.circulo=g;
    var lbl=esTerreno?'COMPRAR\nLOTE':'CONSTRUIR\nRESTAURANTE';
    lote.textoFase=this.add.text(x,y-46,lbl,{
      fontFamily:"'Press Start 2P'",fontSize:'7px',
      color:esTerreno?'#00DDFF':'#FF9900',
      stroke:'#000',strokeThickness:2,align:'center'
    }).setOrigin(0.5).setDepth(51);

    lote.textoPrecio=this.add.text(x,y+4,'Bs. '+precio,{
      fontFamily:"'Press Start 2P'",fontSize:'9px',
      color:'#FFFFFF',stroke:'#000',strokeThickness:2
    }).setOrigin(0.5).setDepth(51);
    lote.barraFondo=this.add.graphics().setDepth(51).setVisible(false);
    lote.barraFill =this.add.graphics().setDepth(52);
  }

  // Redibuja la barra de progreso y el texto del costo del 6to lote en la calle
  _dibujarProgresoLote6(){
    var lote=this._lote6;
    if(!lote||!lote.barraFill) return;
    var bw=60, bh=8, x=LOTE6_BOTON_X, y=LOTE6_BOTON_Y;
    var esTerreno=(lote.fase===0);
    var precio  =esTerreno?PRECIO_LOTE6_TERRENO:PRECIO_LOTE6_ESTRUCTURA;
    var gastado =esTerreno?lote.gastadoTerreno:lote.gastadoEstructura;
    lote.barraFill.clear();
    if(gastado<=0){ lote.barraFondo.setVisible(false); return; }
    lote.barraFondo.clear().setVisible(true);
    lote.barraFondo.fillStyle(0x000000,0.6);
    lote.barraFondo.fillRoundedRect(x-bw/2,y+16,bw,bh,2);
    var pct=Phaser.Math.Clamp(gastado/precio,0,1);
    lote.barraFill.fillStyle(0x00FFAA,1);
    lote.barraFill.fillRoundedRect(x-bw/2+2,y+18,(bw-4)*pct,bh-4,2);
    lote.textoPrecio.setText('Bs.'+Math.floor(gastado)+' / '+precio);
  }

  // Llamado cada frame: maneja el descuento de dinero y la generación de ingresos del 6to lote
  _actualizarSistemaLote6(delta){
    var lote=this._lote6;
    if(!lote) return;
    var dt=delta/1000;

    if(lote.fase>=2){
      var ingresoActual = LOTE6_INGRESO_BS;
      if(lote.fase>=4) ingresoActual = LOTE6_INGRESO_BS_N3;
      else if(lote.fase>=3) ingresoActual = LOTE6_INGRESO_BS_N2;
      lote._ingresoTimer+=delta;
      if(lote._ingresoTimer>=LOTE6_INGRESO_MS){
        lote._ingresoTimer-=LOTE6_INGRESO_MS;
        lote.acumuladoDinero = (lote.acumuladoDinero || 0) + ingresoActual;
        this._actualizarVisualRecogida6();
      }
      if((lote.acumuladoDinero || 0) > 0){
        var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE6_BOTON_X,LOTE6_BOTON_Y);
        if(dist<36){
          var recolectado=lote.acumuladoDinero;
          lote.acumuladoDinero=0;
          this._actualizarVisualRecogida6();
          this.dinero+=recolectado;
          this.hudDinero.setText('Bs. '+this.dinero);
          AudioMgr.playRecogerDinero(this);
          var av=this.add.text(LOTE6_BOTON_X,LOTE6_BOTON_Y-30,'+Bs. '+recolectado,{
            fontFamily:"'Press Start 2P'",fontSize:'9px',
            color:'#66FF66',stroke:'#000000',strokeThickness:2
          }).setOrigin(0.5).setDepth(60);
          this.tweens.add({
            targets:av,y:LOTE6_BOTON_Y-70,alpha:0,duration:1200,
            onComplete:function(){ av.destroy(); }
          });
        }
      }

      if(lote.fase===2 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN2=Phaser.Math.Distance.Between(this.px,this.py,NIVEL2_LOTE6_ZONA_X,NIVEL2_LOTE6_ZONA_Y);
        if(distN2<70){
          lote._acumN2 += VELOCIDAD_COMPRA_NIVEL2_LOTE6*dt;
          var enterosN2=Math.floor(lote._acumN2);
          if(enterosN2>0){
            lote._acumN2-=enterosN2;
            var faltanteN2=PRECIO_NIVEL2_LOTE6-(lote.gastadoNivel2||0);
            var aCobrarN2=Math.min(enterosN2,faltanteN2,this.dinero);
            if(aCobrarN2>0){
              lote.gastadoNivel2=(lote.gastadoNivel2||0)+aCobrarN2;
              this.dinero-=aCobrarN2;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel2Lote6();
            if(lote.gastadoNivel2>=PRECIO_NIVEL2_LOTE6){
              lote.gastadoNivel2=PRECIO_NIVEL2_LOTE6;
              lote.fase=3;
              this._subirANivel2Lote6();
            }
          }
        }
      }

      if(lote.fase===3 && !this._pausado && !this._dialogo && !this._tutorialActivo){
        var distN3=Phaser.Math.Distance.Between(this.px,this.py,NIVEL3_LOTE6_ZONA_X,NIVEL3_LOTE6_ZONA_Y);
        if(distN3<70){
          lote._acumN3 += VELOCIDAD_COMPRA_NIVEL3_LOTE6*dt;
          var enterosN3=Math.floor(lote._acumN3);
          if(enterosN3>0){
            lote._acumN3-=enterosN3;
            var faltanteN3=PRECIO_NIVEL3_LOTE6-(lote.gastadoNivel3||0);
            var aCobrarN3=Math.min(enterosN3,faltanteN3,this.dinero);
            if(aCobrarN3>0){
              lote.gastadoNivel3=(lote.gastadoNivel3||0)+aCobrarN3;
              this.dinero-=aCobrarN3;
              this.hudDinero.setText('Bs. '+this.dinero);
            }
            this._dibujarProgresoNivel3Lote6();
            if(lote.gastadoNivel3>=PRECIO_NIVEL3_LOTE6){
              lote.gastadoNivel3=PRECIO_NIVEL3_LOTE6;
              lote.fase=4;
              this._subirANivel3Lote6();
            }
          }
        }
      }
      return;
    }

    // Fase 0 o 1: descontar dinero mientras el jugador esté encima del círculo en la calle
    if(this._pausado||this._dialogo||this._tutorialActivo) return;
    var dist=Phaser.Math.Distance.Between(this.px,this.py,LOTE6_BOTON_X,LOTE6_BOTON_Y);
    if(dist<70){
      lote._acum+=VELOCIDAD_COMPRA_LOTE6*dt;
      var enteros=Math.floor(lote._acum);
      if(enteros>0){
        lote._acum-=enteros;
        var esTerreno=(lote.fase===0);
        var precio  =esTerreno?PRECIO_LOTE6_TERRENO:PRECIO_LOTE6_ESTRUCTURA;
        var gKey    =esTerreno?'gastadoTerreno':'gastadoEstructura';
        var faltante=precio-lote[gKey];
        var aCobrar =Math.min(enteros,faltante,this.dinero);
        if(aCobrar>0){
          lote[gKey]+=aCobrar;
          this.dinero-=aCobrar;
          this.hudDinero.setText('Bs. '+this.dinero);
        }
        this._dibujarProgresoLote6();
        if(lote[gKey]>=precio){
          lote[gKey]=precio;
          if(esTerreno){ lote.fase=1; this._aparecerTerreno6(); }
          else          { lote.fase=2; this._aparecerEstructura6(); }
        }
      }
    }
  }

  _actualizarVisualRecogida6(){

      if(lote.monedaImg) lote.monedaImg.setVisible(true);

      gastadoTerreno:     sv?sv.gastadoTerreno:0,
      gastadoEstructura:  sv?sv.gastadoEstructura:0,

    };

    if(this._lote7.fase===1) this._restaurarTerreno7(false);

  _dibujarProgresoLote7(){
    var lote=this._lote7;
    if(!lote||!lote.barraFill) return;
    var bw=60, bh=8, x=LOTE7_BOTON_X, y=LOTE7_BOTON_Y;
    var esTerreno=(lote.fase===0);
    var precio  =esTerreno?PRECIO_LOTE7_TERRENO:PRECIO_LOTE7_ESTRUCTURA;
    var gastado =esTerreno?lote.gastadoTerreno:lote.gastadoEstructura;
    lote.barraFill.clear();
    if(gastado<=0){ lote.barraFondo.setVisible(false); return; }
    lote.barraFondo.clear().setVisible(true);
    lote.barraFondo.fillStyle(0x000000,0.6);
    lote.barraFondo.fillRoundedRect(x-bw/2,y+16,bw,bh,2);
    var pct=Phaser.Math.Clamp(gastado/precio,0,1);
    lote.barraFill.fillStyle(0x00FFAA,1);
    lote.barraFill.fillRoundedRect(x-bw/2+2,y+18,(bw-4)*pct,bh-4,2);
    lote.textoPrecio.setText('Bs.'+Math.floor(gastado)+' / '+precio);
